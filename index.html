.section-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#8aa0cc;margin-bottom:12px}
.mbtn{width:100%;padding:16px 12px;border:none;border-radius:12px;color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:700;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;margin-bottom:10px;text-align:center}.mbtn::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(255,255,255,.03) 8px,rgba(255,255,255,.03) 9px);pointer-events:none}.mbtn:active{transform:scale(.97)}.mbtn:disabled{opacity:.3;cursor:default}
.mbtn-pal{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #4a7fff;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn-night{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #e6a919;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn-mini{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #9b59b6;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn-casual{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #48c9b0;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn .ico{font-size:26px;flex-shrink:0}.mbtn .lbl{font-size:15px;display:block;font-family:'Playfair Display',Georgia,serif;color:#e8edf5}.mbtn .desc{font-size:11px;color:#4a5a80;font-family:'DM Sans',sans-serif;font-weight:400}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chip{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;border:2px solid #15192a;background:#0a0e18;color:#4a5a80}.chip.on{color:#fff;border-color:transparent}.chip:active{transform:scale(.95)}
.add-player-row{display:flex;gap:8px;margin-top:12px}.add-player-row input{flex:1;padding:10px 12px;border:2px solid #15192a;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#060a12;color:#e8edf5}.add-player-row input:focus{border-color:#4a7fff}.add-player-row input::placeholder{color:#4a6380}.add-player-row button{padding:10px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
.score-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;margin-bottom:8px}.score-row .name{flex:1;font-weight:600;font-size:15px;color:#e8edf5}
.teams-box{margin-bottom:20px;padding:14px;background:#0a0e18;border-radius:10px;border:1px solid #15192a}.teams-grid{display:flex;gap:10px}.teams-grid>div{flex:1}.team-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.team-player{display:block;width:100%;margin-bottom:4px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left}
.save-btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;transition:all .2s}.save-btn.ok{background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12;box-shadow:0 4px 16px rgba(212,160,23,.3)}.save-btn.disabled{background:#15192a;color:#4a6380;cursor:default}
.cancel-btn{border:none;background:#15192a;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#7a8faa;font-family:inherit}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.game-player{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;margin-bottom:4px}.game-player .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.game-player .pname{flex:1;font-size:14px;color:#d0dae8}.game-player .pscore{font-size:18px;font-weight:700;font-family:'Playfair Display',Georgia,serif;min-width:36px;text-align:right}.game-winner{background:rgba(30,132,73,.1)}.game-loser{background:rgba(192,57,43,.1)}

/* ═══════════════════════════════════════════════════════════
   ESTÉTICA PERGAMINO — sección "Nueva partida" + flujo de partida
   Selectores :has() apuntan a cards específicas sin afectar al resto.
   ═══════════════════════════════════════════════════════════ */

/* === FONDO PERGAMINO en home + flujo de partida === */
.card:has(.mbtn),
.card:has(#spinner-name),
.card:has([data-rplayer]),
.card:has([data-bplayer]),
.card:has(.summary-winner){
  background-color:transparent !important;
  background-image:url('parchment.webp') !important;
  background-size:100% 100% !important;
  background-repeat:no-repeat !important;
  border:none !important;
  box-shadow:none !important;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.55));
  overflow:visible !important;
}
.card:has(.mbtn)::before,
.card:has(#spinner-name)::before,
.card:has([data-rplayer])::before,
.card:has([data-bplayer])::before,
.card:has(.summary-winner)::before{display:none !important}

/* Paddings específicos por pantalla */
.card:has(.mbtn){padding:34px 34px 24px !important}
.card:has(#spinner-name){padding:40px 30px !important}
.card:has([data-rplayer]),
.card:has([data-bplayer]),
.card:has(.summary-winner){padding:34px 28px 26px !important}

/* === TÍTULOS DE SECCIÓN sobre pergamino === */
.card:has(.mbtn) > .section-title,
.card:has(#spinner-name) .section-title,
.card:has([data-rplayer]) .section-title,
.card:has([data-bplayer]) .section-title,
.card:has(.summary-winner) .section-title{
  font-family:'Playfair Display',Georgia,serif !important;
  font-style:italic !important;
  font-weight:700 !important;
  font-size:24px !important;
  color:#3a2412 !important;
  text-shadow:0 1px 0 rgba(255,240,210,.4);
  margin-bottom:14px !important;
}

/* === HOME: tarjetas .mbtn = panel metálico === */
.card:has(.mbtn) .mbtn{
  background-color:transparent !important;
  background-image:url('panel.webp') !important;
  background-size:100% 100% !important;
  background-repeat:no-repeat !important;
  border:none !important;
  border-radius:0 !important;
  padding:10px 16px 10px 12px !important;
  min-height:62px;
  gap:12px !important;
  margin-bottom:10px !important;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));
}
.card:has(.mbtn) .mbtn::before,
.card:has(.mbtn) .mbtn::after{display:none !important}
.card:has(.mbtn) .mbtn:disabled{opacity:.4}
.card:has(.mbtn) .mbtn .ico{
  width:50px !important;height:50px !important;
  background-image:url('medal.webp') !important;
  background-size:contain !important;
  background-repeat:no-repeat !important;
  background-position:center !important;
  display:flex !important;align-items:center !important;justify-content:center !important;
  font-size:20px !important;flex-shrink:0 !important;
  white-space:nowrap !important;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)) !important;
}
.card:has(.mbtn) .mbtn-night .ico{font-size:15px !important;letter-spacing:-1px !important}
.card:has(.mbtn) .mbtn .lbl{
  color:#fff4dc !important;font-weight:700 !important;
  text-shadow:0 2px 4px rgba(0,0,0,.95),0 1px 1px rgba(0,0,0,1),1px 0 2px rgba(0,0,0,.9),-1px 0 2px rgba(0,0,0,.9) !important;
  letter-spacing:.01em !important;
}
.card:has(.mbtn) .mbtn .desc{
  color:#e8c878 !important;font-weight:600 !important;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 1px 1px rgba(0,0,0,1),1px 0 2px rgba(0,0,0,.85) !important;
}

/* === SPINNER (quién empieza): nombre con halo y avatar con marco === */
.card:has(#spinner-name) #spinner-name{
  text-shadow:0 2px 4px rgba(255,240,210,.5),0 0 6px rgba(58,36,18,.2) !important;
  font-size:42px !important;
}
.card:has(#spinner-name) #spinner-frase{
  color:#7a1f1f !important;
  text-shadow:0 1px 0 rgba(255,240,210,.4) !important;
  font-weight:700 !important;
}

/* === SCOREBOARD sobre pergamino === */
.card:has([data-rplayer]) .scoreboard td,
.card:has(.summary-winner) .scoreboard td{color:#3a2412 !important;font-weight:600 !important}
.card:has([data-rplayer]) .scoreboard .round-label,
.card:has(.summary-winner) .scoreboard .round-label{color:#6a4530 !important}
.card:has([data-rplayer]) .scoreboard th,
.card:has(.summary-winner) .scoreboard th{
  border-bottom-color:rgba(58,36,18,.25) !important;
  text-shadow:0 1px 0 rgba(255,240,210,.4) !important;
}
.card:has([data-rplayer]) .scoreboard td,
.card:has(.summary-winner) .scoreboard td{
  border-bottom-color:rgba(58,36,18,.12) !important;
}
.card:has([data-rplayer]) .scoreboard .total-row td,
.card:has(.summary-winner) .scoreboard .total-row td{
  color:#1a3680 !important;
  border-top-color:rgba(26,54,128,.4) !important;
}

/* === score-row (fila de jugador en partida) === */
.card:has([data-rplayer]) .score-row .name,
.card:has([data-bplayer]) .score-row .name{
  color:#fff4dc !important;
  text-shadow:0 1px 2px rgba(0,0,0,.7) !important;
}

/* === taunt-box sobre pergamino === */
.card:has([data-rplayer]) .taunt-box{
  background:rgba(40,15,5,.85) !important;
  border-color:rgba(231,76,60,.5) !important;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}

/* === Cancel-btn (Abandonar) más sutil sobre pergamino === */
.card:has([data-rplayer]) .cancel-btn,
.card:has([data-bplayer]) .cancel-btn{
  background:rgba(20,10,5,.4) !important;
  color:#3a2412 !important;
  border:1px solid rgba(58,36,18,.4) !important;
  font-weight:600 !important;
}

/* === BOTONES TEMÁTICOS: ¡Vamos!, Siguiente, Finalizar, Guardar === */
.card:has(#spinner-name) #spinner-go,
.card:has([data-rplayer]) .btn-row > button,
.card:has([data-bplayer]) .save-btn,
.card:has(.summary-winner) .save-btn{
  background-color:transparent !important;
  background-image:url('panel.webp') !important;
  background-size:100% 100% !important;
  background-repeat:no-repeat !important;
  color:#fff4dc !important;
  text-shadow:0 2px 3px rgba(0,0,0,.95),0 1px 1px rgba(0,0,0,1) !important;
  border-radius:0 !important;
  border:none !important;
  font-family:'Playfair Display',Georgia,serif !important;
  font-weight:700 !important;
  min-height:54px !important;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));
  box-shadow:none !important;
}
.card:has([data-rplayer]) .btn-row > button:disabled,
.card:has([data-bplayer]) .save-btn.disabled,
.card:has(.summary-winner) .save-btn.disabled{
  opacity:.4 !important;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)) grayscale(.4) !important;
}

/* === Summary-winner: pergamino dentro de pergamino, ajustar === */
.card:has(.summary-winner) .summary-winner{
  background:rgba(255,240,200,.25) !important;
  border:2px solid rgba(58,36,18,.3) !important;
}
/* winner-name color = gc(winner) via inline style */
.card:has(.summary-winner) .summary-winner .winner-score{color:#7a4a1a !important;text-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 rgba(255,240,210,.4) !important}



/* === FIXES contraste pantalla playing === */
/* Nombres en score-row: tinta oscura sobre el tinte del jugador */
.card:has([data-rplayer]) .score-row .name,
.card:has([data-bplayer]) .score-row .name{
  color:#fff4dc !important;
  text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.6) !important;
  font-weight:700 !important;
}
/* Fondo del score-row: más opaco para destacar sobre pergamino */
.card:has([data-rplayer]) .score-row,
.card:has([data-bplayer]) .score-row{
  background-color:rgba(20,15,10,.55) !important;
  backdrop-filter:blur(2px);
}
/* Total acumulado (span con style color:#4a5a80 inline) - override con !important */
.card:has([data-rplayer]) .score-row > span:nth-child(2),
.card:has([data-bplayer]) .score-row > span:nth-child(2){
  color:#e8c878 !important;
  font-weight:700 !important;
  text-shadow:0 1px 2px rgba(0,0,0,.8) !important;
}
/* Botón disabled: menos grayscale para que se note panel */
.card:has([data-rplayer]) .btn-row > button:disabled,
.card:has([data-bplayer]) .save-btn.disabled,
.card:has(.summary-winner) .save-btn.disabled{
  opacity:.55 !important;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)) !important;
}



/* === COLORES DE JUGADOR sobre pergamino: añadir sombra y peso === */
.card:has([data-rplayer]) .scoreboard th,
.card:has(.summary-winner) .scoreboard th,
.card:has(#spinner-name) #spinner-name{
  text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 4px rgba(0,0,0,.25),0 1px 0 rgba(255,240,210,.3) !important;
  font-weight:800 !important;
}



/* ═══════════════════════════════════════════════════════════
   ESTÉTICA PERGAMINO — Porra y Mini
   #app[data-view] permite aplicar estilos por pestaña sin
   afectar al resto de vistas.
   ═══════════════════════════════════════════════════════════ */

/* === Cards de Porra y Mini → pergamino === */
#app[data-view="porra"] .card,
#app[data-view="mini"] .card,
#app[data-view="porra"] .crown-box,
#app[data-view="mini"] .crown-box,
#app[data-view="porra"] .cb-card,
#app[data-view="mini"] .cb-card{
  background-color:transparent !important;
  background-image:url('parchment.webp') !important;
  background-size:100% 100% !important;
  background-repeat:no-repeat !important;
  border:none !important;
  box-shadow:none !important;
  padding:30px 26px 24px !important;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));
  overflow:visible !important;
}
#app[data-view="porra"] .card::before,
#app[data-view="mini"] .card::before{display:none !important}

/* === Títulos en tinta oscura === */
#app[data-view="porra"] .section-title,
#app[data-view="mini"] .section-title{
  color:#3a2412 !important;
  font-style:italic !important;
  text-shadow:0 1px 0 rgba(255,240,210,.4);
  font-size:20px !important;
}

/* === Texto gris claro (#e8edf5, #d0dae8) → tinta oscura sobre pergamino === */
#app[data-view="porra"] [style*="color:#e8edf5"],
#app[data-view="mini"] [style*="color:#e8edf5"],
#app[data-view="porra"] [style*="color:#d0dae8"],
#app[data-view="mini"] [style*="color:#d0dae8"]{
  color:#2a1810 !important;
  font-weight:700 !important;
  text-shadow:0 1px 0 rgba(255,240,210,.4) !important;
}

/* === Texto gris medio (#4a5a80) → tinta marrón medio === */
#app[data-view="porra"] [style*="color:#4a5a80"],
#app[data-view="mini"] [style*="color:#4a5a80"]{
  color:#6a4530 !important;
  text-shadow:0 1px 0 rgba(255,240,210,.3) !important;
}
#app[data-view="porra"] .mini-stat .lbl,
#app[data-view="mini"] .mini-stat .lbl,
#app[data-view="porra"] .record-label,
#app[data-view="mini"] .record-label{
  color:#6a4530 !important;
  text-shadow:0 1px 0 rgba(255,240,210,.3) !important;
  font-weight:600 !important;
}

/* === Stat-bar (fondo) sobre pergamino: hacer la base oscura para contraste con la barra de color === */
#app[data-view="porra"] .stat-bar,
#app[data-view="mini"] .stat-bar{
  background:rgba(20,10,5,.35) !important;
}

/* === Record-item border-bottom más suave === */
#app[data-view="mini"] .record-item{
  border-bottom-color:rgba(58,36,18,.2) !important;
}

/* === PAL-PLAYER (filas de "La Porra") sobre pergamino === */
#app[data-view="porra"] .pal-player.top{
  background:rgba(192,57,43,.18) !important;
  border-color:rgba(192,57,43,.5) !important;
}
#app[data-view="porra"] .pal-player.rest{
  background:rgba(20,15,10,.4) !important;
  border-color:rgba(58,36,18,.4) !important;
}
#app[data-view="porra"] .pal-bar{
  background:rgba(20,10,5,.4) !important;
}

/* === HIST-ITEM (historial) === */
#app[data-view="porra"] .hist-item,
#app[data-view="mini"] .hist-item{
  background:rgba(20,15,10,.4) !important;
  border:1px solid rgba(58,36,18,.3) !important;
  border-left:4px solid !important;
}

/* === Caja "Total gastado" en historial paletillas === */
#app[data-view="porra"] [style*="background:#060a12"]{
  background:rgba(20,15,10,.55) !important;
  border-color:rgba(58,36,18,.4) !important;
}

/* === CROWN-BOX (Mini campeón) sobre pergamino === */
#app[data-view="mini"] .crown-box{
  text-align:center;
  padding:24px 20px !important;
}
#app[data-view="mini"] .crown-box .crown-emoji{
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
}
#app[data-view="mini"] .crown-box .crown-name{
  text-shadow:0 1px 2px rgba(0,0,0,.4),0 1px 0 rgba(255,240,210,.4) !important;
  font-weight:900 !important;
}
#app[data-view="mini"] .crown-box .crown-reign{
  color:#6a4530 !important;
  text-shadow:0 1px 0 rgba(255,240,210,.3) !important;
}

/* === CB-CARD (Carta Blanca) sobre pergamino === */
#app[data-view="mini"] .cb-card{
  padding:24px 22px !important;
}
#app[data-view="mini"] .cb-card .section-title{
  color:#6c2a8a !important;
  text-shadow:0 1px 0 rgba(255,240,210,.4) !important;
}
#app[data-view="mini"] .cb-card [style*="border-top"]{
  border-top-color:rgba(58,36,18,.3) !important;
}

/* === DOM-BAR (Dominio Mini) — añadir contraste === */
#app[data-view="mini"] .dom-bar{
  box-shadow:inset 0 2px 4px rgba(0,0,0,.4),0 1px 2px rgba(255,240,210,.3) !important;
}

/* === BOTÓN "Cerrar y comprar paletilla" → panel metálico === */
#app[data-view="porra"] .close-pal-btn{
  background-color:transparent !important;
  background-image:url('panel.webp') !important;
  background-size:100% 100% !important;
  background-repeat:no-repeat !important;
  color:#fff4dc !important;
  text-shadow:0 2px 3px rgba(0,0,0,.95),0 1px 1px rgba(0,0,0,1) !important;
  border-radius:0 !important;
  border:none !important;
  font-family:'Playfair Display',Georgia,serif !important;
  font-weight:700 !important;
  min-height:54px !important;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));
  box-shadow:none !important;
}
#app[data-view="porra"] .close-pal-btn:disabled{opacity:.45 !important}

/* === Price input sobre pergamino === */
#app[data-view="porra"] .price-input{
  background:rgba(20,15,10,.5) !important;
  color:#fff4dc !important;
  border-color:rgba(212,160,23,.5) !important;
}

/* === Stat-avatar: añadir sombra para resaltar sobre pergamino === */
#app[data-view="porra"] .stat-avatar,
#app[data-view="mini"] .stat-avatar{
  box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 0 2px rgba(255,240,210,.3) !important;
}

/* === Borders de partidas (último elemento de listas) === */
#app[data-view="porra"] [style*="border-bottom:1px solid #15192a"],
#app[data-view="mini"] [style*="border-bottom:1px solid #15192a"]{
  border-bottom-color:rgba(58,36,18,.2) !important;
}

@media (max-width:520px){
  .card:has(.mbtn){padding:30px 22px 22px !important}
  .card:has(#spinner-name){padding:32px 22px !important}
  .card:has([data-rplayer]),.card:has([data-bplayer]),.card:has(.summary-winner){padding:30px 20px 22px !important}
  .card:has(.mbtn) > .section-title,
  .card:has(#spinner-name) .section-title,
  .card:has([data-rplayer]) .section-title,
  .card:has([data-bplayer]) .section-title,
  .card:has(.summary-winner) .section-title{font-size:22px !important}
  .card:has(.mbtn) .mbtn{min-height:56px !important;padding:9px 14px 9px 10px !important;gap:10px !important}
  .card:has(.mbtn) .mbtn .ico{width:46px !important;height:46px !important;font-size:18px !important}
  .card:has(.mbtn) .mbtn-night .ico{font-size:14px !important}
}

let S={games:[],players:[],history:[],view:"home",newGame:null,activeGame:null,activeNight:null,nightHistory:[],confirmDelete:null,connected:false,loaded:0,confirmRemovePlayer:null,toast:null,palPrice:"",confirmClose:false,confirmAbandon:false,confirmCloseNight:false,user:null,authReady:false,accessDenied:false,onlineUsers:[]};
function up(p){Object.assign(S,p);render()}
let listenersReady=false;
function dbErr(e){if(e.code==="PERMISSION_DENIED"||e.message?.includes("permission"))up({accessDenied:true})}
onAuthStateChanged(auth,u=>{S.user=u;S.authReady=true;S.accessDenied=false;
  if(u&&!listenersReady){listenersReady=true;
    // Presence: mark online + auto-remove on disconnect
    const myRef=ref(db,"presence/"+u.uid);
    const myName=u.displayName?.split(" ")[0]||u.email?.split("@")[0]||"?";
    onValue(ref(db,".info/connected"),s=>{
      up({connected:s.val()===true});
      if(s.val()===true){set(myRef,{name:myName,email:u.email});onDisconnect(myRef).remove()}
    });
    // Listen who's online
    onValue(presenceRef,s=>{const v=s.val();up({onlineUsers:v?Object.values(v):[]})},dbErr);
    onValue(gamesRef,s=>{const v=s.val();up({games:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[],loaded:S.loaded|1})},dbErr);
    onValue(playersRef,s=>{const v=s.val();if(!v){set(playersRef,{p0:"Xose",p1:"Noelia",p2:"Pako",p3:"Miguel"});return}up({players:Object.entries(v).map(([k,n])=>({key:k,name:n})).sort((a,b)=>a.name.localeCompare(b.name)),loaded:S.loaded|2})},dbErr);
    onValue(histRef,s=>{const v=s.val();up({history:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[],loaded:S.loaded|4})},dbErr);
    onValue(activeRef,s=>{up({activeGame:s.val()||null})},dbErr);
    onValue(nightRef,s=>{up({activeNight:s.val()||null})},dbErr);
    onValue(nightHistRef,s=>{const v=s.val();up({nightHistory:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[]})},dbErr);
  }
  if(!u){listenersReady=false;S.loaded=0;S.onlineUsers=[]}
  render();
});

function addPlayer(n){const c=n.trim();if(!c||S.players.some(p=>p.name.toLowerCase()===c.toLowerCase()))return;push(playersRef,c)}
function removePlayer(k){remove(ref(db,"players/"+k))}
function saveGame(g){set(ref(db,"games/"+(Date.now().toString(36)+Math.random().toString(36).slice(2,6))),g)}
function deleteGame(k){remove(ref(db,"games/"+k))}
function closePaletilla(price){const pal=getPaletilla();const payments={};pal.allPlayers.forEach(p=>{payments[p]=Math.round(price*(pal.pct[p]||0)/100*100)/100});push(histRef,{date:new Date().toISOString(),price,payments,losses:{...pal.losses},played:{...pal.played},gamesCount:S.games.filter(x=>x.mode==="free").length});S.games.filter(g=>g.mode==="free").forEach(g=>{if(g._key)remove(ref(db,"games/"+g._key))})}
function persistGame(){const g=S.newGame;if(!g||!["playing","bonus"].includes(g.step))return;set(activeRef,{step:g.step,mode:g.mode,selected:g.selected||[],team1:g.team1||[],team2:g.team2||[],rounds:g.rounds||[],bonuses:g.bonuses||{},lastTaunt:g.lastTaunt||""})}
function clearActiveGame(){remove(activeRef)}
function resumeGame(ag){const cr={};const pl=ag.mode==="2v2"&&ag.team1?.length?[...ag.team1,...ag.team2]:ag.selected;pl.forEach(p=>{cr[p]=""});up({newGame:{...ag,currentRound:cr},view:"home"})}
function gc(name){const FIXED={"Noelia":"#a02020","Xose":"#1e7a3c","Pako":"#1a3a8a","Miguel":"#5a1a8a"};if(FIXED[name])return FIXED[name];const i=S.players.findIndex(p=>p.name===name);return PAL[i>=0?i%PAL.length:Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%PAL.length]}

// Night functions
function saveNightGame(gameData){
  const an=S.activeNight;if(!an)return;
  const games=[...(an.games||[]),gameData];
  set(nightRef,{...an,games});
}
function closeNight(){
  const an=S.activeNight;if(!an)return;
  const games=an.games||[];
  let t1w=0,t2w=0;
  games.forEach(g=>{const t1s=an.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(g.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++;});
  const winner=t1w>t2w?"team1":t2w>t1w?"team2":null;
  // Check accumulated debt from tied nights
  const unpaidTied=S.nightHistory.filter(n=>!n.winner&&!n.paid).length;
  push(nightHistRef,{date:new Date().toISOString(),team1:an.team1,team2:an.team2,team1Wins:t1w,team2Wins:t2w,winner,games,paid:false,accumulated:unpaidTied});
  remove(nightRef);
}

// Stats (free mode only)
function getStats(){const s={};S.players.forEach(p=>{s[p.name]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});S.games.filter(g=>g.mode==="free").forEach(g=>{Object.keys(g.scores).forEach(n=>{if(!s[n])s[n]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(i===0)s[n].wins++;else s[n].losses++})});return s}
function getStreaks(){const current={},best={};[...S.games].filter(g=>g.mode==="free").reverse().forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{if(!current[n])current[n]=0;if(i===0)current[n]=0;else{current[n]++;if(!best[n]||current[n]>best[n])best[n]=current[n]}})});return{current,best}}
function getTitles(){const stats=getStats(),streaks=getStreaks(),titles={};let mxL=0,mxLN="",mxW=0,mxWN="";Object.entries(stats).forEach(([n,s])=>{if(s.losses>mxL){mxL=s.losses;mxLN=n}if(s.wins>mxW){mxW=s.wins;mxWN=n}});Object.entries(stats).forEach(([n,s])=>{if(s.played===0){titles[n]=null;return}const cs=streaks.current[n]||0;if(cs>=5)titles[n]={text:"Patrocinador del Jamón",color:"#e74c3c",icon:"🐷"};else if(cs>=3)titles[n]={text:"Cajero Automático",color:"#e67e22",icon:"🏧"};else if(n===mxLN&&mxL>2)titles[n]={text:"El Paletillero Mayor",color:"#e74c3c",icon:"👑"};else if(n===mxWN&&mxW>1)titles[n]={text:"Rey del Azul",color:"#58d68d",icon:"🏆"};else titles[n]=null});return titles}
function getPaletilla(){const all=new Set(),losses={},played={};S.games.filter(g=>g.mode==="free").forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{all.add(n);played[n]=(played[n]||0)+1;if(i>0)losses[n]=(losses[n]||0)+1})});const total=Object.values(losses).reduce((a,b)=>a+b,0);const pct={};all.forEach(p=>{losses[p]=losses[p]||0;played[p]=played[p]||0;pct[p]=total>0?Math.round(losses[p]/total*100):0});return{losses,pct,total,played,allPlayers:[...all]}}
function getGlobalTotals(){const t={};S.history.forEach(h=>{if(h.payments)Object.entries(h.payments).forEach(([n,a])=>{t[n]=(t[n]||0)+a})});return t}

// Mini stats
function getMiniGames(){return S.games.filter(g=>g.mode==="mini").sort((a,b)=>a.date.localeCompare(b.date))}
function getMiniStats(){const mg=getMiniGames(),s={Xose:{w:0,l:0,total:0,best:0},Noelia:{w:0,l:0,total:0,best:0}};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{if(!s[n])return;if(i===0)s[n].w++;else s[n].l++;s[n].total+=sc;if(sc>s[n].best)s[n].best=sc})});return s}
function getCrown(){const mg=getMiniGames();if(!mg.length)return null;const last=mg[mg.length-1],sorted=Object.entries(last.scores).sort((a,b)=>b[1]-a[1]),king=sorted[0][0];let reign=0;for(let i=mg.length-1;i>=0;i--){const s=Object.entries(mg[i].scores).sort((a,b)=>b[1]-a[1]);if(s[0][0]===king)reign++;else break}return{name:king,reign}}
function getRecords(){const mg=getMiniGames();if(!mg.length)return null;let bs={n:"",s:0},bb={n:"",d:0,sc:""},cg={d:999,sc:""},str={Xose:0,Noelia:0},bstr={Xose:0,Noelia:0};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]),w=sorted[0],l=sorted[1],d=w[1]-l[1];sorted.forEach(([n,sc])=>{if(sc>bs.s)bs={n,s:sc}});if(d>bb.d)bb={n:w[0],d,sc:`${w[1]}-${l[1]}`};if(d<cg.d)cg={d,sc:`${w[1]}-${l[1]}`};["Xose","Noelia"].forEach(n=>{if(n===w[0]){str[n]++;if(str[n]>bstr[n])bstr[n]=str[n]}else str[n]=0})});return{bs,bb,cg,bstr}}
function getCartaBlanca(){const mg=getMiniGames(),months={};mg.forEach(g=>{const d=new Date(g.date),key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months[key])months[key]={Xose:0,Noelia:0};const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);months[key][sorted[0][0]]++});const now=new Date(),curKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");const hist=Object.entries(months).filter(([k])=>k!==curKey).map(([k,v])=>{const [y,m]=k.split("-");return{month:k,label:new Date(+y,+m-1).toLocaleDateString("es-ES",{month:"long",year:"numeric"}),xose:v.Xose,noelia:v.Noelia,winner:v.Xose>v.Noelia?"Xose":v.Noelia>v.Xose?"Noelia":null}});const current=months[curKey]||{Xose:0,Noelia:0};return{current,history:hist.reverse(),totalCB:{Xose:hist.filter(h=>h.winner==="Xose").length,Noelia:hist.filter(h=>h.winner==="Noelia").length}}}

function getNightPayStats(){const t={};S.nightHistory.forEach(n=>{if(n.winner&&!n.paid){const losers=n.winner==="team1"?n.team2:n.team1;losers.forEach(p=>{t[p]=(t[p]||0)+1})}});return t}

function randomFrase(name){return FRASES[Math.floor(Math.random()*FRASES.length)].replace(/\[N\]/g,name)}
function randomMidFrase(name,gap,rn){return MID_FRASES[Math.floor(Math.random()*MID_FRASES.length)].replace(/\[N\]/g,name).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function randomMiniFrase(w,l){return MINI_FRASES[Math.floor(Math.random()*MINI_FRASES.length)].replace(/\[W\]/g,w).replace(/\[L\]/g,l)}
function randomMiniMid(w,l,gap,rn){return MINI_MID[Math.floor(Math.random()*MINI_MID.length)].replace(/\[W\]/g,w).replace(/\[L\]/g,l).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function randomNightFrase(wTeam,lTeam){const wn=wTeam.join(" y "),ln=lTeam.join(" y ");return NIGHT_FRASES[Math.floor(Math.random()*NIGHT_FRASES.length)].replace(/\[W\]/g,wn).replace(/\[L\]/g,ln)}
function randomNightMid(wTeam,lTeam,t1w,t2w,rn){const wn=wTeam.join("+"),ln=lTeam.join("+");return NIGHT_MID[Math.floor(Math.random()*NIGHT_MID.length)].replace(/\[W\]/g,wn).replace(/\[L\]/g,ln).replace(/\[X\]/g,String(t1w)).replace(/\[Y\]/g,String(t2w)).replace(/\[R\]/g,String(rn))}
function updateEuros(){const price=parseFloat(S.palPrice)||0;document.querySelectorAll("[data-euro]").forEach(el=>{const pct=parseFloat(el.dataset.euro)||0;el.textContent=price>0?(price*pct/100).toFixed(2)+" €":""});const btn=document.querySelector("[data-action='close-ask']");if(btn){if(price>0)btn.removeAttribute("disabled");else btn.setAttribute("disabled","")}}
function roundTotals(pl,rounds,bonuses){const t={};pl.forEach(p=>{t[p]=0});rounds.forEach(r=>{pl.forEach(p=>{t[p]+=r[p]||0})});if(bonuses)pl.forEach(p=>{t[p]+=(bonuses[p]||0)});return t}

else lt=randomMidFrase(l[0],gap,newR.length);
const ng={...g,rounds:newR,currentRound:cr,lastTaunt:lt};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelector("[data-action='undo-round']")?.addEventListener("click",()=>{if(!g)return;const rounds=[...(g.rounds||[])];if(rounds.length===0)return;rounds.pop();const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const cr={};pl.forEach(p=>{cr[p]=""});const ng={...g,rounds,currentRound:cr,lastTaunt:""};up({newGame:ng});S.newGame=ng;persistGame()});
document.querySelector("[data-action='finish-rounds']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;let rounds=[...(g.rounds||[])];const cur=g.currentRound;const filled=pl.every(p=>cur[p]!=null&&cur[p]!==""&&!isNaN(Number(cur[p])));if(filled){const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(cur[p])||0)});rounds.push(rs)}const bonuses=g.bonuses&&pl.some(p=>g.bonuses[p]!=null&&g.bonuses[p]!=="")?{...g.bonuses}:{};if(!Object.keys(bonuses).length)pl.forEach(p=>{bonuses[p]=""});const ng={...g,rounds,step:"bonus",bonuses};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelector("[data-action='back-playing']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const cr={};pl.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelectorAll("[data-bplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.bonuses[inp.dataset.bplayer]=inp.value;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.bonuses[p]!=null&&g.bonuses[p]!==""&&!isNaN(Number(g.bonuses[p])));const sb=document.querySelector("[data-action='show-summary']");if(sb)sb.className="save-btn "+(ok?"ok":"disabled")}});
document.querySelector("[data-action='show-summary']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const bonuses={};pl.forEach(p=>{bonuses[p]=Math.max(0,parseInt(g.bonuses[p])||0)});up({newGame:{...g,step:"summary",bonuses}})});

// SAVE GAME
document.querySelector("[data-action='save-game']")?.addEventListener("click",()=>{if(!g)return;
  const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;
  const totals=roundTotals(pl,g.rounds,g.bonuses);
  const sv={mode:g.mode,scores:totals,date:new Date().toISOString(),roundCount:(g.rounds||[]).length};
  if(g.team1?.length){sv.team1=g.team1;sv.team2=g.team2}
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),w=sorted[0][0],l=sorted[sorted.length-1][0];

  if(g.mode==="night"){
    // Add to active night
    saveNightGame(sv);
    clearActiveGame();
    // Toast with night score update
    const an=S.activeNight;
    let t1w=0,t2w=0;
    [...(an?.games||[]),sv].forEach(gg=>{const t1s=(g.team1||[]).reduce((s,n)=>s+(gg.scores[n]||0),0),t2s=(g.team2||[]).reduce((s,n)=>s+(gg.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});
    up({newGame:null,view:"noches",toast:{icon:"🍺",title:`${t1w} - ${t2w}`,msg:`Partida guardada. ${t1w===t2w?"¡Empate de momento!":t1w>t2w?g.team1.join(" y ")+" van ganando":g.team2.join(" y ")+" van ganando"}`,color:"#b7950b"}});
  }else{
    saveGame(sv);clearActiveGame();
    let toastMsg,toastIcon="💀",toastTitle="¡Derrota!",toastColor="#e74c3c";
    if(g.mode==="mini"){toastMsg=randomMiniFrase(w,l);toastIcon="👑";toastTitle="¡Victoria!";toastColor="#bb8fce"}
    else if(g.mode==="casual"){toastMsg=`${w} gana con ${sorted[0][1]} puntos`;toastIcon="🎲";toastTitle="Partida guardada";toastColor="#58d68d"}
    else{toastMsg=randomFrase(l)}
    up({newGame:null,view:g.mode==="mini"?"mini":g.mode==="casual"?"libre":"porra",toast:{icon:toastIcon,title:toastTitle,msg:toastMsg,color:toastColor}});
  }
});

// Delete game
document.querySelectorAll("[data-delask]").forEach(b=>{b.onclick=()=>up({confirmDelete:b.dataset.delask})});
document.querySelectorAll("[data-delconfirm]").forEach(b=>{b.onclick=()=>{deleteGame(b.dataset.delconfirm);up({confirmDelete:null})}});
document.querySelectorAll("[data-delcancel]").forEach(b=>{b.onclick=()=>up({confirmDelete:null})});
// Toast
document.querySelectorAll("[data-action='close-toast']").forEach(b=>{b.onclick=e=>{if(e.target===b||e.target.dataset.action==="close-toast")up({toast:null})}});
// Price
document.getElementById("palPriceInput")?.addEventListener("input",e=>{S.palPrice=e.target.value;updateEuros()});
document.querySelector("[data-action='close-ask']")?.addEventListener("click",()=>up({confirmClose:true}));
document.querySelector("[data-action='close-yes']")?.addEventListener("click",()=>{const p=parseFloat(S.palPrice)||0;if(p>0){closePaletilla(p);up({confirmClose:false,palPrice:""})}});
document.querySelector("[data-action='close-no']")?.addEventListener("click",()=>up({confirmClose:false}));
// Players
document.querySelector("[data-action='add-player']")?.addEventListener("click",()=>{const i=document.getElementById("npi");if(i&&i.value.trim()){addPlayer(i.value.trim());i.value=""}});
document.getElementById("npi")?.addEventListener("keydown",e=>{if(e.key==="Enter"){const i=e.target;if(i.value.trim()){addPlayer(i.value.trim());i.value=""}}});
document.querySelectorAll("[data-rmask]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:b.dataset.rmask})});
document.querySelectorAll("[data-rmyes]").forEach(b=>{b.onclick=()=>{removePlayer(b.dataset.rmyes);up({confirmRemovePlayer:null})}});
document.querySelectorAll("[data-rmno]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:null})});
if(S.palPrice)updateEuros();}
render();
</script>
</body>
</html>
