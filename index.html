// ── GROUP PHRASES ──
const FRASES=["[N], no te preocupes, cuando seas viejo contarás a tus nietos cómo financiaste la industria jamonera","[N] jugando al Azul es como ver a un ciego aparcar: da pena, pero no puedes dejar de mirar","Han llamado de Hacienda. Quieren declarar a [N] como entidad benéfica del sector porcino","[N], con lo que llevas gastado en jamón podrías haber hecho un máster","[N] tiene la misma capacidad estratégica que una patata con ojos","Si la estupidez diera puntos, [N] ganaría todas las partidas","[N], tus azulejos están peor colocados que tu vida","Última hora: [N] vuelve a perder. El carnicero se ha comprado un BMW","[N], ¿sabes que puedes ELEGIR dónde poner las fichas?","El cerdo ibérico tiene una foto de [N] en el altar con velitas","Enhorabuena [N], perder ya parece tu deporte olímpico","[N] no necesita carnicero, necesita psicólogo","[N] pierde con tanta naturalidad que parece que cobra por ello","¿Sabéis qué haría yo si jugara como [N]? Llorar.","La UNESCO debería declarar las derrotas de [N] patrimonio de la humanidad","[N], eres al Azul lo que un iceberg es al Titanic: un puto desastre","El carnicero le puso a la paletilla más cara: 'Reservada para [N]'","[N], juegas tan mal que hasta el manual se ofende","Si [N] jugara al ajedrez, el rey se suicidaría solo","[N], lo tuyo no es perder, es arte abstracto: nadie lo entiende"];

let S={games:[],players:[],history:[],view:"home",newGame:null,activeGame:null,confirmDelete:null,connected:false,loaded:0,confirmRemovePlayer:null,toast:null,palPrice:"",confirmClose:false,confirmAbandon:false};

function addPlayer(n){const c=n.trim();if(!c||S.players.some(p=>p.name.toLowerCase()===c.toLowerCase()))return;push(playersRef,c)}

function closePaletilla(price){const pal=getPaletilla();const payments={};pal.allPlayers.forEach(p=>{payments[p]=Math.round(price*(pal.pct[p]||0)/100*100)/100});push(histRef,{date:new Date().toISOString(),price,payments,losses:{...pal.losses},played:{...pal.played},gamesCount:S.games.filter(x=>x.mode==="free").length});remove(gamesRef)}
function persistGame(){const g=S.newGame;if(!g||!["playing","bonus"].includes(g.step))return;set(activeRef,{step:g.step,mode:g.mode,selected:g.selected||[],team1:g.team1||[],team2:g.team2||[],rounds:g.rounds||[],bonuses:g.bonuses||{},lastTaunt:g.lastTaunt||""})}

function resumeGame(ag){const cr={};const pl=ag.mode==="2v2"&&ag.team1?.length?[...ag.team1,...ag.team2]:ag.selected;pl.forEach(p=>{cr[p]=""});up({newGame:{...ag,currentRound:cr},view:"home"})}
function gc(name){const i=S.players.findIndex(p=>p.name===name);return PAL[i>=0?i%PAL.length:Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%PAL.length]}

// ── Stats (exclude mini) ──
function getStats(){const s={};S.players.forEach(p=>{s[p.name]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});S.games.filter(g=>g.mode!=="mini").forEach(g=>{Object.keys(g.scores).forEach(n=>{if(!s[n])s[n]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});if(g.mode==="free"){const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(i===0)s[n].wins++;else s[n].losses++})}else if(g.mode==="2v2"){const t1=g.team1.reduce((x,n)=>x+(g.scores[n]||0),0),t2=g.team2.reduce((x,n)=>x+(g.scores[n]||0),0),w=t1>=t2?g.team1:g.team2;[...g.team1,...g.team2].forEach(n=>{const sc=g.scores[n]||0;s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(w.includes(n))s[n].wins++;else s[n].losses++})}});return s}
function getStreaks(){const current={},best={};[...S.games].filter(g=>g.mode==="free").reverse().forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{if(!current[n])current[n]=0;if(i===0)current[n]=0;else{current[n]++;if(!best[n]||current[n]>best[n])best[n]=current[n]}})});return{current,best}}
function getTitles(){const stats=getStats(),streaks=getStreaks(),titles={};let mxL=0,mxLN="",mxW=0,mxWN="";Object.entries(stats).forEach(([n,s])=>{if(s.losses>mxL){mxL=s.losses;mxLN=n}if(s.wins>mxW){mxW=s.wins;mxWN=n}});Object.entries(stats).forEach(([n,s])=>{if(s.played===0){titles[n]=null;return}const cs=streaks.current[n]||0;if(cs>=5)titles[n]={text:"Patrocinador Oficial del Jamón",color:"#e74c3c",icon:"🐷"};else if(cs>=3)titles[n]={text:"Cajero Automático",color:"#e67e22",icon:"🏧"};else if(n===mxLN&&mxL>2)titles[n]={text:"El Paletillero Mayor",color:"#e74c3c",icon:"👑"};else if(n===mxWN&&mxW>1)titles[n]={text:"Rey del Azul",color:"#58d68d",icon:"🏆"};else titles[n]=null});return titles}
function getPaletilla(){const all=new Set(),losses={},played={};S.games.forEach(g=>{if(g.mode==="free"){const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{all.add(n);played[n]=(played[n]||0)+1;if(i>0)losses[n]=(losses[n]||0)+1})}});const total=Object.values(losses).reduce((a,b)=>a+b,0);const pct={};all.forEach(p=>{losses[p]=losses[p]||0;played[p]=played[p]||0;pct[p]=total>0?Math.round(losses[p]/total*100):0});return{losses,pct,total,played,allPlayers:[...all]}}
function getGlobalTotals(){const t={};S.history.forEach(h=>{if(h.payments)Object.entries(h.payments).forEach(([n,a])=>{t[n]=(t[n]||0)+a})});return t}

// ── Mini stats ──
function getMiniGames(){return S.games.filter(g=>g.mode==="mini").sort((a,b)=>a.date.localeCompare(b.date))}
function getMiniStats(){const mg=getMiniGames();const s={Xose:{w:0,l:0,total:0,best:0},Noelia:{w:0,l:0,total:0,best:0}};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{if(!s[n])return;if(i===0)s[n].w++;else s[n].l++;s[n].total+=sc;if(sc>s[n].best)s[n].best=sc})});return s}
function getCrown(){const mg=getMiniGames();if(!mg.length)return null;const last=mg[mg.length-1];const sorted=Object.entries(last.scores).sort((a,b)=>b[1]-a[1]);const king=sorted[0][0];let reign=0;for(let i=mg.length-1;i>=0;i--){const s=Object.entries(mg[i].scores).sort((a,b)=>b[1]-a[1]);if(s[0][0]===king)reign++;else break}return{name:king,reign}}
function getRecords(){const mg=getMiniGames();if(!mg.length)return null;let bestScore={name:"",score:0},biggestBlowout={name:"",diff:0},closestGame={diff:999,scores:null},streaks={Xose:0,Noelia:0},bestStreak={Xose:0,Noelia:0};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);const w=sorted[0],l=sorted[1],diff=w[1]-l[1];sorted.forEach(([n,sc])=>{if(sc>bestScore.score){bestScore={name:n,score:sc}}});if(diff>biggestBlowout.diff)biggestBlowout={name:w[0],diff,scores:`${w[1]}-${l[1]}`};if(diff<closestGame.diff)closestGame={diff,scores:`${w[1]}-${l[1]}`,winner:w[0]};const winner=w[0];MINI_PL.forEach(n=>{if(n===winner){streaks[n]++;if(streaks[n]>bestStreak[n])bestStreak[n]=streaks[n]}else streaks[n]=0})});return{bestScore,biggestBlowout,closestGame,bestStreak}}
function getCartaBlanca(){const mg=getMiniGames();const months={};mg.forEach(g=>{const d=new Date(g.date);const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months[key])months[key]={Xose:0,Noelia:0};const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);months[key][sorted[0][0]]++});const now=new Date();const curKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");const history=Object.entries(months).filter(([k])=>k!==curKey).map(([k,v])=>{const [y,m]=k.split("-");const winner=v.Xose>v.Noelia?"Xose":v.Noelia>v.Xose?"Noelia":null;return{month:k,label:new Date(+y,+m-1).toLocaleDateString("es-ES",{month:"long",year:"numeric"}),xose:v.Xose,noelia:v.Noelia,winner}});const current=months[curKey]||{Xose:0,Noelia:0};return{current,history:history.reverse(),totalCB:{Xose:history.filter(h=>h.winner==="Xose").length,Noelia:history.filter(h=>h.winner==="Noelia").length}}}

function randomFrase(name){return FRASES[Math.floor(Math.random()*FRASES.length)].replace(/\[N\]/g,name)}
function randomMidFrase(name,gap,rn){return MID_FRASES[Math.floor(Math.random()*MID_FRASES.length)].replace(/\[N\]/g,name).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function randomMiniFrase(w,l){return MINI_FRASES[Math.floor(Math.random()*MINI_FRASES.length)].replace(/\[W\]/g,w).replace(/\[L\]/g,l)}
function randomMiniMid(w,l,gap,rn){return MINI_MID[Math.floor(Math.random()*MINI_MID.length)].replace(/\[W\]/g,w).replace(/\[L\]/g,l).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function updateEuros(){const price=parseFloat(S.palPrice)||0;document.querySelectorAll("[data-euro]").forEach(el=>{const pct=parseFloat(el.dataset.euro)||0;el.textContent=price>0?(price*pct/100).toFixed(2)+" €":""});const btn=document.querySelector("[data-action='close-ask']");if(btn){if(price>0)btn.removeAttribute("disabled");else btn.setAttribute("disabled","")}}
function roundTotals(pl,rounds,bonuses){const t={};pl.forEach(p=>{t[p]=0});rounds.forEach(r=>{pl.forEach(p=>{t[p]+=r[p]||0})});if(bonuses)pl.forEach(p=>{t[p]+=(bonuses[p]||0)});return t}

const app=document.getElementById("app");

  if(S.loaded<7){app.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh"><span style="font-family:'Playfair Display',Georgia,serif;font-size:20px;color:#d4a017">Cargando...</span></div>`;return}
  let toast="";if(S.toast)toast=`<div class="toast-overlay" data-action="close-toast"><div class="toast-card"><div style="font-size:48px;margin-bottom:12px">${S.toast.icon||'💀'}</div><div style="font-size:14px;font-weight:700;color:#e74c3c;margin-bottom:8px">${S.toast.title}</div><div style="font-size:15px;line-height:1.5;color:#e0d6c8">${S.toast.msg}</div><button class="toast-close" data-action="close-toast">Seguir jugando</button></div></div>`;
  app.innerHTML=rHeader()+rNav()+(S.newGame?rNewGame():({home:rHome,history:rHistory,stats:rStats,paletilla:rPaletilla,players:rPlayers,mini:rMini})[S.view]())+toast;
  bindAll();
}
function rHeader(){const tiles=["#5dade2","#f4d03f","#e74c3c","#0a1929","#48c9b0","#e74c3c","#5dade2","#f4d03f","#48c9b0","#0a1929","#f4d03f","#48c9b0","#5dade2","#e74c3c","#f4d03f"];return`<div class="header"><h1>Azul</h1><div class="tile-row">${tiles.map(c=>`<div class="t" style="background:${c}"></div>`).join("")}</div><div class="sub">La Porra de la Paletilla</div><div class="sync">${S.connected?'<span class="sync-dot"></span> Sincronizado':'<span class="sync-dot off"></span> Sin conexión'}</div></div>`}
function rNav(){const t=[{id:"home",l:"Inicio"},{id:"history",l:"Partidas"},{id:"stats",l:"Stats"},{id:"paletilla",l:"🐷 Paletilla"},{id:"mini",l:"👑 Mini"},{id:"players",l:"Jugadores"}];return`<div class="nav">${t.map(x=>`<button data-nav="${x.id}" class="${S.view===x.id&&!S.newGame?'active':''}">${x.l}</button>`).join("")}</div>`}
function divider(){return`<div class="azul-divider"><div class="diamond"></div></div>`}

function rHome(){
  const g=S.games,np=S.players.length;
  let resumeHtml="";
  if(!S.newGame&&S.activeGame){const ag=S.activeGame,pl=ag.mode==="2v2"&&ag.team1?.length?[...ag.team1,...ag.team2]:ag.selected||[];const rn=(ag.rounds||[]).length,totals=roundTotals(pl,ag.rounds||[]);const scoreList=pl.map(n=>`<span style="color:${gc(n)};font-weight:600">${n}:${totals[n]||0}</span>`).join(" · ");const modeLabel=ag.mode==="mini"?"Mini":ag.mode==="2v2"?"2v2":"Libre";resumeHtml=`<div class="resume-card"><div style="font-size:24px;text-align:center;margin-bottom:8px">⏸️</div><h2 class="section-title" style="text-align:center;margin-bottom:8px">Partida en curso</h2><p style="font-size:13px;color:#8a9bb5;text-align:center;margin-bottom:4px">${modeLabel} · Ronda ${rn+1}</p><p style="font-size:12px;text-align:center;margin-bottom:12px">${scoreList}</p><div class="resume-btns"><button class="resume-btn resume-go" data-action="resume-game">▶ Retomar</button><button class="resume-btn resume-cancel" data-action="discard-game">✕ Cancelar</button></div></div>`}
  const g3=g.filter(x=>x.mode==="free").length,g4=g.filter(x=>x.mode==="2v2").length,gm=g.filter(x=>x.mode==="mini").length;
  let q="";if(g.length>0){const st=getStreaks();let sh="";const hs=Object.entries(st.current).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]);if(hs.length)sh=`${divider()}${hs.map(([n,v])=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-weight:600;font-size:13px;color:#e0d6c8">${n}</span><span class="streak-fire">${'🔥'.repeat(Math.min(v,5))} ${v} sin ganar</span></div>`).join("")}`;q=`<div class="card"><h2 class="section-title">Resumen</h2><div style="display:flex;justify-content:space-around;text-align:center"><div><div class="big-num" style="color:#5dade2">${g3+g4}</div><div style="font-size:11px;color:#6b8299">Grupo</div></div><div><div class="big-num" style="color:#bb8fce">${gm}</div><div style="font-size:11px;color:#6b8299">Mini</div></div></div>${sh}</div>`}
  return`${resumeHtml}<div class="card"><h2 class="section-title">Nueva partida</h2><p style="font-size:13px;color:#6b8299;margin-bottom:16px">Elige modo de juego</p><div class="mode-btns"><button class="mode-btn mode-3" data-mode="free" ${np<2?'disabled':''}><span class="num">Libre</span><span class="lbl">Grupo</span></button><button class="mode-btn mode-4" data-mode="2v2" ${np<4?'disabled':''}><span class="num">2v2</span><span class="lbl">Equipos</span></button></div><div style="margin-top:10px"><button class="mode-btn mode-mini" data-mode="mini" style="width:100%"><span class="num">👑 Azul Mini</span><span class="lbl">Xose vs Noelia</span></button></div></div>${q}`}

// ── NEW GAME (shared for all modes) ──
function rNewGame(){const g=S.newGame,pl=g.mode==="2v2"&&g.team1?.length?[...g.team1,...g.team2]:g.selected;
if(g.step==="pick"){const min=g.mode==="free"?2:4,ex4=g.mode==="2v2";const chips=S.players.map(p=>{const on=g.selected.includes(p.name),col=gc(p.name),can=on||!ex4||g.selected.length<4;return`<button class="chip ${on?'on':''}" data-pick="${p.name}" style="${on?`background:${col};border-color:${col};color:#fff`:''}${!can?';opacity:.3':''}" ${!can?'disabled':''}>${p.name}</button>`}).join("");const ok=ex4?g.selected.length===4:g.selected.length>=min;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">${g.mode==="free"?"Partida libre":"Partida 2v2"}</h2><button class="cancel-btn" data-action="cancel-new">Cancelar</button></div><div class="step-label"><span class="step-num">1</span> Elige jugadores</div><div class="chip-grid">${chips}</div><button class="save-btn ${ok?'ok':'disabled'}" data-action="next-step">${g.mode==="2v2"?"Formar equipos":"Iniciar partida"}</button></div>`}
if(g.step==="teams"){const rt=(t,l,c,k)=>`<div><div class="team-label" style="color:${c}">${l}</div>${t.map(p=>`<button class="team-player" data-swap="${p}" data-from="${k}" style="border:2px solid ${gc(p)};background:${gc(p)}20;color:${gc(p)}">${p}</button>`).join("")}</div>`;const bal=g.team1.length===2&&g.team2.length===2;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">Equipos</h2><button class="cancel-btn" data-action="back-pick">Atrás</button></div><div class="teams-box"><div style="font-size:12px;color:#6b8299;margin-bottom:10px">Toca para cambiar</div><div class="teams-grid">${rt(g.team1,"Equipo 1","#5dade2","team1")}${rt(g.team2,"Equipo 2","#58d68d","team2")}</div></div><button class="save-btn ${bal?'ok':'disabled'}" data-action="start-game">Iniciar partida</button></div>`}
if(g.step==="playing"){const rounds=g.rounds||[],cur=g.currentRound||{},totals=roundTotals(pl,rounds),rn=rounds.length+1,sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),leader=sorted[0],loser=sorted[sorted.length-1];let table=`<table class="scoreboard"><tr><th></th>${pl.map(p=>`<th style="color:${gc(p)}">${p}</th>`).join("")}</tr>`;rounds.forEach((r,i)=>{table+=`<tr><td class="round-label">R${i+1}</td>${pl.map(p=>`<td>${r[p]||0}</td>`).join("")}</tr>`});table+=`<tr class="total-row"><td class="round-label">Total</td>${pl.map(p=>`<td class="${p===leader[0]&&rounds.length>0?'winner-cell':''} ${p===loser[0]&&rounds.length>0?'loser-cell':''}">${totals[p]}</td>`).join("")}</tr></table>`;
let taunt="";if(rounds.length>=1&&g.lastTaunt){taunt=`<div class="taunt-box">${g.lastTaunt}</div>`}
const allFilled=pl.every(p=>cur[p]!=null&&cur[p]!==""&&!isNaN(Number(cur[p])));const canFinish=rounds.length>=1||(rounds.length===0&&allFilled);
let abandonHtml=S.confirmAbandon?`<div style="text-align:center;padding:8px 0;margin-bottom:8px;background:#0a1929;border-radius:10px;border:1px solid #e74c3c30"><p style="font-size:12px;color:#e74c3c;font-weight:600;margin-bottom:8px">¿Abandonar?</p><button class="confirm-yes" data-action="confirm-abandon">Sí</button><button class="confirm-no" data-action="cancel-abandon">No</button></div>`:`<button class="cancel-btn" data-action="ask-abandon">Abandonar</button>`;
const modeLabel=g.mode==="mini"?"Mini":"";

function rStats(){const stats=getStats(),titles=getTitles(),streaks=getStreaks();const active=Object.entries(stats).filter(([,s])=>s.played>0).sort((a,b)=>b[1].wins-a[1].wins);if(!active.length)return`<div class="card"><p class="empty">Juega para ver stats</p></div>`;return active.map(([name,s])=>{const wr=s.played>0?Math.round(s.wins/s.played*100):0,avg=s.played>0?Math.round(s.totalScore/s.played):0,col=gc(name);const title=titles[name],cs=streaks.current[name]||0;let th=title?`<div class="title-badge" style="background:${title.color}20;color:${title.color}">${title.icon} ${title.text}</div>`:'';let sh=cs>=2?`<span class="streak-fire">${'🔥'.repeat(Math.min(cs,5))} ${cs}</span>`:'';return`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="stat-avatar" style="background:${col}">${name[0]}</div><div><div style="font-weight:700;font-size:16px;color:#e0d6c8">${name}${sh}</div><div style="font-size:12px;color:#6b8299">${s.played} partida${s.played!==1?'s':''}</div>${th}</div><div style="margin-left:auto;text-align:right"><div style="font-size:24px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:${col}">${wr}%</div><div style="font-size:10px;color:#6b8299">Victorias</div></div></div>${divider()}<div style="display:flex;justify-content:space-around;text-align:center"><div class="mini-stat"><div class="val" style="color:#58d68d">${s.wins}</div><div class="lbl">Victorias</div></div><div class="mini-stat"><div class="val" style="color:#e74c3c">${s.losses}</div><div class="lbl">Derrotas</div></div><div class="mini-stat"><div class="val" style="color:#5dade2">${avg}</div><div class="lbl">Promedio</div></div><div class="mini-stat"><div class="val" style="color:#f4d03f">${s.bestScore}</div><div class="lbl">Mejor</div></div></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${wr}%;background:linear-gradient(90deg,${col},${col}cc)"></div></div></div>`}).join("")}

function rPaletilla(){const pal=getPaletilla(),gF=S.games.filter(x=>x.mode==="free").length;const sorted=[...pal.allPlayers].sort((a,b)=>(pal.pct[b]||0)-(pal.pct[a]||0));let content;if(!gF)content=`<p class="empty">Jugad partidas libres para ver quién paga</p>`;else content=sorted.map((name,i)=>{const p=pal.pct[name]||0,l=pal.losses[name]||0,pl=pal.played[name]||0,col=gc(name);const medal=i===0?"💸":(l===0?"🎉":"");const bc=i===0?`linear-gradient(90deg,#e74c3c,#c0392b)`:`linear-gradient(90deg,${col},${col}aa)`;return`<div class="pal-player ${i===0?'top':'rest'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:7px;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;font-family:'Playfair Display',Georgia,serif">${name[0]}</div><span style="font-weight:700;font-size:15px;color:#e0d6c8">${name}</span>${medal?`<span>${medal}</span>`:''}</div><div style="text-align:right"><span style="font-size:24px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:${i===0?'#e74c3c':'#e0d6c8'}">${p}%</span><div class="euro-amount" data-euro="${p}" style="color:${i===0?'#e74c3c':'#f4d03f'}"></div></div></div><div style="font-size:12px;color:#6b8299;margin-bottom:6px">${l} derrota${l!==1?'s':''} de ${pl} partida${pl!==1?'s':''}</div><div class="pal-bar"><div class="pal-bar-fill" style="width:${p}%;background:${bc}"></div></div></div>`}).join("");let ps="";if(gF>0){ps=`<div class="card"><h2 class="section-title">💰 Precio</h2><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><input type="number" inputmode="decimal" class="price-input" id="palPriceInput" placeholder="0" value="${S.palPrice}" step="0.01"><span style="font-size:18px;font-weight:700;color:#6b8299">€</span></div>`;if(!S.confirmClose)ps+=`<button class="close-pal-btn" data-action="close-as div></div>`}).join("")+`</div>`}return`<div class="card"><div style="text-align:center;margin-bottom:16px"><span style="font-size:42px">🐷</span><h2 class="section-title" style="margin-bottom:4px;margin-top:4px">La Paletilla</h2><p style="font-size:12px;color:#6b8299">${gF} partida${gF!==1?'s':''} · ${pal.total} derrota${pal.total!==1?'s':''}</p></div>${content}</div>${ps}${hh}`}

function rMini(){
  const mg=getMiniGames(),ms=getMiniStats(),crown=getCrown(),records=getRecords(),cb=getCartaBlanca();
  const xc=gc("Xose"),nc=gc("Noelia");
  const totalGames=ms.Xose.w+ms.Xose.l;

  // Crown
  let crownHtml;
  if(!crown)crownHtml=`<div class="crown-box"><div class="crown-emoji">👑</div><div style="font-size:14px;color:#6b8299;margin-top:8px">Jugad una partida Mini para coronar al primero</div></div>`;
  else{const other=crown.name==="Xose"?"Noelia":"Xose";crownHtml=`<div class="crown-box"><div class="crown-emoji">👑</div><div class="crown-name" style="color:${gc(crown.name)}">${crown.name}</div><div class="crown-reign">${crown.reign} partida${crown.reign!==1?'s':''} reinando</div></div>`}

  // Carta Blanca
  let cbHtml=`<div class="cb-card"><h2 class="section-title" style="color:#bb8fce">🃏 Carta Blanca</h2>`;
  if(cb.current.Xose+cb.current.Noelia===0)cbHtml+=`<p style="font-size:13px;color:#6b8299">Jugad partidas Mini este mes para ganar la carta blanca</p>`;
  else{const leading=cb.current.Xose>cb.current.Noelia?"Xose":cb.current.Noelia>cb.current.Xose?"Noelia":"Empate";cbHtml+=`<p style="font-size:12px;color:#8a9bb5;margin-bottom:8px">Este mes</p><div style="display:flex;justify-content:center;gap:20px;margin-bottom:8px"><div><span style="font-size:24px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:${xc}">${cb.current.Xose}</span><div style="font-size:11px;color:#6b8299">Xose</div></div><div style="font-size:20px;color:#4a6380;align-self:center">vs</div><div><span style="font-size:24px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:${nc}">${cb.current.Noelia}</span><div style="font-size:11px;color:#6b8299">Noelia</div></div></div>${leading!=="Empate"?`<p style="font-size:12px;color:${gc(leading)};font-weight:600">${leading} va ganando la carta blanca</p>`:'<p style="font-size:12px;color:#e67e22;font-weight:600">¡Empate! Nadie gana carta blanca si acaba así</p>'}`}
  if(cb.totalCB.Xose+cb.totalCB.Noelia>0)cbHtml+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1a3a5c;font-size:12px;color:#6b8299">Cartas blancas ganadas: <span style="color:${xc};font-weight:700">Xose ${cb.totalCB.Xose}</span> · <span style="color:${nc};font-weight:700">Noelia ${cb.totalCB.Noelia}</span></div>`;
  if(cb.history.length>0)cbHtml+=`<div style="margin-top:8px">${cb.history.slice(0,6).map(h=>`<div style="font-size:11px;color:#6b8299;margin-top:3px">${h.label}: ${h.winner?`<span style="color:${gc(h.winner)};font-weight:700">${h.winner}</span> (${h.xose}-${h.noelia})`:`<span style="color:#e67e22">Empate (${h.xose}-${h.noelia})</span>`}</div>`).join("")}</div>`;
  cbHtml+=`</div>`;

  // Records
  let recHtml="";
  if(records){recHtml=`<div class="card"><h2 class="section-title">🏅 Récords</h2><div class="record-item"><span class="record-label">Puntuación más alta</span><span class="record-val" style="color:${gc(records.bestScore.name)}">${records.bestScore.name} · ${records.bestScore.score}</span></div><div class="record-item"><span class="record-label">Mayor paliza</span><span class="record-val" style="color:${gc(records.biggestBlowout.name)}">${records.biggestBlowout.name} · ${records.biggestBlowout.scores} (+${records.biggestBlowout.diff})</span></div><div class="record-item"><span class="record-label">Partida más reñida</span><span class="record-val">${records.closestGame.scores} (dif. ${records.closestGame.diff})</span></div><div class="record-item"><span class="record-label">Mejor racha Xose</span><span class="record-val" style="color:${xc}">${records.bestStreak.Xose} seguidas</span></div><div class="record-item"><span class="record-label">Mejor racha Noelia</span><span class="record-val" style="color:${nc}">${records.bestStreak.Noelia} seguidas</span></div></div>`}

  return`${crownHtml}${domHtml}${cbHtml}${recHtml}${histHtml}`;
}

document.querySelector("[data-action='back-pick']")?.addEventListener("click",()=>{if(g)up({newGame:{...g,step:"pick"}})});
document.querySelectorAll("[data-pick]").forEach(b=>{if(b.disabled||!g)return;b.onclick=()=>{const n=b.dataset.pick,sel=g.selected.includes(n)?g.selected.filter(x=>x!==n):[...g.selected,n];up({newGame:{...g,selected:sel}})}});
document.querySelector("[data-action='next-step']")?.addEventListener("click",()=>{if(!g)return;if(g.mode==="2v2")up({newGame:{...g,step:"teams",team1:g.selected.slice(0,2),team2:g.selected.slice(2,4)}});else{const cr={};g.selected.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr,rounds:[]};up({newGame:ng});S.newGame=ng;persistGame()}});
document.querySelectorAll("[data-swap]").forEach(b=>{if(!g)return;b.onclick=()=>{const p=b.dataset.swap,fr=b.dataset.from,to=fr==="team1"?"team2":"team1",fa=g[fr].filter(x=>x!==p),ta=[...g[to],p];if(fa.length>=1&&ta.length<=3)up({newGame:{...g,[fr]:fa,[to]:ta}})}});
document.querySelector("[data-action='start-game']")?.addEventListener("click",()=>{if(!g||g.team1.length!==2||g.team2.length!==2)return;const cr={};[...g.team1,...g.team2].forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr,rounds:[]};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelectorAll("[data-rplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.currentRound[inp.dataset.rplayer]=inp.value;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.currentRound[p]!=null&&g.currentRound[p]!==""&&!isNaN(Number(g.currentRound[p])));const nb=document.querySelector("[data-action='next-round']");if(nb)nb.disabled=!ok;const fb=document.querySelector("[data-action='finish-rounds']");if(fb)fb.disabled=!((g.rounds||[]).length>=1||((g.rounds||[]).length===0&&ok))}});

document.querySelector("[data-action='next-round']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(g.currentRound[p])||0)});const newR=[...(g.rounds||[]),rs];const cr={};pl.forEach(p=>{cr[p]=""});
  // Generate taunt based on mode
  const tt=roundTotals(pl,newR),ss=Object.entries(tt).sort((a,b)=>b[1]-a[1]),w=ss[0],l=ss[ss.length-1],gap=w[1]-l[1];
  let lt;
  if(g.mode==="mini")lt=randomMiniMid(w[0],l[0],gap,newR.length);
  else lt=randomMidFrase(l[0],gap,newR.length);
  const ng={...g,rounds:newR,currentRound:cr,lastTaunt:lt};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelector("[data-action='finish-rounds']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;let rounds=[...(g.rounds||[])];const cur=g.currentRound;const filled=pl.every(p=>cur[p]!=null&&cur[p]!==""&&!isNaN(Number(cur[p])));if(filled){const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(cur[p])||0)});rounds.push(rs)}const bonuses=g.bonuses&&pl.some(p=>g.bonuses[p]!=null&&g.bonuses[p]!=="")?{...g.bonuses}:{};if(!Object.keys(bonuses).length)pl.forEach(p=>{bonuses[p]=""});const ng={...g,rounds,step:"bonus",bonuses};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelector("[data-action='back-playing']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const cr={};pl.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelectorAll("[data-bplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.bonuses[inp.dataset.bplayer]=inp.value;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.bonuses[p]!=null&&g.bonuses[p]!==""&&!isNaN(Number(g.bonuses[p])));const sb=document.querySelector("[data-action='show-summary']");if(sb)sb.className="save-btn "+(ok?"ok":"disabled")}});
document.querySelector("[data-action='show-summary']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const bonuses={};pl.forEach(p=>{bonuses[p]=Math.max(0,parseInt(g.bonuses[p])||0)});up({newGame:{...g,step:"summary",bonuses}})});

document.querySelector("[data-action='save-game']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const totals=roundTotals(pl,g.rounds,g.bonuses);const sv={mode:g.mode,scores:totals,date:new Date().toISOString(),roundCount:(g.rounds||[]).length};if(g.mode==="2v2"){sv.team1=g.team1;sv.team2=g.team2}const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),w=sorted[0][0],l=sorted[sorted.length-1][0];
  let toastMsg;
  if(g.mode==="mini")toastMsg=randomMiniFrase(w,l);
  else toastMsg=randomFrase(l);
  saveGame(sv);clearActiveGame();up({newGame:null,view:g.mode==="mini"?"mini":"history",toast:{icon:g.mode==="mini"?"👑":"💀",title:g.mode==="mini"?"¡Victoria!":"¡Derrota!",msg:toastMsg}})});

document.querySelectorAll("[data-delask]").forEach(b=>{b.onclick=()=>up({confirmDelete:b.dataset.delask})});
document.querySelectorAll("[data-delconfirm]").forEach(b=>{b.onclick=()=>{deleteGame(b.dataset.delconfirm);up({confirmDelete:null})}});
document.querySelectorAll("[data-delcancel]").forEach(b=>{b.onclick=()=>up({confirmDelete:null})});
document.querySelectorAll("[data-action='close-toast']").forEach(b=>{b.onclick=e=>{if(e.target===b||e.target.dataset.action==="close-toast")up({toast:null})}});
document.getElementById("palPriceInput")?.addEventListener("input",e=>{S.palPrice=e.target.value;updateEuros()});
document.querySelector("[data-action='close-ask']")?.addEventListener("click",()=>up({confirmClose:true}));
document.querySelector("[data-action='close-yes']")?.addEventListener("click",()=>{const p=parseFloat(S.palPrice)||0;if(p>0){closePaletilla(p);up({confirmClose:false,palPrice:""})}});
document.querySelector("[data-action='close-no']")?.addEventListener("click",()=>up({confirmClose:false}));
document.querySelector("[data-action='add-player']")?.addEventListener("click",()=>{const i=document.getElementById("npi");if(i&&i.value.trim()){addPlayer(i.value.trim());i.value=""}});
document.getElementById("npi")?.addEventListener("keydown",e=>{if(e.key==="Enter"){const i=e.target;if(i.value.trim()){addPlayer(i.value.trim());i.value=""}}});
document.querySelectorAll("[data-rmask]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:b.dataset.rmask})});
document.querySelectorAll("[data-rmyes]").forEach(b=>{b.onclick=()=>{removePlayer(b.dataset.rmyes);up({confirmRemovePlayer:null})}});
document.querySelectorAll("[data-rmno]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:null})});
if(S.palPrice)updateEuros();}
render();
</script>
</body>
</html>
