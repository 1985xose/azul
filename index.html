.section-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#8aa0cc;margin-bottom:12px}
.mbtn{width:100%;padding:16px 12px;border:none;border-radius:12px;color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:700;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;margin-bottom:10px;text-align:center}.mbtn::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(255,255,255,.03) 8px,rgba(255,255,255,.03) 9px);pointer-events:none}.mbtn:active{transform:scale(.97)}.mbtn:disabled{opacity:.3;cursor:default}
.mbtn-pal{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #4a7fff;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn-night{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #e6a919;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn-mini{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #9b59b6;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn-casual{background:#0a0e18;border:1px solid #15192a;border-left:3px solid #48c9b0;text-align:left;display:flex;align-items:center;gap:14px;padding:16px 14px}
.mbtn .ico{font-size:26px;flex-shrink:0}.mbtn .lbl{font-size:15px;display:block;font-family:'Playfair Display',Georgia,serif;color:#e8edf5}.mbtn .desc{font-size:11px;color:#4a5a80;font-family:'DM Sans',sans-serif;font-weight:400}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chip{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;border:2px solid #15192a;background:#0a0e18;color:#4a5a80}.chip.on{color:#fff;border-color:transparent}.chip:active{transform:scale(.95)}
.add-player-row{display:flex;gap:8px;margin-top:12px}.add-player-row input{flex:1;padding:10px 12px;border:2px solid #15192a;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#060a12;color:#e8edf5}.add-player-row input:focus{border-color:#4a7fff}.add-player-row input::placeholder{color:#4a6380}.add-player-row button{padding:10px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
.score-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;margin-bottom:8px}.score-row .name{flex:1;font-weight:600;font-size:15px;color:#e8edf5}
.teams-box{margin-bottom:20px;padding:14px;background:#0a0e18;border-radius:10px;border:1px solid #15192a}.teams-grid{display:flex;gap:10px}.teams-grid>div{flex:1}.team-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.team-player{display:block;width:100%;margin-bottom:4px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left}
.save-btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;transition:all .2s}.save-btn.ok{background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12;box-shadow:0 4px 16px rgba(212,160,23,.3)}.save-btn.disabled{background:#15192a;color:#4a6380;cursor:default}
.cancel-btn{border:none;background:#15192a;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#7a8faa;font-family:inherit}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.game-player{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;margin-bottom:4px}.game-player .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.game-player .pname{flex:1;font-size:14px;color:#d0dae8}.game-player .pscore{font-size:18px;font-weight:700;font-family:'Playfair Display',Georgia,serif;min-width:36px;text-align:right}.game-winner{background:rgba(30,132,73,.1)}.game-loser{background:rgba(192,57,43,.1)}
.tst{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-right:6px;margin-bottom:8px}
.delete-btn{border:none;background:none;font-size:11px;color:#4a6380;cursor:pointer;font-family:inherit;padding:4px 8px}.confirm-yes{border:none;background:#c0392b;color:#fff;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;margin-right:6px;font-family:inherit}.confirm-no{border:none;background:#15192a;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:#7a8faa}
.stat-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}.stat-bar{margin-top:12px;height:6px;background:#15192a;border-radius:3px;overflow:hidden}.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}.mini-stat .val{font-size:20px;font-weight:700;font-family:'Playfair Display',Georgia,serif}.mini-stat .lbl{font-size:10px;color:#4a5a80;font-weight:500}.big-num{font-size:28px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:#e8edf5}
.pal-player{padding:14px 16px;border-radius:12px;margin-bottom:10px}.pal-player.top{background:rgba(192,57,43,.12);border:2px solid rgba(192,57,43,.3)}.pal-player.rest{background:#0a0e18;border:2px solid #15192a}.pal-bar{height:8px;background:#15192a;border-radius:4px;overflow:hidden;margin-top:6px}.pal-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.reset-btn{padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}.reset-danger{border:none;background:#c0392b;color:#fff;padding:10px 24px;width:auto;margin-right:8px}.reset-cancel{border:none;background:#15192a;color:#7a8faa;padding:10px 24px;width:auto}
.empty{text-align:center;color:#4a5a80;font-size:14px;padding:20px}.step-label{font-size:12px;font-weight:600;color:#7a8faa;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#4a7fff;color:#060a12;font-size:11px;font-weight:700;margin-right:6px}
.title-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-top:2px}.streak-fire{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#e67e22;background:rgba(230,126,34,.15);padding:2px 8px;border-radius:6px;margin-left:6px}
.toast-overlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);animation:toastIn .3s ease}.toast-card{background:#0c1220;border:2px solid #4a7fff;border-radius:18px;padding:28px 24px;max-width:340px;margin:20px;text-align:center;animation:toastBounce .4s ease;box-shadow:0 8px 32px rgba(0,0,0,.5)}@keyframes toastIn{from{opacity:0}to{opacity:1}}@keyframes toastBounce{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}.toast-close{border:none;background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12;border-radius:10px;padding:10px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:16px}
.toast-card-gold{border-color:#d4a017!important;box-shadow:0 0 0 1px rgba(212,160,23,.35),0 8px 40px rgba(212,160,23,.45)!important}
.cb-flip{width:96px;height:120px;margin:4px auto 0;perspective:600px}.cb-flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cbflip 1s ease .3s both}.cb-flip-back,.cb-flip-front{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:14px}.cb-flip-back{background:linear-gradient(135deg,#2a1f3a,#4a2f6a);border:2px solid #d4a017;font-size:46px}.cb-flip-front{background:rgba(212,160,23,.08);border:2px solid #d4a017;transform:rotateY(180deg)}@keyframes cbflip{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
.jamon-rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}.jamon-rain span{position:absolute;top:-10%;animation:jamonfall 2.3s linear forwards}@keyframes jamonfall{0%{transform:translateY(-12vh) rotate(0)}100%{transform:translateY(112vh) rotate(380deg);opacity:.35}}
.pending-cb{animation:pendpulse 1.7s ease-in-out infinite}@keyframes pendpulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,0)}50%{box-shadow:0 0 20px 2px rgba(212,160,23,.5)}}
.duel-card{animation:duelshake .55s ease}@keyframes duelshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.duel-flash{font-size:40px;animation:duelflash 1.2s ease infinite;margin-bottom:2px}@keyframes duelflash{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.duel-left{animation:slideL .55s ease both}.duel-right{animation:slideR .55s ease both}.duel-swords{font-size:30px;animation:swclash 1s ease infinite}@keyframes slideL{from{transform:translateX(-44px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes slideR{from{transform:translateX(44px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes swclash{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.2)}}
.price-input{width:120px;padding:10px 12px;border:2px solid rgba(212,160,23,.3);border-radius:10px;font-size:20px;font-weight:700;text-align:right;font-family:'Playfair Display',Georgia,serif;color:#4a7fff;outline:none;background:#060a12}.price-input:focus{border-color:#4a7fff}
.close-pal-btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;color:#060a12;background:linear-gradient(135deg,#4a7fff,#3060dd);box-shadow:0 4px 16px rgba(212,160,23,.3);margin-top:12px}.close-pal-btn:disabled{opacity:.3;cursor:default}
.hist-item{padding:14px;border-radius:12px;background:#0a0e18;margin-bottom:10px;border:1px solid #15192a;border-left:4px solid #4a7fff}
.euro-amount{font-size:13px;font-weight:700;margin-top:4px}.azul-divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0}.azul-divider::before,.azul-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#15192a,transparent)}.azul-divider .diamond{width:8px;height:8px;background:#4a7fff30;transform:rotate(45deg);border-radius:1px}
.scoreboard{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}.scoreboard th{color:#4a5a80;font-weight:600;padding:6px 4px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #15192a}.scoreboard td{padding:6px 4px;text-align:center;color:#d0dae8;border-bottom:1px solid #15192a20}.scoreboard .round-label{color:#4a5a80;font-weight:600;text-align:left;font-size:11px}.scoreboard .total-row td{color:#4a7fff;font-weight:700;font-size:15px;font-family:'Playfair Display',Georgia,serif;border-top:2px solid #4a7fff30;padding-top:10px}.scoreboard .total-row .round-label{color:#4a7fff}.scoreboard .winner-cell{color:#58d68d!important}.scoreboard .loser-cell{color:#e74c3c!important}
.taunt-box{background:#060a12;border:1px solid #e74c3c30;border-radius:10px;padding:10px 14px;margin:10px 0;text-align:center;font-size:13px;color:#e74c3c;font-weight:600}
.round-input{width:56px;padding:8px 4px;border-radius:8px;font-size:16px;font-weight:700;text-align:center;font-family:'Playfair Display',Georgia,serif;color:#fff;outline:none;background:#060a12;border:2px solid #15192a}.round-input:focus{border-color:#4a7fff}
.btn-row{display:flex;gap:8px;margin-top:12px}.btn-next{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:#2874a6;color:#fff}.btn-finish{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12}.btn-next:disabled,.btn-finish:disabled{opacity:.3;cursor:default}
.summary-winner{text-align:center;padding:16px;background:rgba(88,214,141,.1);border:2px solid rgba(88,214,141,.3);border-radius:14px;margin-bottom:14px}.summary-winner .crown{font-size:36px}.summary-winner .winner-name{font-size:22px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:#58d68d;margin-top:4px}.summary-winner .winner-score{font-size:32px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:#f4d03f}
.resume-card{background:#0a0e18;border:2px solid #4a7fff;border-radius:14px;padding:20px;margin-bottom:14px}.resume-btns{display:flex;gap:8px;margin-top:12px}.resume-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}.resume-go{background:linear-gradient(135deg,#4a7fff,#3060dd);color:#060a12}.resume-cancel{background:#15192a;color:#e74c3c}
.dom-bar{height:28px;border-radius:14px;overflow:hidden;display:flex;margin:8px 0;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}.dom-bar>div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:width .5s ease}
.crown-box{text-align:center;padding:20px 16px;background:linear-gradient(135deg,rgba(212,160,23,.1),rgba(142,68,173,.08));border:2px solid #4a7fff30;border-radius:14px;margin-bottom:14px}.crown-emoji{font-size:48px}.crown-name{font-size:24px;font-weight:900;font-family:'Playfair Display',Georgia,serif;margin-top:4px}.crown-reign{font-size:12px;color:#7a8faa;margin-top:4px}
.record-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #15192a}.record-item:last-child{border:none}.record-label{font-size:12px;color:#4a5a80}.record-val{font-weight:700;font-family:'Playfair Display',Georgia,serif;font-size:15px}
.cb-card{background:linear-gradient(135deg,rgba(142,68,173,.12),rgba(212,160,23,.08));border:2px solid #8e44ad40;border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
.night-dash{background:linear-gradient(135deg,rgba(183,149,11,.08),rgba(40,116,166,.05));border:2px solid #b7950b40;border-radius:14px;padding:20px;margin-bottom:14px}
.night-score{display:flex;justify-content:center;gap:20px;text-align:center;margin:12px 0}
.night-score .team{flex:1}.night-score .tscore{font-size:36px;font-weight:900;font-family:'Playfair Display',Georgia,serif}.night-score .tname{font-size:11px;color:#4a5a80;margin-top:4px}
.paid-btn{border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* TEXTO: claros del tema oscuro → tinta sobre crema (preserva colores de jugador) */
.container [style*="color:#e8edf5"],.container [style*="color:#d0dae8"]{color:#2a1810 !important;text-shadow:none !important;}
.container [style*="color:#4a5a80"]{color:#6a4530 !important;text-shadow:none !important;}
.container [style*="color:#fff4dc"],.container [style*="color:#e8c878"]{color:#3a2412 !important;text-shadow:none !important;}

/* Títulos de sección */
.container .section-title{color:#3a2412 !important;font-style:italic;text-shadow:0 1px 0 rgba(255,250,240,.6) !important;}

/* Subpaneles internos sobre crema (historial, filas, stats, cajas) */
.container .hist-item,.container .record-item,.container .mini-stat,
.container .pal-player,.container .pal-player.rest,.container .score-row,
.container .taunt-box,.container .summary-winner,.container .dom-bar{
  background:rgba(120,82,30,.08) !important;border-color:rgba(120,90,40,.3) !important;}
.container .pal-player.top{background:rgba(160,32,32,.13) !important;border-color:rgba(160,32,32,.45) !important;}
.container .stat-bar,.container .pal-bar{background:rgba(120,90,40,.18) !important;}
.container [style*="background:#060a12"],.container [style*="background-color:#060a12"],
.container [style*="background:#0c1220"],.container [style*="background-color:#0c1220"],
.container [style*="background:#15192a"]{background:rgba(120,82,30,.10) !important;border-color:rgba(120,90,40,.35) !important;}
.container [style*="border-bottom:1px solid #15192a"]{border-bottom-color:rgba(58,36,18,.18) !important;}

/* SCOREBOARD */
.container .scoreboard td{color:#2a1810 !important;font-weight:600 !important;border-bottom-color:rgba(58,36,18,.15) !important;}
.container .scoreboard .round-label{color:#6a4530 !important;}
.container .scoreboard th{border-bottom-color:rgba(58,36,18,.3) !important;color:#3a2412 !important;text-shadow:none !important;}
.container .scoreboard .total-row td{color:#16306e !important;border-top-color:rgba(22,48,110,.4) !important;}

/* score-row (fila jugador en partida) */
.container .score-row{background:rgba(120,82,30,.10) !important;backdrop-filter:none !important;}
.container .score-row .name{color:#2a1810 !important;text-shadow:0 1px 0 rgba(255,250,240,.5) !important;font-weight:700 !important;}
.container .score-row > span:nth-child(2){color:#7a4a1a !important;font-weight:700 !important;text-shadow:none !important;}

/* MENÚ HOME (.mbtn): botón crema + icono azulejo vidriado */
.container .mbtn{
  background:linear-gradient(180deg,#fdf8ee,#f0e6cf) !important;
  border:1.5px solid #b8923f !important;border-radius:10px !important;
  padding:10px 14px !important;min-height:60px;gap:12px !important;margin-bottom:10px !important;
  box-shadow:0 2px 5px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.6) !important;filter:none !important;}
.container .mbtn::before,.container .mbtn::after{display:none !important}
.container .mbtn:disabled{opacity:.45}
.container .mbtn .ico{
  width:48px !important;height:48px !important;border-radius:9px !important;
  background:radial-gradient(circle at 34% 28%,#3f93c4,#1f5d88) !important;border:2px solid #b8923f !important;
  display:flex !important;align-items:center !important;justify-content:center !important;
  font-size:20px !important;flex-shrink:0 !important;color:#fff !important;
  box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.3) !important;filter:none !important;}
.container .mbtn-night .ico{font-size:14px !important;letter-spacing:-1px !important}
.container .mbtn .lbl{color:#2a1810 !important;font-weight:700 !important;text-shadow:none !important;font-family:'Playfair Display',Georgia,serif !important;}
.container .mbtn .desc{color:#6a4530 !important;font-weight:600 !important;text-shadow:none !important;}

/* BOTONES DE ACCIÓN (azulejo azul vidriado, texto crema) */
.container #spinner-go,.container .btn-row > button,.container .save-btn,.container .close-pal-btn{
  background:linear-gradient(180deg,#3a82b4,#245d88) !important;color:#fdf6e3 !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5) !important;border:2px solid #b8923f !important;border-radius:10px !important;
  font-family:'Playfair Display',Georgia,serif !important;font-weight:700 !important;min-height:52px !important;
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25) !important;filter:none !important;}
.container .btn-row > button:disabled,.container .save-btn.disabled,.container .close-pal-btn:disabled{opacity:.5 !important;filter:grayscale(.3) !important;}

/* Spinner / Crown / Carta Blanca / inputs */
.container #spinner-frase{color:#7a1f1f !important;text-shadow:none !important;}
.container .crown-box{text-align:center;}
.container .crown-box .crown-name{text-shadow:0 1px 0 rgba(255,250,240,.5) !important;font-weight:900 !important;}
.container .crown-box .crown-reign{color:#6a4530 !important;text-shadow:none !important;}
.container .cb-card .section-title{color:#6c2a8a !important;}
.container .price-input{background:rgba(255,255,255,.6) !important;color:#2a1810 !important;border-color:rgba(120,90,40,.5) !important;}
.container .taunt-box{color:#2a1810 !important;}
.container .cancel-btn{background:rgba(120,82,30,.12) !important;color:#3a2412 !important;border:1px solid rgba(120,90,40,.45) !important;font-weight:600 !important;}
.container .summary-winner .winner-score{color:#7a4a1a !important;text-shadow:none !important;}

/* ════════════════════════════════════════════════
   MICRO-INTERACCIONES (animaciones · no tocan el diseño)
   ════════════════════════════════════════════════ */
.container .mbtn,
.container #spinner-go,
.container .btn-row > button,
.container .save-btn,
.container .close-pal-btn,
.container .cancel-btn,
.container .nav button{
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .14s ease, filter .12s ease !important;
}
/* Pulsación: feedback al tocar */
.container .mbtn:active,
.container #spinner-go:active,
.container .btn-row > button:active,
.container .save-btn:active,
.container .close-pal-btn:active,
.container .cancel-btn:active,
.container .nav button:active{transform:scale(.96) !important;filter:brightness(.97) !important;}
/* Elevación al pasar el ratón (solo dispositivos con hover real) */
@media (hover:hover){
  .container .mbtn:hover{transform:translateY(-2px) !important;box-shadow:0 7px 16px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.6) !important;}
  .container #spinner-go:hover,
  .container .btn-row > button:hover,
  .container .save-btn:hover,
  .container .close-pal-btn:hover{transform:translateY(-2px) !important;box-shadow:0 7px 18px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.25) !important;}
  .container .mbtn:hover .ico{transform:scale(1.07) rotate(-3deg);}
}
.container .mbtn .ico{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
/* Entrada escalonada de los botones del menú */
@keyframes mbtnIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.container .mbtn{animation:mbtnIn .38s ease both;}
.container .mbtn:nth-child(1){animation-delay:.04s}
.container .mbtn:nth-child(2){animation-delay:.10s}
.container .mbtn:nth-child(3){animation-delay:.16s}
.container .mbtn:nth-child(4){animation-delay:.22s}
.container .mbtn:nth-child(5){animation-delay:.28s}
.container .mbtn:nth-child(6){animation-delay:.34s}
/* Respeta a quien prefiere menos movimiento */
@media (prefers-reduced-motion:reduce){
  .container *,.container *::before,.container *::after{animation:none !important;transition:none !important;}
}

/* ── Colores claros restantes del tema oscuro -> visibles sobre crema ── */
.container [style*="color:#7a8faa"]{color:#6a5a44 !important}
.container [style*="color:#5dade2"]{color:#1f6f97 !important}
.container [style*="color:#58d68d"]{color:#1e7a3c !important}
.container [style*="color:#c9a86a"]{color:#7a5a1a !important;text-shadow:none !important}
.container [style*="color:#f0a0a0"]{color:#a83232 !important;text-shadow:none !important}
.container [style*="color:#f4d03f"]{color:#8a5a10 !important;text-shadow:none !important}
.container [style*="color:#d4a017"]{color:#8a5a10 !important;text-shadow:none !important}
.container [style*="color:#4a7fff"]{color:#1f4fb0 !important}
.container [style*="color:#e67e22"]{color:#9a4a10 !important}
.container .mini-stat .val,.container .val{color:#8a5a10 !important}
/* Cabecera legible sobre el fondo azul (texto claro con sombra) */
.header .sync{color:#eef0d8 !important;text-shadow:0 1px 2px rgba(0,0,0,.5) !important}

.container .summary-winner .winner-score{color:#8a5a10 !important}
.az-confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.az-confetti span{position:absolute;top:-24px;border-radius:2px;opacity:.96;box-shadow:0 1px 2px rgba(0,0,0,.35);animation-name:azfall;animation-timing-function:cubic-bezier(.3,.6,.5,1);animation-fill-mode:forwards}
@keyframes azfall{0%{transform:translateY(-24px) rotate(0)}100%{transform:translateY(108vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.az-confetti{display:none}}

/* Divisor: rombo de azulejo en lugar de la ola */
.container .azul-divider{display:flex !important;align-items:center;justify-content:center;gap:10px;margin:14px 0;opacity:1 !important}
.container .azul-divider::before,.container .azul-divider::after{content:'' !important;height:2px;flex:1;max-width:90px;background:linear-gradient(90deg,transparent,#b8923f)}
.container .azul-divider::after{background:linear-gradient(90deg,#b8923f,transparent)}
.container .az-diamond{width:12px;height:12px;background:linear-gradient(135deg,#3aa3b0,#2b7f8c);border:1.5px solid #b8923f;transform:rotate(45deg);box-shadow:0 1px 3px rgba(0,0,0,.3);flex:0 0 auto}
/* Porra: el primero ya no va en rojo, panel neutro como el resto */
.container .pal-player.top{background:rgba(120,82,30,.08) !important;border-color:rgba(184,146,63,.55) !important}
/* Animación del que empieza */
@keyframes spinTick{0%{transform:translateY(-7px);opacity:.35;filter:blur(1.5px)}100%{transform:translateY(0);opacity:1;filter:blur(0)}}
.spin-tick{animation:spinTick .12s ease}
@keyframes spinReveal{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.spin-reveal{animation:spinReveal .55s cubic-bezier(.2,1.5,.45,1) both;text-shadow:0 0 18px rgba(212,160,23,.65)}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop-in{animation:popIn .42s cubic-bezier(.2,1.5,.45,1) both}
@keyframes azburst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

function dbErr(e){if(e.code==="PERMISSION_DENIED"||e.message?.includes("permission"))up({accessDenied:true})}
onAuthStateChanged(auth,u=>{S.user=u;S.authReady=true;S.accessDenied=false;
  if(u&&!listenersReady){listenersReady=true;
    // Presence: mark online + auto-remove on disconnect
    const myRef=ref(db,"presence/"+u.uid);
    const myName=u.displayName?.split(" ")[0]||u.email?.split("@")[0]||"?";
    onValue(ref(db,".info/connected"),s=>{
      up({connected:s.val()===true});
      if(s.val()===true){set(myRef,{name:myName,email:u.email});onDisconnect(myRef).remove()}
    });
    // Listen who's online
    onValue(presenceRef,s=>{const v=s.val();up({onlineUsers:v?Object.values(v):[]})},dbErr);
    onValue(gamesRef,s=>{const v=s.val();up({games:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[],loaded:S.loaded|1})},dbErr);
    onValue(playersRef,s=>{const v=s.val();if(!v){set(playersRef,{p0:"Xose",p1:"Noelia",p2:"Pako",p3:"Miguel"});return}up({players:Object.entries(v).map(([k,n])=>({key:k,name:n})).sort((a,b)=>a.name.localeCompare(b.name)),loaded:S.loaded|2})},dbErr);
    onValue(histRef,s=>{const v=s.val();up({history:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[],loaded:S.loaded|4})},dbErr);
    onValue(activeRef,s=>{up({activeGame:s.val()||null})},dbErr);
    onValue(nightRef,s=>{up({activeNight:s.val()||null})},dbErr);
    onValue(nightHistRef,s=>{const v=s.val();up({nightHistory:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[]})},dbErr);
    onValue(miniResRef,s=>{up({miniResolutions:s.val()||{},loaded:S.loaded|8})},dbErr);

  if(!u){listenersReady=false;S.loaded=0;S.onlineUsers=[]}

// Night functions
function saveNightGame(gameData){
  const an=S.activeNight;if(!an)return;
  const games=[...(an.games||[]),gameData];
  set(nightRef,{...an,games});
}
function closeNight(){
  const an=S.activeNight;if(!an)return;
  const games=an.games||[];
  let t1w=0,t2w=0;
  games.forEach(g=>{const t1s=an.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(g.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++;});
  const winner=t1w>t2w?"team1":t2w>t1w?"team2":null;
  // Check accumulated debt from tied nights
  const unpaidTied=S.nightHistory.filter(n=>!n.winner&&!n.paid).length;
  push(nightHistRef,{date:new Date().toISOString(),team1:an.team1,team2:an.team2,team1Wins:t1w,team2Wins:t2w,winner,games,paid:false,accumulated:unpaidTied});
  remove(nightRef);
}

// Stats (free mode only)
function getStats(){const s={};S.players.forEach(p=>{s[p.name]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});S.games.filter(g=>g.mode==="free").forEach(g=>{Object.keys(g.scores).forEach(n=>{if(!s[n])s[n]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(i===0)s[n].wins++;else s[n].losses++})});return s}
function getStreaks(){const current={},best={};[...S.games].filter(g=>g.mode==="free").reverse().forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{if(!current[n])current[n]=0;if(i===0)current[n]=0;else{current[n]++;if(!best[n]||current[n]>best[n])best[n]=current[n]}})});return{current,best}}
function getTitles(){const stats=getStats(),streaks=getStreaks(),titles={};let mxL=0,mxLN="",mxW=0,mxWN="";Object.entries(stats).forEach(([n,s])=>{if(s.losses>mxL){mxL=s.losses;mxLN=n}if(s.wins>mxW){mxW=s.wins;mxWN=n}});Object.entries(stats).forEach(([n,s])=>{if(s.played===0){titles[n]=null;return}const cs=streaks.current[n]||0;if(cs>=5)titles[n]={text:"Patrocinador del Jamón",color:"#e74c3c",icon:"🐷"};else if(cs>=3)titles[n]={text:"Cajero Automático",color:"#e67e22",icon:"🏧"};else if(n===mxLN&&mxL>2)titles[n]={text:"El Paletillero Mayor",color:"#e74c3c",icon:"👑"};else if(n===mxWN&&mxW>1)titles[n]={text:"Rey del Azul",color:"#58d68d",icon:"🏆"};else titles[n]=null});return titles}
function getPaletilla(){const all=new Set(),losses={},played={};S.games.filter(g=>g.mode==="free").forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{all.add(n);played[n]=(played[n]||0)+1;if(i>0)losses[n]=(losses[n]||0)+1})});const total=Object.values(losses).reduce((a,b)=>a+b,0);const pct={};all.forEach(p=>{losses[p]=losses[p]||0;played[p]=played[p]||0;pct[p]=total>0?Math.round(losses[p]/total*100):0});return{losses,pct,total,played,allPlayers:[...all]}}
function getGlobalTotals(){const t={};S.history.forEach(h=>{if(h.payments)Object.entries(h.payments).forEach(([n,a])=>{t[n]=(t[n]||0)+a})});return t}

// Mini stats
function getMiniGames(){return S.games.filter(g=>g.mode==="mini").sort((a,b)=>a.date.localeCompare(b.date))}
function getMiniStats(){const mg=getMiniGames(),s={Xose:{w:0,l:0,total:0,best:0},Noelia:{w:0,l:0,total:0,best:0}};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{if(!s[n])return;if(i===0)s[n].w++;else s[n].l++;s[n].total+=sc;if(sc>s[n].best)s[n].best=sc})});return s}
function getCrown(){const mg=getMiniGames();if(!mg.length)return null;const last=mg[mg.length-1],sorted=Object.entries(last.scores).sort((a,b)=>b[1]-a[1]),king=sorted[0][0];let reign=0;for(let i=mg.length-1;i>=0;i--){const s=Object.entries(mg[i].scores).sort((a,b)=>b[1]-a[1]);if(s[0][0]===king)reign++;else break}return{name:king,reign}}
function getRecords(){const mg=getMiniGames();if(!mg.length)return null;let bs={n:"",s:0},bb={n:"",d:0,sc:""},cg={d:999,sc:""},str={Xose:0,Noelia:0},bstr={Xose:0,Noelia:0};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]),w=sorted[0],l=sorted[1],d=w[1]-l[1];sorted.forEach(([n,sc])=>{if(sc>bs.s)bs={n,s:sc}});if(d>bb.d)bb={n:w[0],d,sc:`${w[1]}-${l[1]}`};if(d<cg.d)cg={d,sc:`${w[1]}-${l[1]}`};["Xose","Noelia"].forEach(n=>{if(n===w[0]){str[n]++;if(str[n]>bstr[n])bstr[n]=str[n]}else str[n]=0})});return{bs,bb,cg,bstr}}
function monthLabel(key){const [y,m]=key.split("-");const s=new Date(+y,+m-1).toLocaleDateString("es-ES",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)}
function getCartaBlanca(){const mg=getMiniGames().filter(g=>!g.tiebreakerFor),months={};mg.forEach(g=>{const d=new Date(g.date),key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months[key])months[key]={Xose:0,Noelia:0};const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);months[key][sorted[0][0]]++});const now=new Date(),curKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");const res=S.miniResolutions||{};const current=months[curKey]||{Xose:0,Noelia:0};let pending=null;const pastKeys=Object.keys(months).filter(k=>k<curKey).sort();for(const k of pastKeys){if(!res[k]){const v=months[k];pending={month:k,label:monthLabel(k),xose:v.Xose,noelia:v.Noelia,tie:v.Xose===v.Noelia,winner:v.Xose>v.Noelia?"Xose":v.Noelia>v.Xose?"Noelia":null};break}}const history=Object.entries(res).map(([k,v])=>({month:k,label:monthLabel(k),...v})).sort((a,b)=>b.month.localeCompare(a.month));const totalCB={Xose:history.filter(h=>h.winner==="Xose").length,Noelia:history.filter(h=>h.winner==="Noelia").length};return{current,curKey,months,pending,history,totalCB}}

function randomNightFrase(wTeam,lTeam){const wn=wTeam.join(" y "),ln=lTeam.join(" y ");return NIGHT_FRASES[Math.floor(Math.random()*NIGHT_FRASES.length)].replace(/\[W\]/g,wn).replace(/\[L\]/g,ln)}
function randomNightMid(wTeam,lTeam,t1w,t2w,rn){const wn=wTeam.join("+"),ln=lTeam.join("+");return NIGHT_MID[Math.floor(Math.random()*NIGHT_MID.length)].replace(/\[W\]/g,wn).replace(/\[L\]/g,ln).replace(/\[X\]/g,String(t1w)).replace(/\[Y\]/g,String(t2w)).replace(/\[R\]/g,String(rn))}

function roundTotals(pl,rounds,bonuses){const t={};pl.forEach(p=>{t[p]=0});rounds.forEach(r=>{pl.forEach(p=>{t[p]+=r[p]||0})});if(bonuses)pl.forEach(p=>{t[p]+=(bonuses[p]||0)});return t}

const AZ_TILE_COLORS=["#3aa3b0","#d79a35","#2b86b5","#d63b3b","#1f5e54"];
let azAudioCtx=null;
function azSoundOn(){try{return localStorage.getItem("azulMute")!=="1"}catch(e){return true}}
function azCtx(){if(!azAudioCtx){try{azAudioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return azAudioCtx}
function playFanfare(){
  if(!azSoundOn())return; const ctx=azCtx(); if(!ctx)return; if(ctx.state==="suspended")ctx.resume();
  const now=ctx.currentTime, notes=[523.25,659.25,783.99,1046.5];
  notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=f;const t=now+i*0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.55)});
  const t2=now+notes.length*0.12+0.04;
  [1318.5,1567.98].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;const t=t2+i*0.06;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.45)});
}

let azNoiseBuf=null,azRoll=null;
function azNoise(ctx){if(!azNoiseBuf){const n=ctx.sampleRate;const bf=ctx.createBuffer(1,n,ctx.sampleRate);const d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;azNoiseBuf=bf}return azNoiseBuf}
function startDrumroll(){if(!azSoundOn())return;const ctx=azCtx();if(!ctx)return;if(ctx.state==="suspended")ctx.resume();const src=ctx.createBufferSource();src.buffer=azNoise(ctx);src.loop=true;const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1600;bp.Q.value=0.7;const g=ctx.createGain();const lfo=ctx.createOscillator();const lg=ctx.createGain();lfo.type="square";lfo.frequency.value=13;lg.gain.value=0.5;const now=ctx.currentTime;g.gain.setValueAtTime(0.03,now);g.gain.linearRampToValueAtTime(0.17,now+1.7);lfo.frequency.setValueAtTime(13,now);lfo.frequency.linearRampToValueAtTime(36,now+1.7);lfo.connect(lg).connect(g.gain);src.connect(bp).connect(g).connect(ctx.destination);src.start();lfo.start();azRoll={src,lfo,g,ctx}}
function stopDrumroll(){if(!azRoll)return;const {src,lfo,g,ctx}=azRoll;const now=ctx.currentTime;try{g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(g.gain.value,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.12);src.stop(now+0.15);lfo.stop(now+0.15)}catch(e){}azRoll=null}
function crashHit(){if(!azSoundOn())return;const ctx=azCtx();if(!ctx)return;const now=ctx.currentTime;const src=ctx.createBufferSource();src.buffer=azNoise(ctx);const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=3800;const g=ctx.createGain();g.gain.setValueAtTime(0.4,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.7);src.connect(hp).connect(g).connect(ctx.destination);src.start(now);src.stop(now+0.72);const o=ctx.createOscillator(),og=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(190,now);o.frequency.exponentialRampToValueAtTime(60,now+0.18);og.gain.setValueAtTime(0.32,now);og.gain.exponentialRampToValueAtTime(0.0001,now+0.3);o.connect(og).connect(ctx.destination);o.start(now);o.stop(now+0.32);playFanfare()}
function azConfettiAt(el){try{const r=el.getBoundingClientRect();const box=document.createElement("div");box.className="az-confetti";for(let i=0;i<18;i++){const sp=document.createElement("span");const c=AZ_TILE_COLORS[i%5],sz=7+Math.round(Math.random()*7);const ang=Math.random()*Math.PI*2,dist=30+Math.random()*80;sp.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;width:${sz}px;height:${sz}px;background:${c};animation:azburst .9s ease-out forwards;--dx:${(Math.cos(ang)*dist).toFixed(0)}px;--dy:${(Math.sin(ang)*dist).toFixed(0)}px;--rot:${Math.round(Math.random()*360)}deg`;box.appendChild(sp)}document.body.appendChild(box);setTimeout(()=>box.remove(),1100)}catch(e){}}
function animateCU(){

    const raw=el.getAttribute("data-cu"),target=parseFloat(raw)||0,isF=raw.indexOf(".")>=0,dur=750,start=performance.now();

function rNav(){const t=[{id:"home",l:"Inicio"},{id:"porra",l:"🐷 Porra"},{id:"noches",l:"🍺 Noches"},{id:"mini",l:"👑 Mini"},{id:"libre",l:"🎲 Libre"},{id:"players",l:"Jugadores"}];return`<div class="nav">${t.map(x=>`<button data-nav="${x.id}" class="${S.view===x.id&&!S.newGame?'active':''}">${x.l}</button>`).join("")}</div>`}
function divider(){return`<div class="azul-divider"><span class="az-diamond"></span></div>`}

// ══ HOME ══
function rHome(){
  const np=S.players.length;
  // Resume prompt
  let res="";
  if(!S.newGame&&S.activeGame){const ag=S.activeGame,pl=ag.selected||[];const rn=(ag.rounds||[]).length,totals=roundTotals(pl,ag.rounds||[]);const sl=pl.map(n=>`<span style="color:${gc(n)};font-weight:600">${n}:${totals[n]||0}</span>`).join(" · ");const ml={free:"Paletilla",mini:"Mini",night:"Noche",casual:"Libre"}[ag.mode]||"";res=`<div class="resume-card"><div style="text-align:center;font-size:20px;margin-bottom:6px">⏸️</div><h2 class="section-title" style="text-align:center;margin-bottom:6px">Partida en curso</h2><p style="font-size:12px;color:#7a8faa;text-align:center;margin-bottom:4px">${ml} · Ronda ${rn+1}</p><p style="font-size:12px;text-align:center;margin-bottom:12px">${sl}</p><div class="resume-btns"><button class="resume-btn resume-go" data-action="resume-game">▶ Retomar</button><button class="resume-btn resume-cancel" data-action="discard-game">✕ Cancelar</button></div></div>`}
  // Night active prompt
  let nightRes="";
  if(!S.newGame&&S.activeNight&&!S.activeGame){const an=S.activeNight,ng=(an.games||[]).length;let t1w=0,t2w=0;(an.games||[]).forEach(g=>{const t1s=an.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(g.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});nightRes=`<div class="resume-card" style="border-color:#b7950b"><div style="text-align:center;font-size:20px;margin-bottom:6px">🍺</div><h2 class="section-title" style="text-align:center;margin-bottom:6px">Noche en curso</h2><p style="font-size:12px;color:#7a8faa;text-align:center;margin-bottom:4px">${an.team1.join("+")} vs ${an.team2.join("+")} · ${ng} partida${ng!==1?'s':''}</p><p style="font-size:16px;font-weight:700;text-align:center;margin-bottom:12px;font-family:'Playfair Display',Georgia,serif"><span style="color:#5dade2">${t1w}</span> - <span style="color:#58d68d">${t2w}</span></p><div class="resume-btns"><button class="resume-btn resume-go" data-action="go-noches">▶ Ir a la noche</button></div></div>`}

  return`${res}${nightRes}<div class="card"><h2 class="section-title">Nueva partida</h2>
<button class="mbtn mbtn-pal" data-mode="free" ${np<2?'disabled':''}><span class="ico">🐷</span><span class="lbl">Paletilla Grupo</span><span class="desc">Individual · Cuenta para la porra</span></button>
<button class="mbtn mbtn-night" data-mode="night" ${np<4?'disabled':''}><span class="ico">🍺🥪</span><span class="lbl">Noche San Rafael</span><span class="desc">2v2 · Quién pierde paga bocatas</span></button>
<button class="mbtn mbtn-mini" data-mode="mini"><span class="ico">👑</span><span class="lbl">Azul Mini</span><span class="desc">Xose vs Noelia · Carta Blanca</span></button>
<button class="mbtn mbtn-casual" data-mode="casual" ${np<2?'disabled':''}><span class="ico">🎲</span><span class="lbl">Libre</span><span class="desc">Sin apuesta · Solo por diversión</span></button>
</div>`}

// ══ SHARED GAME FLOW ══
function rNewGame(){const g=S.newGame,pl=g.mode==="2v2"&&g.team1?.length?[...g.team1,...g.team2]:(g.mode==="night"&&g.team1?.length?[...g.team1,...g.team2]:g.selected);
// PICK
if(g.step==="pick"){const isNight=g.mode==="night";const min=isNight?4:(g.mode==="casual_team"?4:2);const chips=S.players.map(p=>{const on=g.selected.includes(p.name),col=gc(p.name),can=on||!isNight||g.selected.length<4;return`<button class="chip ${on?'on':''}" data-pick="${p.name}" style="${on?`background:${col};border-color:${col};color:#fff`:''}${!can?';opacity:.3':''}" ${!can?'disabled':''}>${p.name}</button>`}).join("");const ok=isNight?g.selected.length===4:g.selected.length>=min;const title={free:"Paletilla Grupo",night:"Noche San Rafael",casual:"Libre"}[g.mode]||"Partida";return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">${title}</h2><button class="cancel-btn" data-action="cancel-new">Cancelar</button></div><div class="step-label"><span class="step-num">1</span> Elige jugadores${isNight?' (4)':''}</div><div class="chip-grid">${chips}</div><button class="save-btn ${ok?'ok':'disabled'}" data-action="next-step">${isNight?"Formar equipos":"Iniciar partida"}</button></div>`}
// TEAMS (night mode)
if(g.step==="teams"){const rt=(t,l,c,k)=>`<div><div class="team-label" style="color:${c}">${l}</div>${t.map(p=>`<button class="team-player" data-swap="${p}" data-from="${k}" style="border:2px solid ${gc(p)};background:${gc(p)}20;color:${gc(p)}">${p}</button>`).join("")}</div>`;const bal=g.team1.length===2&&g.team2.length===2;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">Equipos</h2><button class="cancel-btn" data-action="back-pick">Atrás</button></div><div class="teams-box"><div style="font-size:12px;color:#4a5a80;margin-bottom:10px">Toca para cambiar</div><div class="teams-grid">${rt(g.team1,"Equipo 1","#5dade2","team1")}${rt(g.team2,"Equipo 2","#58d68d","team2")}</div></div><button class="save-btn ${bal?'ok':'disabled'}" data-action="start-game">${g.mode==="night"?"🍺 Iniciar noche":"Iniciar partida"}</button></div>`}
// STARTER - who goes first
// DUEL (tiebreaker intro)
if(g.step==="duel"){const xc=gc("Xose"),nc=gc("Noelia");const mn=g.tiebreakerLabel?g.tiebreakerLabel.split(" ")[0]:"el mes";const av=n=>AVATARS[n]?`<img src="${AVATARS[n]}" style="width:84px;height:84px;border-radius:18px;object-fit:cover;border:3px solid ${gc(n)};box-shadow:0 4px 18px rgba(0,0,0,.5)">`:`<div style="width:84px;height:84px;border-radius:18px;background:${gc(n)};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:42px;font-family:'Playfair Display',Georgia,serif">${n[0]}</div>`;return`<div class="card duel-card" style="text-align:center;padding:34px 22px"><div class="duel-flash">⚔️</div><h2 style="font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:30px;color:#d4a017;letter-spacing:2px;text-shadow:0 2px 8px rgba(212,160,23,.4)">DESEMPATE</h2><p style="font-size:13px;color:#c9a86a;margin:6px 0 18px">La Carta Blanca de <b style="color:#e8c878">${mn}</b> en juego</p><div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0"><div class="duel-fighter duel-left">${av("Xose")}<div style="color:${xc};font-weight:800;margin-top:6px;font-family:'Playfair Display',Georgia,serif">Xose</div></div><div class="duel-swords">⚔️</div><div class="duel-fighter duel-right">${av("Noelia")}<div style="color:${nc};font-weight:800;margin-top:6px;font-family:'Playfair Display',Georgia,serif">Noelia</div></div></div><p style="font-size:13px;color:#f0a0a0;font-weight:700;font-style:italic;margin:14px 0">Una partida. Todo o nada. La carta para el ganador.</p><button class="save-btn ok" data-action="duel-go" style="margin-top:6px">⚔️ ¡Que empiece el duelo!</button></div>`}

// ══ NOCHES ══
function rNoches(){

  if(an&&!S.newGame){
    const games=an.games||[];
    let t1w=0,t2w=0;

    let closeHtml="";
    if(games.length>0){if(!S.confirmCloseNight)closeHtml=`<button class="save-btn ok" data-action="ask-close-night" style="margin-top:12px">🍺 Cerrar noche · Ir al San Rafael</button>`;else closeHtml=`<div style="text-align:center;padding:10px 0"><p style="font-size:13px;font-weight:600;color:#e74c3c;margin-bottom:10px">¿Cerrar la noche?</p><button class="reset-btn reset-danger" data-action="close-night-yes">Sí</button><button class="reset-btn reset-cancel" data-action="close-night-no">No</button></div>`}

    return`<div class="night-dash"><div style="text-align:center"><span style="font-size:32px">🍺🥪</span><h2 class="section-title" style="margin-top:4px">Noche San Rafael</h2></div><div style="text-align:center;font-size:12px;color:#7a8faa;margin-bottom:8px">${an.team1.join(" + ")} vs ${an.team2.join(" + ")}</div><div class="night-score"><div class="team"><div class="tscore" style="color:#5dade2">${t1w}</div><div class="tname">${an.team1.join(" + ")}</div></div><div style="align-self:center;font-size:20px;color:#4a6380">vs</div><div class="team"><div class="tscore" style="color:#58d68d">${t2w}</div><div class="tname">${an.team2.join(" + ")}</div></div></div>${leading?`<p style="text-align:center;font-size:12px;color:${leading===an.team1?'#5dade2':'#58d68d'};font-weight:600;margin-bottom:8px">${leading.join(" + ")} van ganando</p>`:(games.length>0?'<p style="text-align:center;font-size:12px;color:#e67e22;font-weight:600;margin-bottom:8px">¡Empate! Nadie paga si acaba así</p>':'')}<button class="mbtn mbtn-night" data-action="new-night-game" style="margin-top:8px"><span class="lbl" style="font-size:16px">▶ Nueva partida</span></button>${closeHtml}</div>`;
  }

let recHtml="";if(records)recHtml=`<div class="card"><h2 class="section-title">🏅 Récords</h2><div class="record-item"><span class="record-label">Mejor puntuación</span><span class="record-val" style="color:${gc(records.bs.n)}">${records.bs.n} ${records.bs.s}</span></div><div class="record-item"><span class="record-label">Mayor paliza</span><span class="record-val" style="color:${gc(records.bb.n)}">${records.bb.sc} (+${records.bb.d})</span></div><div class="record-item"><span class="record-label">Más reñida</span><span class="record-val">${records.cg.sc} (dif.${records.cg.d})</span></div><div class="record-item"><span class="record-label">Racha Xose</span><span class="record-val" style="color:${xc}">${records.bstr.Xose}</span></div><div class="record-item"><span class="record-label">Racha Noelia</span><span class="record-val" style="color:${nc}">${records.bstr.Noelia}</span></div></div>`;

document.querySelector("[data-action='back-playing']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const cr={};pl.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelectorAll("[data-bplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.bonuses[inp.dataset.bplayer]=inp.value;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.bonuses[p]!=null&&g.bonuses[p]!==""&&!isNaN(Number(g.bonuses[p])));const sb=document.querySelector("[data-action='show-summary']");if(sb)sb.className="save-btn "+(ok?"ok":"disabled")}});
document.querySelector("[data-action='show-summary']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const bonuses={};pl.forEach(p=>{bonuses[p]=Math.max(0,parseInt(g.bonuses[p])||0)});up({newGame:{...g,step:"summary",bonuses}})});

// SAVE GAME
document.querySelector("[data-action='save-game']")?.addEventListener("click",()=>{if(!g)return;
  const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;
  const totals=roundTotals(pl,g.rounds,g.bonuses);
  const sv={mode:g.mode,scores:totals,date:new Date().toISOString(),roundCount:(g.rounds||[]).length};
  if(g.team1?.length){sv.team1=g.team1;sv.team2=g.team2}
  if(g.tiebreakerFor)sv.tiebreakerFor=g.tiebreakerFor;
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),w=sorted[0][0],l=sorted[sorted.length-1][0];

  if(g.mode==="night"){
    // Add to active night
    saveNightGame(sv);
    clearActiveGame();
    // Toast with night score update
    const an=S.activeNight;
    let t1w=0,t2w=0;
    [...(an?.games||[]),sv].forEach(gg=>{const t1s=(g.team1||[]).reduce((s,n)=>s+(gg.scores[n]||0),0),t2s=(g.team2||[]).reduce((s,n)=>s+(gg.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});
    up({newGame:null,view:"noches",toast:{icon:"🍺",title:`${t1w} - ${t2w}`,msg:`Partida guardada. ${t1w===t2w?"¡Empate de momento!":t1w>t2w?g.team1.join(" y ")+" van ganando":g.team2.join(" y ")+" van ganando"}`,color:"#b7950b"}});
  }else if(g.tiebreakerFor){
    saveGame(sv);clearActiveGame();
    const month=g.tiebreakerFor,lbl=g.tiebreakerLabel||"",mn=(lbl.split(" ")[0])||"el mes";
    const tie=sorted[0][1]===sorted[sorted.length-1][1];
    if(tie){
      up({newGame:null,view:"mini",toast:{icon:"🤯",title:"¡Otra vez empate!",msg:`${sorted[0][1]}-${sorted[sorted.length-1][1]} en el desempate. No vale, hay que repetir. Jugad otra.`,color:"#e67e22"}});
    }else{
      const ct=getCartaBlanca(),mt=(ct.months&&ct.months[month])||{Xose:0,Noelia:0};
      set(ref(db,"mini_resolutions/"+month),{winner:w,method:"tiebreaker",xose:mt.Xose,noelia:mt.Noelia,resolvedAt:new Date().toISOString()});
      up({newGame:null,view:"mini",toast:{flip:true,winner:w,loser:l,icon:"🃏",title:`Carta Blanca de ${mn}`,msg:`${w} gana el desempate y se lleva la carta. ${randomMiniFrase(w,l)}`,color:"#bb8fce"}});
    }
  }else{
    saveGame(sv);clearActiveGame();
    let toastMsg,toastIcon="💀",toastTitle="¡Derrota!",toastColor="#e74c3c";
    if(g.mode==="mini"){toastMsg=randomMiniFrase(w,l);toastIcon="👑";toastTitle="¡Victoria!";toastColor="#bb8fce"}
    else if(g.mode==="casual"){toastMsg=`${w} gana con ${sorted[0][1]} puntos`;toastIcon="🎲";toastTitle="Partida guardada";toastColor="#58d68d"}
    else{toastMsg=randomFrase(l);toastIcon="🍖";toastTitle="¡A pagar paletilla!";toastColor="#e67e22"}
    up({newGame:null,view:g.mode==="mini"?"mini":g.mode==="casual"?"libre":"porra",toast:{icon:toastIcon,title:toastTitle,msg:toastMsg,color:toastColor,jamon:g.mode==="free"}});
  }
});

// Delete game
document.querySelectorAll("[data-delask]").forEach(b=>{b.onclick=()=>up({confirmDelete:b.dataset.delask})});
document.querySelectorAll("[data-delconfirm]").forEach(b=>{b.onclick=()=>{deleteGame(b.dataset.delconfirm);up({confirmDelete:null})}});
document.querySelectorAll("[data-delcancel]").forEach(b=>{b.onclick=()=>up({confirmDelete:null})});
// Toast
document.querySelectorAll("[data-action='close-toast']").forEach(b=>{b.onclick=e=>{if(e.target===b||e.target.dataset.action==="close-toast")up({toast:null})}});
// Price
document.getElementById("palPriceInput")?.addEventListener("input",e=>{S.palPrice=e.target.value;updateEuros()});
document.querySelector("[data-action='close-ask']")?.addEventListener("click",()=>up({confirmClose:true}));
document.querySelector("[data-action='close-yes']")?.addEventListener("click",()=>{const p=parseFloat(S.palPrice)||0;if(p>0){closePaletilla(p);up({confirmClose:false,palPrice:""})}});
document.querySelector("[data-action='close-no']")?.addEventListener("click",()=>up({confirmClose:false}));
// Players
document.querySelector("[data-action='add-player']")?.addEventListener("click",()=>{const i=document.getElementById("npi");if(i&&i.value.trim()){addPlayer(i.value.trim());i.value=""}});
document.getElementById("npi")?.addEventListener("keydown",e=>{if(e.key==="Enter"){const i=e.target;if(i.value.trim()){addPlayer(i.value.trim());i.value=""}}});
document.querySelectorAll("[data-rmask]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:b.dataset.rmask})});
document.querySelectorAll("[data-rmyes]").forEach(b=>{b.onclick=()=>{removePlayer(b.dataset.rmyes);up({confirmRemovePlayer:null})}});
document.querySelectorAll("[data-rmno]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:null})});
if(S.palPrice)updateEuros();}
render();
</script>
</body>
</html>
