<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a5276">
<title>Azul · La Porra de la Paletilla</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;overflow-y:scroll}
  body{
    font-family:'DM Sans','Segoe UI',sans-serif;
    background:linear-gradient(135deg,#f5f0e8 0%,#e8e0d0 100%);
    min-height:100%;color:#2c3e50;-webkit-tap-highlight-color:transparent;
  }
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
  .container{max-width:520px;margin:0 auto;padding:16px 12px 110px;position:relative;z-index:1}
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 20% 30%,rgba(26,82,118,.04) 0%,transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(212,160,23,.04) 0%,transparent 50%);
  }
  .header{text-align:center;margin-bottom:24px;padding-top:8px}
  .header h1{font-family:'Playfair Display',Georgia,serif;font-size:36px;font-weight:900;color:#1a5276;letter-spacing:-.02em;line-height:1.1}
  .tiles{display:flex;justify-content:center;gap:4px;margin:6px 0}
  .tile{width:10px;height:10px;border-radius:2px}
  .header .sub{font-size:13px;color:#7f8c8d;font-weight:500}
  .sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#7f8c8d;margin-top:4px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#48c9b0}
  .sync-dot.off{background:#e74c3c}

  .nav{display:flex;gap:0;margin-bottom:20px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .nav button{flex:1;padding:10px 4px;border:none;border-radius:10px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;background:transparent;color:#7f8c8d}
  .nav button.active{background:#1a5276;color:#fff;font-weight:700}

  .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.05);animation:fadeUp .3s ease both}
  .card-muted{background:#faf8f4}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .section-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:#2c3e50;margin-bottom:12px}

  .mode-btns{display:flex;gap:10px}
  .mode-btn{flex:1;padding:20px 12px;border:none;border-radius:12px;color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:700;cursor:pointer;transition:transform .15s}
  .mode-btn:active{transform:scale(.97)}
  .mode-btn .num{font-size:22px;display:block}
  .mode-btn .lbl{font-size:11px;opacity:.85}
  .mode-3{background:#2874a6;box-shadow:0 3px 12px #2874a640}
  .mode-4{background:#1e8449;box-shadow:0 3px 12px #1e844940}
  .mode-btn:disabled{opacity:.35;cursor:default}

  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;border:2px solid #ddd;background:#f8f8f8;color:#999}
  .chip.on{color:#fff;border-color:transparent}
  .chip:active{transform:scale(.95)}

  .add-player-row{display:flex;gap:8px;margin-top:12px}
  .add-player-row input{flex:1;padding:10px 12px;border:2px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fff}
  .add-player-row input:focus{border-color:#1a5276}
  .add-player-row button{padding:10px 16px;border:none;border-radius:10px;background:#1a5276;color:#fff;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}

  .score-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;margin-bottom:8px}
  .score-row .name{flex:1;font-weight:600;font-size:15px}
  .score-row input{width:72px;padding:10px 12px;border-radius:8px;font-size:18px;font-weight:700;text-align:center;font-family:'Playfair Display',Georgia,serif;color:#2c3e50;outline:none;background:#fff}

  .teams-box{margin-bottom:20px;padding:14px;background:#f8f6f0;border-radius:10px}
  .teams-grid{display:flex;gap:10px}
  .teams-grid>div{flex:1}
  .team-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .team-player{display:block;width:100%;margin-bottom:4px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left}

  .save-btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;transition:all .2s}
  .save-btn.ok{background:#1a5276;box-shadow:0 3px 12px #1a527640}
  .save-btn.disabled{background:#d5d5d5;cursor:default}
  .cancel-btn{border:none;background:#f0f0f0;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#7f8c8d;font-family:inherit}

  .badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .badge-3{background:#2874a618;color:#2874a6}
  .badge-4{background:#1e844918;color:#1e8449}

  .game-player{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;margin-bottom:4px}
  .game-player .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .game-player .pname{flex:1;font-size:14px}
  .game-player .pscore{font-size:18px;font-weight:700;font-family:'Playfair Display',Georgia,serif;min-width:36px;text-align:right}
  .game-winner{background:#1e844908}
  .game-loser{background:#c0392b06}
  .team-score-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-right:6px;margin-bottom:8px}

  .delete-btn{border:none;background:none;font-size:11px;color:#7f8c8d;cursor:pointer;font-family:inherit;padding:4px 8px}
  .confirm-yes{border:none;background:#c0392b;color:#fff;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;margin-right:6px;font-family:inherit}
  .confirm-no{border:none;background:#eee;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:#7f8c8d}

  .stat-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:20px}
  .stat-bar{margin-top:12px;height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
  .stat-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
  .mini-stat .val{font-size:20px;font-weight:700;font-family:'Playfair Display',Georgia,serif}
  .mini-stat .lbl{font-size:10px;color:#7f8c8d;font-weight:500}
  .big-num{font-size:28px;font-weight:700;font-family:'Playfair Display',Georgia,serif}

  .pal-player{padding:14px 16px;border-radius:12px;margin-bottom:10px}
  .pal-player.top{background:#c0392b08;border:2px solid #c0392b25}
  .pal-player.rest{background:#fafafa;border:2px solid transparent}
  .pal-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin-top:6px}
  .pal-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}

  .reset-btn{width:100%;padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .reset-outline{border:2px solid #c0392b30;background:transparent;color:#c0392b}
  .reset-danger{border:none;background:#c0392b;color:#fff;padding:10px 24px;width:auto;margin-right:8px}
  .reset-cancel{border:none;background:#eee;color:#7f8c8d;padding:10px 24px;width:auto}

  .empty{text-align:center;color:#7f8c8d;font-size:14px;padding:20px}
  .step-label{font-size:12px;font-weight:600;color:#7f8c8d;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1a5276;color:#fff;font-size:11px;font-weight:700;margin-right:6px}
</style>
</head>
<body>
<div id="app" class="container"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,onValue,set,remove,push}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const db=getDatabase(initializeApp({
  apiKey:"AIzaSyByuQTGzRG40fagc-6Ce55k8aGczTIDQF8",
  authDomain:"azul-paletilla.firebaseapp.com",
  databaseURL:"https://azul-paletilla-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"azul-paletilla",
  storageBucket:"azul-paletilla.firebasestorage.app",
  messagingSenderId:"731980312988",
  appId:"1:731980312988:web:435ee7782c20fd51945859"
}));

const gamesRef=ref(db,"games"),playersRef=ref(db,"players");
const PALETTE=["#2874a6","#c0392b","#d4a017","#1e8449","#8e44ad","#d35400","#16a085","#2c3e50","#b7950b","#7d3c98","#1a5276","#e74c3c"];

let S={games:[],players:[],view:"home",newGame:null,confirmDelete:null,confirmReset:false,connected:false,loaded:0,confirmRemovePlayer:null};
function up(p){Object.assign(S,p);render()}

onValue(ref(db,".info/connected"),s=>{up({connected:s.val()===true})});

onValue(gamesRef,s=>{
  const v=s.val();
  up({games:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[],loaded:S.loaded|1});
});

onValue(playersRef,s=>{
  const v=s.val();
  if(!v){set(playersRef,{p0:"Xose",p1:"Noelia",p2:"Pako",p3:"Miguel"}); return;}
  up({players:Object.entries(v).map(([k,n])=>({key:k,name:n})).sort((a,b)=>a.name.localeCompare(b.name)),loaded:S.loaded|2});
});

function addPlayer(n){const c=n.trim();if(!c||S.players.some(p=>p.name.toLowerCase()===c.toLowerCase()))return;push(playersRef,c)}
function removePlayer(k){remove(ref(db,"players/"+k))}
function saveGame(g){set(ref(db,"games/"+(Date.now().toString(36)+Math.random().toString(36).slice(2,6))),g)}
function deleteGame(k){remove(ref(db,"games/"+k))}
function resetAll(){remove(gamesRef)}
function gc(name){const i=S.players.findIndex(p=>p.name===name);return PALETTE[i>=0?i%PALETTE.length:0]}
function pn(){return S.players.map(p=>p.name)}

function getStats(){
  const s={};pn().forEach(p=>{s[p]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});
  S.games.forEach(g=>{
    Object.keys(g.scores).forEach(n=>{if(!s[n])s[n]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});
    if(g.mode==="free"){
      const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);
      sorted.forEach(([n,sc],i)=>{s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(i===0)s[n].wins++;if(i===sorted.length-1)s[n].losses++});
    }else if(g.mode==="2v2"){
      const t1=g.team1.reduce((x,n)=>x+(g.scores[n]||0),0),t2=g.team2.reduce((x,n)=>x+(g.scores[n]||0),0);
      const w=t1>=t2?g.team1:g.team2;
      [...g.team1,...g.team2].forEach(n=>{const sc=g.scores[n]||0;s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(w.includes(n))s[n].wins++;else s[n].losses++});
    }
  });return s;
}

function getPaletilla(){
  const all=new Set(),losses={},played={};
  S.games.forEach(g=>{if(g.mode==="free"){
    const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);
    const loser=sorted[sorted.length-1][0];
    sorted.forEach(([n])=>{all.add(n);played[n]=(played[n]||0)+1});
    losses[loser]=(losses[loser]||0)+1;
  }});
  const total=Object.values(losses).reduce((a,b)=>a+b,0);const pct={};
  all.forEach(p=>{losses[p]=losses[p]||0;played[p]=played[p]||0;pct[p]=total>0?Math.round(losses[p]/total*100):0});
  return{losses,pct,total,played,allPlayers:[...all]};
}

const app=document.getElementById("app");

function render(){
  if(S.loaded<3){app.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh"><span style="font-family:'Playfair Display',Georgia,serif;font-size:20px;color:#1a5276">Cargando...</span></div>`;return}
  app.innerHTML=rHeader()+rNav()+(S.newGame?rNewGame():({home:rHome,history:rHistory,stats:rStats,paletilla:rPaletilla,players:rPlayers})[S.view]());
  bindEvents();
}

function rHeader(){
  const c=["#2874a6","#d4a017","#c0392b","#1a1a2e","#48c9b0"];
  const dot=S.connected?'<span class="sync-dot"></span> Sincronizado':'<span class="sync-dot off"></span> Sin conexión';
  return`<div class="header"><h1>Azul</h1><div class="tiles">${c.map((x,i)=>`<div class="tile" style="background:${x};transform:rotate(${i*15-30}deg)"></div>`).join("")}</div><div class="sub">La Porra de la Paletilla</div><div class="sync">${dot}</div></div>`;
}

function rNav(){
  const t=[{id:"home",l:"Inicio"},{id:"history",l:"Partidas"},{id:"stats",l:"Stats"},{id:"paletilla",l:"Paletilla"},{id:"players",l:"Jugadores"}];
  return`<div class="nav">${t.map(x=>`<button data-nav="${x.id}" class="${S.view===x.id?'active':''}">${x.l}</button>`).join("")}</div>`;
}

function rHome(){
  const g=S.games,g3=g.filter(x=>x.mode==="free").length,g4=g.filter(x=>x.mode==="2v2").length;
  let q="";
  if(g.length>0)q=`<div class="card"><h2 class="section-title">Resumen rápido</h2><div style="display:flex;justify-content:space-around;text-align:center"><div><div class="big-num" style="color:#1a5276">${g.length}</div><div style="font-size:11px;color:#7f8c8d">Partidas</div></div><div><div class="big-num" style="color:#d4a017">${g3}</div><div style="font-size:11px;color:#7f8c8d">Libre</div></div><div><div class="big-num" style="color:#1e8449">${g4}</div><div style="font-size:11px;color:#7f8c8d">Equipos</div></div></div></div>`;
  const np=S.players.length;
  return`<div class="card"><h2 class="section-title">Nueva partida</h2><p style="font-size:13px;color:#7f8c8d;margin-bottom:16px">Elige el modo de juego</p>${np<2?'<p style="font-size:13px;color:#c0392b;margin-bottom:12px">Añade al menos 2 jugadores en la pestaña Jugadores</p>':''}<div class="mode-btns"><button class="mode-btn mode-3" data-mode="free" ${np<2?'disabled':''}><span class="num">Libre</span><span class="lbl">Individual</span></button><button class="mode-btn mode-4" data-mode="2v2" ${np<4?'disabled':''}><span class="num">2v2</span><span class="lbl">Equipos</span></button></div>${np<4?'<p style="font-size:11px;color:#7f8c8d;margin-top:8px;text-align:center">2v2 necesita al menos 4 jugadores</p>':''}</div>${q}<div class="card"><h2 class="section-title">Reglas de la Porra</h2><div style="font-size:13px;line-height:1.6"><p style="margin-bottom:8px">Cada derrota en partida libre suma <strong>1 punto de deuda</strong>. El reparto del coste de la paletilla es proporcional a las derrotas.</p><p>Las partidas 2v2 son por diversión y <strong>no cuentan</strong> para la porra.</p></div></div>`;
}

function rNewGame(){
  const g=S.newGame;
  if(g.step==="pick"){
    const min=g.mode==="free"?2:4,exact4=g.mode==="2v2";
    const chips=S.players.map(p=>{const on=g.selected.includes(p.name);const col=gc(p.name);const can=on||!exact4||g.selected.length<4;return`<button class="chip ${on?'on':''}" data-pick="${p.name}" style="${on?`background:${col};border-color:${col};color:#fff`:''}${!can?';opacity:.3':''}" ${!can?'disabled':''}>${p.name}</button>`}).join("");
    const ok=exact4?g.selected.length===4:g.selected.length>=min;
    return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">${g.mode==="free"?"Partida libre":"Partida 2v2"}</h2><button class="cancel-btn" data-action="cancel-new">Cancelar</button></div><div class="step-label"><span class="step-num">1</span> Elige jugadores ${exact4?'(4 exactos)':`(mín. ${min})`}</div><div class="chip-grid">${chips}</div><button class="save-btn ${ok?'ok':'disabled'}" data-action="next-step">${g.mode==="2v2"?"Formar equipos":"Meter puntuaciones"}</button></div>`;
  }
  if(g.step==="teams"){
    const rt=(team,label,color,key)=>`<div><div class="team-label" style="color:${color}">${label}</div>${team.map(p=>`<button class="team-player" data-swap="${p}" data-from="${key}" style="border:2px solid ${gc(p)};background:${gc(p)}15;color:${gc(p)}">${p}</button>`).join("")}</div>`;
    const bal=g.team1.length===2&&g.team2.length===2;
    return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">Formar equipos</h2><button class="cancel-btn" data-action="back-pick">Atrás</button></div><div class="teams-box"><div style="font-size:12px;color:#7f8c8d;margin-bottom:10px">Toca un nombre para cambiarlo de equipo</div><div class="teams-grid">${rt(g.team1,"Equipo 1","#2874a6","team1")}${rt(g.team2,"Equipo 2","#1e8449","team2")}</div></div>${!bal?'<p style="font-size:12px;color:#c0392b;text-align:center;margin-bottom:8px">Cada equipo debe tener 2 jugadores</p>':''}<button class="save-btn ${bal?'ok':'disabled'}" data-action="next-scores">Meter puntuaciones</button></div>`;
  }
  if(g.step==="scores"){
    const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;
    const rows=pl.map(p=>{const col=gc(p);return`<div class="score-row" style="background:${col}08;border-left:4px solid ${col}"><span class="name">${p}</span><input type="number" inputmode="numeric" placeholder="Pts" data-player="${p}" value="${g.scores[p]||''}" style="border:2px solid ${col}30"></div>`}).join("");
    const ok=pl.every(p=>g.scores[p]!=null&&g.scores[p]!==""&&!isNaN(Number(g.scores[p])));
    const teamInfo=g.mode==="2v2"?`<div style="margin-bottom:12px"><span class="team-score-tag" style="color:#2874a6;background:#2874a610">Eq1: ${g.team1.join(" + ")}</span><span class="team-score-tag" style="color:#1e8449;background:#1e844910">Eq2: ${g.team2.join(" + ")}</span></div>`:'';
    return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">Puntuaciones</h2><button class="cancel-btn" data-action="${g.mode==='2v2'?'back-teams':'back-pick'}">Atrás</button></div>${teamInfo}<div>${rows}</div><button class="save-btn ${ok?'ok':'disabled'}" data-action="save-game">Guardar partida</button></div>`;
  }
}

function rHistory(){
  if(!S.games.length)return`<div class="card"><p class="empty">Aún no hay partidas registradas</p></div>`;
  return S.games.map(g=>{
    const d=new Date(g.date),ds=d.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}),ts=d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
    const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);
    let tt="";
    if(g.mode==="2v2"){const t1s=g.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=g.team2.reduce((s,n)=>s+(g.scores[n]||0),0);tt=`<div style="margin-bottom:8px"><span class="team-score-tag" style="color:#2874a6;background:#2874a610">Eq1: ${g.team1.join(" + ")} = ${t1s}</span><span class="team-score-tag" style="color:#1e8449;background:#1e844910">Eq2: ${g.team2.join(" + ")} = ${t2s}</span></div>`}
    const del=S.confirmDelete===g._key?`<span style="font-size:12px"><span style="color:#7f8c8d;margin-right:8px">¿Seguro?</span><button class="confirm-yes" data-delconfirm="${g._key}">Sí</button><button class="confirm-no" data-delcancel>No</button></span>`:`<button class="delete-btn" data-delask="${g._key}">Eliminar</button>`;
    const rows=sorted.map(([n,sc],i)=>{const isW=i===0,isL=i===sorted.length-1,col=gc(n);return`<div class="game-player ${isW?'game-winner':''} ${isL?'game-loser':''}"><div class="dot" style="background:${col}"></div><span class="pname" style="font-weight:${isW?700:500}">${n}</span>${isW?'<span style="font-size:12px">👑</span>':''}${isL&&g.mode==="free"?'<span style="font-size:10px">💸</span>':''}<span class="pscore" style="color:${isW?'#1e8449':isL?'#c0392b':'#2c3e50'}">${sc}</span></div>`}).join("");
    const np=Object.keys(g.scores).length;
    return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><span class="badge ${g.mode==="free"?"badge-3":"badge-4"}">${g.mode==="free"?`Libre (${np})`:"2v2"}</span><div style="font-size:12px;color:#7f8c8d;text-align:right">${ds}<br>${ts}</div></div>${tt}<div>${rows}</div><div style="margin-top:10px;text-align:right">${del}</div></div>`;
  }).join("");
}

function rStats(){
  const stats=getStats();const active=Object.entries(stats).filter(([,s])=>s.played>0).sort((a,b)=>b[1].wins-a[1].wins);
  if(!active.length)return`<div class="card"><p class="empty">Juega alguna partida para ver estadísticas</p></div>`;
  return active.map(([name,s])=>{
    const wr=s.played>0?Math.round(s.wins/s.played*100):0,avg=s.played>0?Math.round(s.totalScore/s.played):0,col=gc(name);
    return`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="stat-avatar" style="background:${col}">${name[0]}</div><div><div style="font-weight:700;font-size:16px">${name}</div><div style="font-size:12px;color:#7f8c8d">${s.played} partida${s.played!==1?'s':''}</div></div><div style="margin-left:auto;text-align:right"><div style="font-size:24px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:${col}">${wr}%</div><div style="font-size:10px;color:#7f8c8d">Victorias</div></div></div><div style="display:flex;justify-content:space-around;text-align:center"><div class="mini-stat"><div class="val" style="color:#1e8449">${s.wins}</div><div class="lbl">Victorias</div></div><div class="mini-stat"><div class="val" style="color:#c0392b">${s.losses}</div><div class="lbl">Derrotas</div></div><div class="mini-stat"><div class="val" style="color:#1a5276">${avg}</div><div class="lbl">Promedio</div></div><div class="mini-stat"><div class="val" style="color:#d4a017">${s.bestScore}</div><div class="lbl">Mejor</div></div></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${wr}%;background:linear-gradient(90deg,${col},${col}cc)"></div></div></div>`;
  }).join("");
}

function rPaletilla(){
  const pal=getPaletilla(),gF=S.games.filter(x=>x.mode==="free").length;
  const sorted=[...pal.allPlayers].sort((a,b)=>(pal.pct[b]||0)-(pal.pct[a]||0));
  let content;
  if(!gF)content=`<p class="empty">Jugad partidas libres para ver quién paga más</p>`;
  else content=sorted.map((name,i)=>{
    const p=pal.pct[name]||0,l=pal.losses[name]||0,pl=pal.played[name]||0,col=gc(name);
    const medal=i===0?"💸":(i===sorted.length-1&&l===0?"🎉":"");
    const bc=i===0?`linear-gradient(90deg,#c0392b,#c0392bcc)`:`linear-gradient(90deg,${col},${col}aa)`;
    return`<div class="pal-player ${i===0?'top':'rest'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:7px;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;font-family:'Playfair Display',Georgia,serif">${name[0]}</div><span style="font-weight:700;font-size:15px">${name}</span>${medal?`<span>${medal}</span>`:''}</div><span style="font-size:24px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:${i===0?'#c0392b':'#2c3e50'}">${p}%</span></div><div style="font-size:12px;color:#7f8c8d;margin-bottom:6px">${l} derrota${l!==1?'s':''} de ${pl} partida${pl!==1?'s':''}</div><div class="pal-bar"><div class="pal-bar-fill" style="width:${p}%;background:${bc}"></div></div></div>`;
  }).join("");

  let rh="";
  if(gF>0){
    if(S.confirmReset)rh=`<div class="card card-muted" style="text-align:center"><p style="font-size:13px;color:#c0392b;font-weight:600;margin-bottom:10px">¿Borrar todas las partidas? No se puede deshacer.</p><button class="reset-btn reset-danger" data-action="reset-yes">Sí, borrar</button><button class="reset-btn reset-cancel" data-action="reset-no">No</button></div>`;
    else rh=`<div class="card card-muted"><p style="font-size:12px;color:#7f8c8d;margin-bottom:10px;text-align:center">Cuando compréis la paletilla, resetead el contador</p><button class="reset-btn reset-outline" data-action="reset-ask">Resetear todo</button></div>`;
  }
  return`<div class="card"><div style="text-align:center;margin-bottom:16px"><span style="font-size:42px">🐷</span><h2 class="section-title" style="margin-bottom:4px;margin-top:4px">La Paletilla</h2><p style="font-size:12px;color:#7f8c8d">${gF} partida${gF!==1?'s':''} libre${gF!==1?'s':''} · ${pal.total} derrota${pal.total!==1?'s':''} totales</p></div>${content}</div>${rh}`;
}

function rPlayers(){
  const list=S.players.map(p=>{
    const col=gc(p.name);
    if(S.confirmRemovePlayer===p.key)return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;border-radius:10px;background:#c0392b08;border:2px solid #c0392b25"><span style="flex:1;font-weight:600;font-size:14px">${p.name}</span><span style="font-size:11px;color:#7f8c8d;margin-right:4px">¿Borrar?</span><button class="confirm-yes" data-rmyes="${p.key}">Sí</button><button class="confirm-no" data-rmno>No</button></div>`;
    return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 14px;border-radius:10px;background:${col}08;border-left:4px solid ${col}"><div style="width:32px;height:32px;border-radius:8px;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;font-family:'Playfair Display',Georgia,serif">${p.name[0]}</div><span style="flex:1;font-weight:600;font-size:15px">${p.name}</span><button class="delete-btn" data-rmask="${p.key}" style="font-size:16px;color:#ccc">✕</button></div>`;
  }).join("");
  return`<div class="card"><h2 class="section-title">Jugadores</h2><p style="font-size:13px;color:#7f8c8d;margin-bottom:16px">${S.players.length} jugador${S.players.length!==1?'es':''}</p>${list}<div class="add-player-row"><input type="text" placeholder="Nombre nuevo jugador" id="npi" maxlength="20"><button data-action="add-player">+</button></div></div>`;
}

function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(b=>{b.onclick=()=>up({view:b.dataset.nav,newGame:null,confirmDelete:null,confirmReset:false,confirmRemovePlayer:null})});

  document.querySelectorAll("[data-mode]").forEach(b=>{if(b.disabled)return;b.onclick=()=>up({newGame:{step:"pick",mode:b.dataset.mode,selected:[],team1:[],team2:[],scores:{}}})});

  document.querySelector("[data-action='cancel-new']")?.addEventListener("click",()=>up({newGame:null}));
  document.querySelector("[data-action='back-pick']")?.addEventListener("click",()=>up({newGame:{...S.newGame,step:"pick"}}));
  document.querySelector("[data-action='back-teams']")?.addEventListener("click",()=>up({newGame:{...S.newGame,step:"teams"}}));

  document.querySelectorAll("[data-pick]").forEach(b=>{if(b.disabled)return;b.onclick=()=>{
    const g=S.newGame,n=b.dataset.pick,sel=g.selected.includes(n)?g.selected.filter(x=>x!==n):[...g.selected,n];
    up({newGame:{...g,selected:sel}});
  }});

  document.querySelector("[data-action='next-step']")?.addEventListener("click",()=>{
    const g=S.newGame;
    if(g.mode==="2v2")up({newGame:{...g,step:"teams",team1:g.selected.slice(0,2),team2:g.selected.slice(2,4)}});
    else{const sc={};g.selected.forEach(p=>{sc[p]=""});up({newGame:{...g,step:"scores",scores:sc}})}
  });

  document.querySelectorAll("[data-swap]").forEach(b=>{b.onclick=()=>{
    const g=S.newGame,p=b.dataset.swap,fr=b.dataset.from,to=fr==="team1"?"team2":"team1";
    const fa=g[fr].filter(x=>x!==p),ta=[...g[to],p];
    if(fa.length>=1&&ta.length<=3)up({newGame:{...g,[fr]:fa,[to]:ta}});
  }});

  document.querySelector("[data-action='next-scores']")?.addEventListener("click",()=>{
    const g=S.newGame;if(g.team1.length!==2||g.team2.length!==2)return;
    const sc={};[...g.team1,...g.team2].forEach(p=>{sc[p]=""});up({newGame:{...g,step:"scores",scores:sc}});
  });

  document.querySelectorAll("[data-player]").forEach(inp=>{inp.oninput=()=>{
    S.newGame.scores[inp.dataset.player]=inp.value;
    const pl=S.newGame.mode==="2v2"?[...S.newGame.team1,...S.newGame.team2]:S.newGame.selected;
    const ok=pl.every(p=>S.newGame.scores[p]!=null&&S.newGame.scores[p]!==""&&!isNaN(Number(S.newGame.scores[p])));
    const sb=document.querySelector("[data-action='save-game']");if(sb)sb.className="save-btn "+(ok?"ok":"disabled");
  }});

  document.querySelector("[data-action='save-game']")?.addEventListener("click",()=>{
    const g=S.newGame,pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;
    if(!pl.every(p=>g.scores[p]!=null&&g.scores[p]!==""&&!isNaN(Number(g.scores[p]))))return;
    const fs={};pl.forEach(p=>{fs[p]=Number(g.scores[p])});
    const sv={mode:g.mode,scores:fs,date:new Date().toISOString()};
    if(g.mode==="2v2"){sv.team1=g.team1;sv.team2=g.team2}
    saveGame(sv);up({newGame:null,view:"history"});
  });

  document.querySelectorAll("[data-delask]").forEach(b=>{b.onclick=()=>up({confirmDelete:b.dataset.delask})});
  document.querySelectorAll("[data-delconfirm]").forEach(b=>{b.onclick=()=>{deleteGame(b.dataset.delconfirm);up({confirmDelete:null})}});
  document.querySelectorAll("[data-delcancel]").forEach(b=>{b.onclick=()=>up({confirmDelete:null})});

  document.querySelector("[data-action='reset-ask']")?.addEventListener("click",()=>up({confirmReset:true}));
  document.querySelector("[data-action='reset-yes']")?.addEventListener("click",()=>{resetAll();up({confirmReset:false,view:"home"})});
  document.querySelector("[data-action='reset-no']")?.addEventListener("click",()=>up({confirmReset:false}));

  document.querySelector("[data-action='add-player']")?.addEventListener("click",()=>{const i=document.getElementById("npi");if(i&&i.value.trim()){addPlayer(i.value.trim());i.value=""}});
  document.getElementById("npi")?.addEventListener("keydown",e=>{if(e.key==="Enter"){const i=e.target;if(i.value.trim()){addPlayer(i.value.trim());i.value=""}}});

  document.querySelectorAll("[data-rmask]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:b.dataset.rmask})});
  document.querySelectorAll("[data-rmyes]").forEach(b=>{b.onclick=()=>{removePlayer(b.dataset.rmyes);up({confirmRemovePlayer:null})}});
  document.querySelectorAll("[data-rmno]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:null})});
}

render();
</script>
</body>
</html>
