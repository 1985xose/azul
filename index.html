function addPlayer(n){const c=n.trim();if(!c||S.players.some(p=>p.name.toLowerCase()===c.toLowerCase()))return;push(playersRef,c)}
function removePlayer(k){remove(ref(db,"players/"+k))}
function saveGame(g){set(ref(db,"games/"+(Date.now().toString(36)+Math.random().toString(36).slice(2,6))),g)}
function deleteGame(k){remove(ref(db,"games/"+k))}
function closePaletilla(price){const pal=getPaletilla();const payments={};pal.allPlayers.forEach(p=>{payments[p]=Math.round(price*(pal.pct[p]||0)/100*100)/100});push(histRef,{date:new Date().toISOString(),price,payments,losses:{...pal.losses},played:{...pal.played},gamesCount:S.games.filter(x=>x.mode==="free").length});remove(gamesRef)}

// ── Active game persistence ──
function persistGame(){
  const g=S.newGame;if(!g||!["playing","bonus"].includes(g.step))return;
  set(activeRef,{step:g.step,mode:g.mode,selected:g.selected||[],team1:g.team1||[],team2:g.team2||[],rounds:g.rounds||[],bonuses:g.bonuses||{},lastTaunt:g.lastTaunt||""});
}
function clearActiveGame(){remove(activeRef)}
function resumeGame(ag){
  const cr={};const pl=ag.mode==="2v2"&&ag.team1?.length?[...ag.team1,...ag.team2]:ag.selected;
  pl.forEach(p=>{cr[p]=""});
  up({newGame:{...ag,currentRound:cr},view:"home"});
}

function gc(name){const i=S.players.findIndex(p=>p.name===name);return PAL[i>=0?i%PAL.length:Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%PAL.length]}

function getStats(){const s={};S.players.forEach(p=>{s[p.name]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});S.games.forEach(g=>{Object.keys(g.scores).forEach(n=>{if(!s[n])s[n]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});if(g.mode==="free"){const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(i===0)s[n].wins++;else s[n].losses++})}else if(g.mode==="2v2"){const t1=g.team1.reduce((x,n)=>x+(g.scores[n]||0),0),t2=g.team2.reduce((x,n)=>x+(g.scores[n]||0),0),w=t1>=t2?g.team1:g.team2;[...g.team1,...g.team2].forEach(n=>{const sc=g.scores[n]||0;s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(w.includes(n))s[n].wins++;else s[n].losses++})}});return s}
function getStreaks(){const current={},best={};[...S.games].filter(g=>g.mode==="free").reverse().forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{if(!current[n])current[n]=0;if(i===0)current[n]=0;else{current[n]++;if(!best[n]||current[n]>best[n])best[n]=current[n]}})});return{current,best}}
function getTitles(){const stats=getStats(),streaks=getStreaks(),titles={};let mxL=0,mxLN="",mxW=0,mxWN="";Object.entries(stats).forEach(([n,s])=>{if(s.losses>mxL){mxL=s.losses;mxLN=n}if(s.wins>mxW){mxW=s.wins;mxWN=n}});Object.entries(stats).forEach(([n,s])=>{if(s.played===0){titles[n]=null;return}const cs=streaks.current[n]||0;if(cs>=5)titles[n]={text:"Patrocinador Oficial del Jamón",color:"#e74c3c",icon:"🐷"};else if(cs>=3)titles[n]={text:"Cajero Automático",color:"#e67e22",icon:"🏧"};else if(n===mxLN&&mxL>2)titles[n]={text:"El Paletillero Mayor",color:"#e74c3c",icon:"👑"};else if(n===mxWN&&mxW>1)titles[n]={text:"Rey del Azul",color:"#58d68d",icon:"🏆"};else if(s.losses===0&&s.played>=3)titles[n]={text:"El Gorrón",color:"#bb8fce",icon:"🎩"};else if(s.played>0&&s.wins/s.played>=.6)titles[n]={text:"Máquina",color:"#5dade2",icon:"⚡"};else if(s.played>0&&s.wins/s.played<=.15&&s.played>=3)titles[n]={text:"Saco de Derrotas",color:"#6b8299",icon:"💀"};else titles[n]=null});return titles}
function getPaletilla(){const all=new Set(),losses={},played={};S.games.forEach(g=>{if(g.mode==="free"){const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{all.add(n);played[n]=(played[n]||0)+1;if(i>0)losses[n]=(losses[n]||0)+1})}});const total=Object.values(losses).reduce((a,b)=>a+b,0);const pct={};all.forEach(p=>{losses[p]=losses[p]||0;played[p]=played[p]||0;pct[p]=total>0?Math.round(losses[p]/total*100):0});return{losses,pct,total,played,allPlayers:[...all]}}
function getGlobalTotals(){const t={};S.history.forEach(h=>{if(h.payments)Object.entries(h.payments).forEach(([n,a])=>{t[n]=(t[n]||0)+a})});return t}
function randomFrase(name){return FRASES[Math.floor(Math.random()*FRASES.length)].replace(/\[N\]/g,name)}
function randomMidFrase(name,gap,rn){return MID_FRASES[Math.floor(Math.random()*MID_FRASES.length)].replace(/\[N\]/g,name).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function updateEuros(){const price=parseFloat(S.palPrice)||0;document.querySelectorAll("[data-euro]").forEach(el=>{const pct=parseFloat(el.dataset.euro)||0;el.textContent=price>0?(price*pct/100).toFixed(2)+" €":""});const btn=document.querySelector("[data-action='close-ask']");if(btn){if(price>0)btn.removeAttribute("disabled");else btn.setAttribute("disabled","")}}
function roundTotals(pl,rounds,bonuses){const t={};pl.forEach(p=>{t[p]=0});rounds.forEach(r=>{pl.forEach(p=>{t[p]+=r[p]||0})});if(bonuses)pl.forEach(p=>{t[p]+=(bonuses[p]||0)});return t}

const app=document.getElementById("app");
function render(){
  if(S.loaded<7){app.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh"><span style="font-family:'Playfair Display',Georgia,serif;font-size:20px;color:#d4a017">Cargando...</span></div>`;return}
  let toast="";if(S.toast)toast=`<div class="toast-overlay" data-action="close-toast"><div class="toast-card"><div style="font-size:48px;margin-bottom:12px">${S.toast.icon||'💀'}</div><div style="font-size:14px;font-weight:700;color:#e74c3c;margin-bottom:8px">${S.toast.title}</div><div style="font-size:15px;line-height:1.5;color:#e0d6c8">${S.toast.msg}</div><button class="toast-close" data-action="close-toast">Seguir jugando</button></div></div>`;
  app.innerHTML=rHeader()+rNav()+(S.newGame?rNewGame():({home:rHome,history:rHistory,stats:rStats,paletilla:rPaletilla,players:rPlayers})[S.view]())+toast;
  bindAll();
}
function rHeader(){const tiles=["#5dade2","#f4d03f","#e74c3c","#0a1929","#48c9b0","#e74c3c","#5dade2","#f4d03f","#48c9b0","#0a1929","#f4d03f","#48c9b0","#5dade2","#e74c3c","#f4d03f"];return`<div class="header"><h1>Azul</h1><div class="tile-row">${tiles.map(c=>`<div class="t" style="background:${c}"></div>`).join("")}</div><div class="sub">La Porra de la Paletilla</div><div class="sync">${S.connected?'<span class="sync-dot"></span> Sincronizado':'<span class="sync-dot off"></span> Sin conexión'}</div></div>`}
function rNav(){const t=[{id:"home",l:"Inicio"},{id:"history",l:"Partidas"},{id:"stats",l:"Stats"},{id:"paletilla",l:"🐷 Paletilla"},{id:"players",l:"Jugadores"}];return`<div class="nav">${t.map(x=>`<button data-nav="${x.id}" class="${S.view===x.id&&!S.newGame?'active':''}">${x.l}</button>`).join("")}</div>`}
function divider(){return`<div class="azul-divider"><div class="diamond"></div></div>`}

function rHome(){
  const g=S.games,g3=g.filter(x=>x.mode==="free").length,g4=g.filter(x=>x.mode==="2v2").length,np=S.players.length;

  // ── Resume prompt for active game ──
  let resumeHtml="";
  if(!S.newGame&&S.activeGame){
    const ag=S.activeGame,pl=ag.mode==="2v2"&&ag.team1?.length?[...ag.team1,...ag.team2]:ag.selected||[];
    const rn=(ag.rounds||[]).length;
    const totals=roundTotals(pl,ag.rounds||[]);
    const scoreList=pl.map(n=>`<span style="color:${gc(n)};font-weight:600">${n}: ${totals[n]||0}</span>`).join(" · ");
    resumeHtml=`<div class="resume-card"><div style="font-size:24px;text-align:center;margin-bottom:8px">⏸️</div><h2 class="section-title" style="text-align:center;margin-bottom:8px">Partida en curso</h2><p style="font-size:13px;color:#8a9bb5;text-align:center;margin-bottom:4px">${ag.mode==="free"?"Libre":"2v2"} · Ronda ${rn+1} · ${ag.step==="bonus"?"En bonus":rn+" rondas"}</p><p style="font-size:12px;text-align:center;margin-bottom:12px">${scoreList}</p><div class="resume-btns"><button class="resume-btn resume-go" data-action="resume-game">▶ Retomar</button><button class="resume-btn resume-cancel" data-action="discard-game">✕ Cancelar</button></div></div>`;
  }

  let q="";if(g.length>0){const st=getStreaks();let sh="";const hs=Object.entries(st.current).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]);if(hs.length)sh=`${divider()}${hs.map(([n,v])=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-weight:600;font-size:13px;color:#e0d6c8">${n}</span><span class="streak-fire">${'🔥'.repeat(Math.min(v,5))} ${v} sin ganar</span></div>`).join("")}`;q=`<div class="card"><h2 class="section-title">Resumen</h2><div style="display:flex;justify-content:space-around;text-align:center"><div><div class="big-num" style="color:#5dade2">${g.length}</div><div style="font-size:11px;color:#6b8299">Partidas</div></div><div><div class="big-num" style="color:#f4d03f">${g3}</div><div style="font-size:11px;color:#6b8299">Libre</div></div><div><div class="big-num" style="color:#58d68d">${g4}</div><div style="font-size:11px;color:#6b8299">Equipos</div></div></div>${sh}</div>`}
  return`${resumeHtml}<div class="card"><h2 class="section-title">Nueva partida</h2><p style="font-size:13px;color:#6b8299;margin-bottom:16px">Elige modo de juego</p><div class="mode-btns"><button class="mode-btn mode-3" data-mode="free" ${np<2?'disabled':''}><span class="num">Libre</span><span class="lbl">Individual</span></button><button class="mode-btn mode-4" data-mode="2v2" ${np<4?'disabled':''}><span class="num">2v2</span><span class="lbl">Equipos</span></button></div></div>${q}`;
}

function rNewGame(){const g=S.newGame,pl=g.mode==="2v2"&&g.team1?.length?[...g.team1,...g.team2]:g.selected;
if(g.step==="pick"){const min=g.mode==="free"?2:4,ex4=g.mode==="2v2";const chips=S.players.map(p=>{const on=g.selected.includes(p.name),col=gc(p.name),can=on||!ex4||g.selected.length<4;return`<button class="chip ${on?'on':''}" data-pick="${p.name}" style="${on?`background:${col};border-color:${col};color:#fff`:''}${!can?';opacity:.3':''}" ${!can?'disabled':''}>${p.name}</button>`}).join("");const ok=ex4?g.selected.length===4:g.selected.length>=min;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">${g.mode==="free"?"Partida libre":"Partida 2v2"}</h2><button class="cancel-btn" data-action="cancel-new">Cancelar</button></div><div class="step-label"><span class="step-num">1</span> Elige jugadores</div><div class="chip-grid">${chips}</div><button class="save-btn ${ok?'ok':'disabled'}" data-action="next-step">${g.mode==="2v2"?"Formar equipos":"Iniciar partida"}</button></div>`}
if(g.step==="teams"){const rt=(t,l,c,k)=>`<div><div class="team-label" style="color:${c}">${l}</div>${t.map(p=>`<button class="team-player" data-swap="${p}" data-from="${k}" style="border:2px solid ${gc(p)};background:${gc(p)}20;color:${gc(p)}">${p}</button>`).join("")}</div>`;const bal=g.team1.length===2&&g.team2.length===2;return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">Equipos</h2><button class="cancel-btn" data-action="back-pick">Atrás</button></div><div class="teams-box"><div style="font-size:12px;color:#6b8299;margin-bottom:10px">Toca para cambiar</div><div class="teams-grid">${rt(g.team1,"Equipo 1","#5dade2","team1")}${rt(g.team2,"Equipo 2","#58d68d","team2")}</div></div><button class="save-btn ${bal?'ok':'disabled'}" data-action="start-game">Iniciar partida</button></div>`}
if(g.step==="playing"){const rounds=g.rounds||[],cur=g.currentRound||{},totals=roundTotals(pl,rounds),rn=rounds.length+1,sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),leader=sorted[0],loser=sorted[sorted.length-1];let table=`<table class="scoreboard"><tr><th></th>${pl.map(p=>`<th style="color:${gc(p)}">${p}</th>`).join("")}</tr>`;rounds.forEach((r,i)=>{table+=`<tr><td class="round-label">R${i+1}</td>${pl.map(p=>`<td>${r[p]||0}</td>`).join("")}</tr>`});table+=`<tr class="total-row"><td class="round-label">Total</td>${pl.map(p=>`<td class="${p===leader[0]&&rounds.length>0?'winner-cell':''} ${p===loser[0]&&rounds.length>0?'loser-cell':''}">${totals[p]}</td>`).join("")}</tr></table>`;let taunt="";if(rounds.length>=1&&g.lastTaunt){taunt=`<div class="taunt-box">${g.lastTaunt}</div>`}const allFilled=pl.every(p=>cur[p]!=null&&cur[p]!==""&&!isNaN(Number(cur[p])));const canFinish=rounds.length>=1||(rounds.length===0&&allFilled);
// Abandon confirm
let abandonHtml=S.confirmAbandon?`<div style="text-align:center;padding:8px 0;margin-bottom:8px;background:#0a1929;border-radius:10px;border:1px solid #e74c3c30"><p style="font-size:12px;color:#e74c3c;font-weight:600;margin-bottom:8px">¿Abandonar? Se pierde el progreso.</p><button class="confirm-yes" data-action="confirm-abandon">Sí</button><button class="confirm-no" data-action="cancel-abandon">No</button></div>`:`<button class="cancel-btn" data-action="ask-abandon">Abandonar</button>`;
const inputRows=pl.map(p=>{const col=gc(p);return`<div class="score-row" style="background:${col}12;border-left:4px solid ${col}"><span class="name">${p}</span><span style="font-size:12px;color:#6b8299;margin-right:4px">${totals[p]}</span><input class="round-input" type="number" inputmode="numeric" min="0" placeholder="0" data-rplayer="${p}" value="${cur[p]!=null?cur[p]:''}" style="border-color:${col}40"></div>`}).join("");return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 class="section-title" style="margin-bottom:0">Ronda ${rn}</h2>${abandonHtml}</div>${table}${taunt}${divider()}<div class="step-label">Puntos ronda ${rn}</div>${inputRows}<div class="btn-row"><button class="btn-next" data-action="next-round" ${!allFilled?'disabled':''}>Siguiente ronda</button><button class="btn-finish" data-action="finish-rounds" ${!canFinish?'disabled':''}>Finalizar</button></div></div>`}
if(g.step==="bonus"){const bonuses=g.bonuses||{},totPre=roundTotals(pl,g.rounds);const allFilled=pl.every(p=>bonuses[p]!=null&&bonuses[p]!==""&&!isNaN(Number(bonuses[p])));const rows=pl.map(p=>{const col=gc(p);return`<div class="score-row" style="background:${col}12;border-left:4px solid ${col}"><span class="name">${p}<br><span style="font-size:11px;color:#6b8299">Base: ${totPre[p]}</span></span><input class="round-input" type="number" inputmode="numeric" min="0" placeholder="0" data-bplayer="${p}" value="${bonuses[p]!=null?bonuses[p]:''}" style="border-color:${col}40"></div>`}).join("");return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 class="section-title" style="margin-bottom:0">🎯 Bonus final</h2><button class="cancel-btn" data-action="back-playing">Atrás</button></div><p style="font-size:12px;color:#6b8299;margin-bottom:12px">Puntos de bonificación (filas, columnas, colores)</p>${rows}<button class="save-btn ${allFilled?'ok':'disabled'}" data-action="show-summary">Ver resumen</button></div>`}
if(g.step==="summary"){const rounds=g.rounds||[],bonuses=g.bonuses||{},totals=roundTotals(pl,rounds,bonuses),sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),winner=sorted[0];let table=`<table class="scoreboard"><tr><th></th>${pl.map(p=>`<th style="color:${gc(p)}">${p}</th>`).join("")}</tr>`;rounds.forEach((r,i)=>{table+=`<tr><td class="round-label">R${i+1}</td>${pl.map(p=>`<td>${r[p]||0}</td>`).join("")}</tr>`});table+=`<tr><td class="round-label" style="color:#d4a017">Bonus</td>${pl.map(p=>`<td style="color:#d4a017">${bonuses[p]||0}</td>`).join("")}</tr>`;table+=`<tr class="total-row"><td class="round-label">Total</td>${pl.map(p=>`<td class="${p===winner[0]?'winner-cell':'loser-cell'}">${totals[p]}</td>`).join("")}</tr></table>`;let teamInfo="";if(g.mode==="2v2"){const t1=g.team1.reduce((s,n)=>s+totals[n],0),t2=g.team2.reduce((s,n)=>s+totals[n],0);teamInfo=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tst" style="color:#5dade2;background:#5dade215">Eq1: ${g.team1.join("+")}=${t1}</span><span class="tst" style="color:#58d68d;background:#58d68d15">Eq2: ${g.team2.join("+")}=${t2}</span></div>`}return`<div class="card"><h2 class="section-title" style="text-align:center">Resumen</h2><div class="summary-winner"><div class="crown">👑</div><div class="winner-name">${winner[0]}</div><div class="winner-score">${winner[1]} pts</div></div>${teamInfo}${table}<button class="save-btn ok" data-action="save-game">💾 Guardar partida</button></div>`}}

function rHistory(){if(!S.games.length)return`<div class="card"><p class="empty">Aún no hay partidas</p></div>`;return S.games.map(g=>{const d=new Date(g.date),ds=d.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}),ts=d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);let tt="";if(g.mode==="2v2"){const t1s=g.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=g.team2.reduce((s,n)=>s+(g.scores[n]||0),0);tt=`<div style="margin-bottom:8px"><span class="tst" style="color:#5dade2;background:#5dade215">Eq1:${g.team1.join("+")}=${t1s}</span><span class="tst" style="color:#58d68d;background:#58d68d15">Eq2:${g.team2.join("+")}=${t2s}</span></div>`}const del=S.confirmDelete===g._key?`<span style="font-size:12px"><span style="color:#6b8299;margin-right:8px">¿Seguro?</span><button class="confirm-yes" data-delconfirm="${g._key}">Sí</button><button class="confirm-no" data-delcancel>No</button></span>`:`<button class="delete-btn" data-delask="${g._key}">Eliminar</button>`;const rows=sorted.map(([n,sc],i)=>{const isW=i===0,col=gc(n);return`<div class="game-player ${isW?'game-winner':'game-loser'}"><div class="dot" style="background:${col}"></div><span class="pname" style="font-weight:${isW?700:500}">${n}</span>${isW?'👑':'💸'}<span class="pscore" style="color:${isW?'#58d68d':'#e74c3c'}">${sc}</span></div>`}).join("");const rndInfo=g.roundCount?`<span style="font-size:11px;color:#6b8299;margin-left:8px">${g.roundCount}r</span>`:'';return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><div><span class="badge ${g.mode==="free"?"badge-3":"badge-4"}">${g.mode==="free"?`Libre (${Object.keys(g.scores).length})`:"2v2"}</span>${rndInfo}</div><div style="font-size:12px;color:#6b8299;text-align:right">${ds}<br>${ts}</div></div>${tt}<div>${rows}</div><div style="margin-top:10px;text-align:right">${del}</div></div>`}).join("")}

function rStats(){const stats=getStats(),titles=getTitles(),streaks=getStreaks();const active=Object.entries(stats).filter(([,s])=>s.played>0).sort((a,b)=>b[1].wins-a[1].wins);if(!active.length)return`<div class="card"><p class="empty">Juega para ver stats</p></div>`;return active.map(([name,s])=>{const wr=s.played>0?Math.round(s.wins/s.played*100):0,avg=s.played>0?Math.round(s.totalScore/s.played):0,col=gc(name);const title=titles[name],cs=streaks.current[name]||0;let th=title?`<div class="title-badge" style="background:${title.color}20;color:${title.color}">${title.icon} ${title.text}</div>`:'';let sh=cs>=2?`<span class="streak-fire">${'🔥'.repeat(Math.min(cs,5))} ${cs}</span>`:'';return`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="stat-avatar" style="background:${col}">${name[0]}</div><div><div style="font-weight:700;font-size:16px;color:#e0d6c8">${name}${sh}</div><div style="font-size:12px;color:#6b8299">${s.played} partida${s.played!==1?'s':''}</div>${th}</div><div style="margin-left:auto;text-align:right"><div style="font-size:24px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:${col}">${wr}%</div><div style="font-size:10px;color:#6b8299">Victorias</div></div></div>${divider()}<div style="display:flex;justify-content:space-around;text-align:center"><div class="mini-stat"><div class="val" style="color:#58d68d">${s.wins}</div><div class="lbl">Victorias</div></div><div class="mini-stat"><div class="val" style="color:#e74c3c">${s.losses}</div><div class="lbl">Derrotas</div></div><div class="mini-stat"><div class="val" style="color:#5dade2">${avg}</div><div class="lbl">Promedio</div></div><div class="mini-stat"><div class="val" style="color:#f4d03f">${s.bestScore}</div><div class="lbl">Mejor</div></div></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${wr}%;background:linear-gradient(90deg,${col},${col}cc)"></div></div></div>`}).join("")}

function rPaletilla(){const pal=getPaletilla(),gF=S.games.filter(x=>x.mode==="free").length;const sorted=[...pal.allPlayers].sort((a,b)=>(pal.pct[b]||0)-(pal.pct[a]||0));let content;if(!gF)content=`<p class="empty">Jugad partidas libres para ver quién paga</p>`;else content=sorted.map((name,i)=>{const p=pal.pct[name]||0,l=pal.losses[name]||0,pl=pal.played[name]||0,col=gc(name);const medal=i===0?"💸":(l===0?"🎉":"");const bc=i===0?`linear-gradient(90deg,#e74c3c,#c0392b)`:`linear-gradient(90deg,${col},${col}aa)`;return`<div class="pal-player ${i===0?'top':'rest'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:7px;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;font-family:'Playfair Display',Georgia,serif">${name[0]}</div><span style="font-weight:700;font-size:15px;color:#e0d6c8">${name}</span>${medal?`<span>${medal}</span>`:''}</div><div style="text-align:right"><span style="font-size:24px;font-weight:700;font-family:'Playfair Display',Georgia,serif;color:${i===0?'#e74c3c':'#e0d6c8'}">${p}%</span><div class="euro-amount" data-euro="${p}" style="color:${i===0?'#e74c3c':'#f4d03f'}"></div></div></div><div style="font-size:12px;color:#6b8299;margin-bottom:6px">${l} derrota${l!==1?'s':''} de ${pl} partida${pl!==1?'s':''}</div><div class="pal-bar"><div class="pal-bar-fill" style="width:${p}%;background:${bc}"></div></div></div>`}).join("");let ps="";if(gF>0){ps=`<div class="card"><h2 class="section-title">💰 Precio</h2><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><input type="number" inputmode="decimal" class="price-input" id="palPriceInput" placeholder="0" value="${S.palPrice}" step="0.01"><span style="font-size:18px;font-weight:700;color:#6b8299">€</span></div>`;if(!S.confirmClose)ps+=`<button class="close-pal-btn" data-action="close-ask" ${(parseFloat(S.palPrice)||0)<=0?'disabled':''}>🐷 Cerrar y comprar paletilla</button>`;else{const price=parseFloat(S.palPrice)||0;ps+=`<div style="text-align:center;padding:10px 0"><p style="font-size:13px;font-weight:600;color:#e74c3c;margin-bottom:10px">¿Cerrar por ${price.toFixed(2)}€?</p><button class="reset-btn reset-danger" data-action="close-yes">Sí</button><button class="reset-btn reset-cancel" data-action="close-no">No</button></div>`}ps+=`</div>`}let hh="";if(S.history.length>0){const totals=getGlobalTotals(),st=Object.entries(totals).sort((a,b)=>b[1]-a[1]);hh=`<div class="card"><h2 class="section-title">📜 Histórico</h2>`;if(st.length)hh+=`<div style="margin-bottom:16px;padding:12px;background:#0a1929;border-radius:10px;border:1px solid #1a3a5c"><div style="font-size:12px;font-weight:700;color:#d4a017;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Total gastado</div>${st.map(([n,a])=>`<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:600;font-size:13px;color:${gc(n)}">${n}</span><span style="font-weight:700;font-size:15px;font-family:'Playfair Display',Georgia,serif;color:#f4d03f">${a.toFixed(2)} €</span></div>`).join("")}</div>`;hh+=S.history.map((h,i)=>{const d=new Date(h.date).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});const pays=h.payments?Object.entries(h.payments).sort((a,b)=>b[1]-a[1]).map(([n,a])=>`<span style="font-size:12px;color:${gc(n)};font-weight:600">${n}:${a.toFixed(2)}€</span>`).join(" · "):'';return`<div class="hist-item"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:700;font-family:'Playfair Display',Georgia,serif;font-size:16px;color:#d4a017">Paletilla #${S.history.length-i}</span><span style="font-size:12px;color:#6b8299">${d}</span></div><div style="font-size:14px;font-weight:700;color:#f4d03f;margin-bottom:4px">${h.price.toFixed(2)}€ · ${h.gamesCount||'?'} partidas</div><div>${pays}</div></div>`}).join("")+`</div>`}return`<div class="card"><div style="text-align:center;margin-bottom:16px"><span style="font-size:42px">🐷</span><h2 class="section-title" style="margin-bottom:4px;margin-top:4px">La Paletilla</h2><p style="font-size:12px;color:#6b8299">${gF} partida${gF!==1?'s':''} · ${pal.total} derrota${pal.total!==1?'s':''}</p></div>${content}</div>${ps}${hh}`}

function rPlayers(){const list=S.players.map(p=>{const col=gc(p.name);if(S.confirmRemovePlayer===p.key)return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;border-radius:10px;background:rgba(231,76,60,.1);border:2px solid rgba(231,76,60,.3)"><span style="flex:1;font-weight:600;font-size:14px;color:#e0d6c8">${p.name}</span><span style="font-size:11px;color:#6b8299;margin-right:4px">¿Borrar?</span><button class="confirm-yes" data-rmyes="${p.key}">Sí</button><button class="confirm-no" data-rmno>No</button></div>`;return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 14px;border-radius:10px;background:${col}12;border-left:4px solid ${col}"><div style="width:32px;height:32px;border-radius:8px;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;font-family:'Playfair Display',Georgia,serif">${p.name[0]}</div><span style="flex:1;font-weight:600;font-size:15px;color:#e0d6c8">${p.name}</span><button class="delete-btn" data-rmask="${p.key}" style="font-size:16px;color:#4a6380">✕</button></div>`}).join("");return`<div class="card"><h2 class="section-title">Jugadores</h2><p style="font-size:13px;color:#6b8299;margin-bottom:16px">${S.players.length} jugador${S.players.length!==1?'es':''}</p>${list}<div class="add-player-row"><input type="text" placeholder="Nuevo jugador" id="npi" maxlength="20"><button data-action="add-player">+</button></div></div>`}

function bindAll(){const g=S.newGame;
document.querySelectorAll("[data-nav]").forEach(b=>{b.onclick=()=>up({view:b.dataset.nav,newGame:null,confirmDelete:null,confirmRemovePlayer:null,confirmClose:false,confirmAbandon:false})});
document.querySelectorAll("[data-mode]").forEach(b=>{if(b.disabled)return;b.onclick=()=>up({newGame:{step:"pick",mode:b.dataset.mode,selected:[],team1:[],team2:[],rounds:[],currentRound:{},bonuses:{}}})});
document.querySelector("[data-action='cancel-new']")?.addEventListener("click",()=>{up({newGame:null})});

// Resume / discard active game
document.querySelector("[data-action='resume-game']")?.addEventListener("click",()=>{if(S.activeGame)resumeGame(S.activeGame)});
document.querySelector("[data-action='discard-game']")?.addEventListener("click",()=>{clearActiveGame()});

// Abandon (with confirmation for persisted games)
document.querySelector("[data-action='ask-abandon']")?.addEventListener("click",()=>up({confirmAbandon:true}));
document.querySelector("[data-action='confirm-abandon']")?.addEventListener("click",()=>{clearActiveGame();up({newGame:null,confirmAbandon:false})});
document.querySelector("[data-action='cancel-abandon']")?.addEventListener("click",()=>up({confirmAbandon:false}));

document.querySelector("[data-action='back-pick']")?.addEventListener("click",()=>{if(g)up({newGame:{...g,step:"pick"}})});
document.querySelectorAll("[data-pick]").forEach(b=>{if(b.disabled||!g)return;b.onclick=()=>{const n=b.dataset.pick,sel=g.selected.includes(n)?g.selected.filter(x=>x!==n):[...g.selected,n];up({newGame:{...g,selected:sel}})}});
document.querySelector("[data-action='next-step']")?.addEventListener("click",()=>{if(!g)return;if(g.mode==="2v2")up({newGame:{...g,step:"teams",team1:g.selected.slice(0,2),team2:g.selected.slice(2,4)}});else{const cr={};g.selected.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr,rounds:[]};up({newGame:ng});S.newGame=ng;persistGame()}});
document.querySelectorAll("[data-swap]").forEach(b=>{if(!g)return;b.onclick=()=>{const p=b.dataset.swap,fr=b.dataset.from,to=fr==="team1"?"team2":"team1",fa=g[fr].filter(x=>x!==p),ta=[...g[to],p];if(fa.length>=1&&ta.length<=3)up({newGame:{...g,[fr]:fa,[to]:ta}})}});
document.querySelector("[data-action='start-game']")?.addEventListener("click",()=>{if(!g||g.team1.length!==2||g.team2.length!==2)return;const cr={};[...g.team1,...g.team2].forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr,rounds:[]};up({newGame:ng});S.newGame=ng;persistGame()});

// Round inputs
document.querySelectorAll("[data-rplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.currentRound[inp.dataset.rplayer]=inp.value;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.currentRound[p]!=null&&g.currentRound[p]!==""&&!isNaN(Number(g.currentRound[p])));const nb=document.querySelector("[data-action='next-round']");if(nb)nb.disabled=!ok;const fb=document.querySelector("[data-action='finish-rounds']");if(fb)fb.disabled=!((g.rounds||[]).length>=1||((g.rounds||[]).length===0&&ok))}});

// Next round → persist
document.querySelector("[data-action='next-round']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(g.currentRound[p])||0)});const newR=[...(g.rounds||[]),rs];const cr={};pl.forEach(p=>{cr[p]=""});const tt=roundTotals(pl,newR),ss=Object.entries(tt).sort((a,b)=>b[1]-a[1]),lt=randomMidFrase(ss[ss.length-1][0],ss[0][1]-ss[ss.length-1][1],newR.length);const ng={...g,rounds:newR,currentRound:cr,lastTaunt:lt};up({newGame:ng});S.newGame=ng;persistGame()});

// Finish → bonus → persist
document.querySelector("[data-action='finish-rounds']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;let rounds=[...(g.rounds||[])];const cur=g.currentRound;const filled=pl.every(p=>cur[p]!=null&&cur[p]!==""&&!isNaN(Number(cur[p])));if(filled){const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(cur[p])||0)});rounds.push(rs)}const bonuses=g.bonuses&&pl.some(p=>g.bonuses[p]!=null&&g.bonuses[p]!=="")?{...g.bonuses}:{};if(!Object.keys(bonuses).length)pl.forEach(p=>{bonuses[p]=""});const ng={...g,rounds,step:"bonus",bonuses};up({newGame:ng});S.newGame=ng;persistGame()});

// Back to playing → persist
document.querySelector("[data-action='back-playing']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const cr={};pl.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr};up({newGame:ng});S.newGame=ng;persistGame()});

// Bonus inputs
document.querySelectorAll("[data-bplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.bonuses[inp.dataset.bplayer]=inp.value;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.bonuses[p]!=null&&g.bonuses[p]!==""&&!isNaN(Number(g.bonuses[p])));const sb=document.querySelector("[data-action='show-summary']");if(sb)sb.className="save-btn "+(ok?"ok":"disabled")}});

// Summary
document.querySelector("[data-action='show-summary']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const bonuses={};pl.forEach(p=>{bonuses[p]=Math.max(0,parseInt(g.bonuses[p])||0)});up({newGame:{...g,step:"summary",bonuses}})});

// Save final game → clear active
document.querySelector("[data-action='save-game']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="2v2"?[...g.team1,...g.team2]:g.selected;const totals=roundTotals(pl,g.rounds,g.bonuses);const sv={mode:g.mode,scores:totals,date:new Date().toISOString(),roundCount:(g.rounds||[]).length};if(g.mode==="2v2"){sv.team1=g.team1;sv.team2=g.team2}const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),loser=sorted[sorted.length-1][0];saveGame(sv);clearActiveGame();up({newGame:null,view:"history",toast:{icon:"💀",title:"¡Derrota!",msg:randomFrase(loser)}})});

// Delete game
document.querySelectorAll("[data-delask]").forEach(b=>{b.onclick=()=>up({confirmDelete:b.dataset.delask})});
document.querySelectorAll("[data-delconfirm]").forEach(b=>{b.onclick=()=>{deleteGame(b.dataset.delconfirm);up({confirmDelete:null})}});
document.querySelectorAll("[data-delcancel]").forEach(b=>{b.onclick=()=>up({confirmDelete:null})});
// Toast
document.querySelectorAll("[data-action='close-toast']").forEach(b=>{b.onclick=e=>{if(e.target===b||e.target.dataset.action==="close-toast")up({toast:null})}});
// Price
document.getElementById("palPriceInput")?.addEventListener("input",e=>{S.palPrice=e.target.value;updateEuros()});
// Paletilla close
document.querySelector("[data-action='close-ask']")?.addEventListener("click",()=>up({confirmClose:true}));
document.querySelector("[data-action='close-yes']")?.addEventListener("click",()=>{const p=parseFloat(S.palPrice)||0;if(p>0){closePaletilla(p);up({confirmClose:false,palPrice:""})}});
document.querySelector("[data-action='close-no']")?.addEventListener("click",()=>up({confirmClose:false}));
// Players
document.querySelector("[data-action='add-player']")?.addEventListener("click",()=>{const i=document.getElementById("npi");if(i&&i.value.trim()){addPlayer(i.value.trim());i.value=""}});
document.getElementById("npi")?.addEventListener("keydown",e=>{if(e.key==="Enter"){const i=e.target;if(i.value.trim()){addPlayer(i.value.trim());i.value=""}}});
document.querySelectorAll("[data-rmask]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:b.dataset.rmask})});
document.querySelectorAll("[data-rmyes]").forEach(b=>{b.onclick=()=>{removePlayer(b.dataset.rmyes);up({confirmRemovePlayer:null})}});
document.querySelectorAll("[data-rmno]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:null})});
if(S.palPrice)updateEuros();}
render();
</script>
</body>
</html>
