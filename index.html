let S={games:[],players:[],history:[],view:"home",newGame:null,activeGame:null,activeNight:null,nightHistory:[],confirmDelete:null,connected:false,loaded:0,confirmRemovePlayer:null,toast:null,palPrice:"",confirmClose:false,confirmAbandon:false,confirmCloseNight:false,user:null,authReady:false};

onAuthStateChanged(auth,u=>{S.user=u;S.authReady=true;

    onValue(playersRef,s=>{const v=s.val();if(!v){set(playersRef,{p0:"Xose",p1:"Noelia",p2:"Pako",p3:"Miguel"});return}up({players:Object.entries(v).map(([k,n])=>({key:k,name:n})).sort((a,b)=>a.name.localeCompare(b.name)),loaded:S.loaded|2})});
    onValue(histRef,s=>{const v=s.val();up({history:v?Object.entries(v).map(([k,x])=>({...x,_key:k})).sort((a,b)=>b.date.localeCompare(a.date)):[],loaded:S.loaded|4})});

  }
  if(!u){listenersReady=false;S.loaded=0}

function removePlayer(k){remove(ref(db,"players/"+k))}

function closePaletilla(price){const pal=getPaletilla();const payments={};pal.allPlayers.forEach(p=>{payments[p]=Math.round(price*(pal.pct[p]||0)/100*100)/100});push(histRef,{date:new Date().toISOString(),price,payments,losses:{...pal.losses},played:{...pal.played},gamesCount:S.games.filter(x=>x.mode==="free").length});S.games.filter(g=>g.mode==="free").forEach(g=>{if(g._key)remove(ref(db,"games/"+g._key))})}
function persistGame(){const g=S.newGame;if(!g||!["playing","bonus"].includes(g.step))return;set(activeRef,{step:g.step,mode:g.mode,selected:g.selected||[],team1:g.team1||[],team2:g.team2||[],rounds:g.rounds||[],bonuses:g.bonuses||{},lastTaunt:g.lastTaunt||""})}

function resumeGame(ag){const cr={};const pl=ag.mode==="2v2"&&ag.team1?.length?[...ag.team1,...ag.team2]:ag.selected;pl.forEach(p=>{cr[p]=""});up({newGame:{...ag,currentRound:cr},view:"home"})}
function gc(name){const i=S.players.findIndex(p=>p.name===name);return PAL[i>=0?i%PAL.length:Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%PAL.length]}

// Night functions
function saveNightGame(gameData){
  const an=S.activeNight;if(!an)return;
  const games=[...(an.games||[]),gameData];
  set(nightRef,{...an,games});
}
function closeNight(){
  const an=S.activeNight;if(!an)return;
  const games=an.games||[];
  let t1w=0,t2w=0;
  games.forEach(g=>{const t1s=an.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(g.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++;});
  const winner=t1w>t2w?"team1":t2w>t1w?"team2":null;
  // Check accumulated debt from tied nights
  const unpaidTied=S.nightHistory.filter(n=>!n.winner&&!n.paid).length;
  push(nightHistRef,{date:new Date().toISOString(),team1:an.team1,team2:an.team2,team1Wins:t1w,team2Wins:t2w,winner,games,paid:false,accumulated:unpaidTied});
  remove(nightRef);
}

// Stats (free mode only)
function getStats(){const s={};S.players.forEach(p=>{s[p.name]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});S.games.filter(g=>g.mode==="free").forEach(g=>{Object.keys(g.scores).forEach(n=>{if(!s[n])s[n]={played:0,wins:0,losses:0,totalScore:0,bestScore:0}});const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{s[n].played++;s[n].totalScore+=sc;if(sc>s[n].bestScore)s[n].bestScore=sc;if(i===0)s[n].wins++;else s[n].losses++})});return s}
function getStreaks(){const current={},best={};[...S.games].filter(g=>g.mode==="free").reverse().forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{if(!current[n])current[n]=0;if(i===0)current[n]=0;else{current[n]++;if(!best[n]||current[n]>best[n])best[n]=current[n]}})});return{current,best}}
function getTitles(){const stats=getStats(),streaks=getStreaks(),titles={};let mxL=0,mxLN="",mxW=0,mxWN="";Object.entries(stats).forEach(([n,s])=>{if(s.losses>mxL){mxL=s.losses;mxLN=n}if(s.wins>mxW){mxW=s.wins;mxWN=n}});Object.entries(stats).forEach(([n,s])=>{if(s.played===0){titles[n]=null;return}const cs=streaks.current[n]||0;if(cs>=5)titles[n]={text:"Patrocinador del Jamón",color:"#e74c3c",icon:"🐷"};else if(cs>=3)titles[n]={text:"Cajero Automático",color:"#e67e22",icon:"🏧"};else if(n===mxLN&&mxL>2)titles[n]={text:"El Paletillero Mayor",color:"#e74c3c",icon:"👑"};else if(n===mxWN&&mxW>1)titles[n]={text:"Rey del Azul",color:"#58d68d",icon:"🏆"};else titles[n]=null});return titles}
function getPaletilla(){const all=new Set(),losses={},played={};S.games.filter(g=>g.mode==="free").forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n],i)=>{all.add(n);played[n]=(played[n]||0)+1;if(i>0)losses[n]=(losses[n]||0)+1})});const total=Object.values(losses).reduce((a,b)=>a+b,0);const pct={};all.forEach(p=>{losses[p]=losses[p]||0;played[p]=played[p]||0;pct[p]=total>0?Math.round(losses[p]/total*100):0});return{losses,pct,total,played,allPlayers:[...all]}}
function getGlobalTotals(){const t={};S.history.forEach(h=>{if(h.payments)Object.entries(h.payments).forEach(([n,a])=>{t[n]=(t[n]||0)+a})});return t}

// Mini stats
function getMiniGames(){return S.games.filter(g=>g.mode==="mini").sort((a,b)=>a.date.localeCompare(b.date))}
function getMiniStats(){const mg=getMiniGames(),s={Xose:{w:0,l:0,total:0,best:0},Noelia:{w:0,l:0,total:0,best:0}};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);sorted.forEach(([n,sc],i)=>{if(!s[n])return;if(i===0)s[n].w++;else s[n].l++;s[n].total+=sc;if(sc>s[n].best)s[n].best=sc})});return s}
function getCrown(){const mg=getMiniGames();if(!mg.length)return null;const last=mg[mg.length-1],sorted=Object.entries(last.scores).sort((a,b)=>b[1]-a[1]),king=sorted[0][0];let reign=0;for(let i=mg.length-1;i>=0;i--){const s=Object.entries(mg[i].scores).sort((a,b)=>b[1]-a[1]);if(s[0][0]===king)reign++;else break}return{name:king,reign}}
function getRecords(){const mg=getMiniGames();if(!mg.length)return null;let bs={n:"",s:0},bb={n:"",d:0,sc:""},cg={d:999,sc:""},str={Xose:0,Noelia:0},bstr={Xose:0,Noelia:0};mg.forEach(g=>{const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]),w=sorted[0],l=sorted[1],d=w[1]-l[1];sorted.forEach(([n,sc])=>{if(sc>bs.s)bs={n,s:sc}});if(d>bb.d)bb={n:w[0],d,sc:`${w[1]}-${l[1]}`};if(d<cg.d)cg={d,sc:`${w[1]}-${l[1]}`};["Xose","Noelia"].forEach(n=>{if(n===w[0]){str[n]++;if(str[n]>bstr[n])bstr[n]=str[n]}else str[n]=0})});return{bs,bb,cg,bstr}}
function getCartaBlanca(){const mg=getMiniGames(),months={};mg.forEach(g=>{const d=new Date(g.date),key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months[key])months[key]={Xose:0,Noelia:0};const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);months[key][sorted[0][0]]++});const now=new Date(),curKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");const hist=Object.entries(months).filter(([k])=>k!==curKey).map(([k,v])=>{const [y,m]=k.split("-");return{month:k,label:new Date(+y,+m-1).toLocaleDateString("es-ES",{month:"long",year:"numeric"}),xose:v.Xose,noelia:v.Noelia,winner:v.Xose>v.Noelia?"Xose":v.Noelia>v.Xose?"Noelia":null}});const current=months[curKey]||{Xose:0,Noelia:0};return{current,history:hist.reverse(),totalCB:{Xose:hist.filter(h=>h.winner==="Xose").length,Noelia:hist.filter(h=>h.winner==="Noelia").length}}}

function getNightPayStats(){const t={};S.nightHistory.forEach(n=>{if(n.winner&&!n.paid){const losers=n.winner==="team1"?n.team2:n.team1;losers.forEach(p=>{t[p]=(t[p]||0)+1})}});return t}

function randomFrase(name){return FRASES[Math.floor(Math.random()*FRASES.length)].replace(/\[N\]/g,name)}
function randomMidFrase(name,gap,rn){return MID_FRASES[Math.floor(Math.random()*MID_FRASES.length)].replace(/\[N\]/g,name).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function randomMiniFrase(w,l){return MINI_FRASES[Math.floor(Math.random()*MINI_FRASES.length)].replace(/\[W\]/g,w).replace(/\[L\]/g,l)}
function randomMiniMid(w,l,gap,rn){return MINI_MID[Math.floor(Math.random()*MINI_MID.length)].replace(/\[W\]/g,w).replace(/\[L\]/g,l).replace(/\[X\]/g,String(gap)).replace(/\[R\]/g,String(rn))}
function randomNightFrase(wTeam,lTeam){const wn=wTeam.join(" y "),ln=lTeam.join(" y ");return NIGHT_FRASES[Math.floor(Math.random()*NIGHT_FRASES.length)].replace(/\[W\]/g,wn).replace(/\[L\]/g,ln)}
function randomNightMid(wTeam,lTeam,t1w,t2w,rn){const wn=wTeam.join("+"),ln=lTeam.join("+");return NIGHT_MID[Math.floor(Math.random()*NIGHT_MID.length)].replace(/\[W\]/g,wn).replace(/\[L\]/g,ln).replace(/\[X\]/g,String(t1w)).replace(/\[Y\]/g,String(t2w)).replace(/\[R\]/g,String(rn))}
function updateEuros(){const price=parseFloat(S.palPrice)||0;document.querySelectorAll("[data-euro]").forEach(el=>{const pct=parseFloat(el.dataset.euro)||0;el.textContent=price>0?(price*pct/100).toFixed(2)+" €":""});const btn=document.querySelector("[data-action='close-ask']");if(btn){if(price>0)btn.removeAttribute("disabled");else btn.setAttribute("disabled","")}}
function roundTotals(pl,rounds,bonuses){const t={};pl.forEach(p=>{t[p]=0});rounds.forEach(r=>{pl.forEach(p=>{t[p]+=r[p]||0})});if(bonuses)pl.forEach(p=>{t[p]+=(bonuses[p]||0)});return t}

// ══ NOCHES ══
function rNoches(){
  const an=S.activeNight;

  // Active night dashboard
  if(an&&!S.newGame){
    const games=an.games||[];
    let t1w=0,t2w=0;
    games.forEach(g=>{const t1s=an.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(g.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});
    const leading=t1w>t2w?an.team1:t2w>t1w?an.team2:null;
    let closeHtml="";
    if(games.length>0){if(!S.confirmCloseNight)closeHtml=`<button class="save-btn ok" data-action="ask-close-night" style="margin-top:12px">🍺 Cerrar noche · Ir al San Rafael</button>`;else closeHtml=`<div style="text-align:center;padding:10px 0"><p style="font-size:13px;font-weight:600;color:#e74c3c;margin-bottom:10px">¿Cerrar la noche?</p><button class="reset-btn reset-danger" data-action="close-night-yes">Sí</button><button class="reset-btn reset-cancel" data-action="close-night-no">No</button></div>`}
    return`<div class="night-dash"><div style="text-align:center"><span style="font-size:32px">🍺🥪</span><h2 class="section-title" style="margin-top:4px">Noche San Rafael</h2></div><div style="text-align:center;font-size:12px;color:#8a9bb5;margin-bottom:8px">${an.team1.join(" + ")} vs ${an.team2.join(" + ")}</div><div class="night-score"><div class="team"><div class="tscore" style="color:#5dade2">${t1w}</div><div class="tname">${an.team1.join(" + ")}</div></div><div style="align-self:center;font-size:20px;color:#4a6380">vs</div><div class="team"><div class="tscore" style="color:#58d68d">${t2w}</div><div class="tname">${an.team2.join(" + ")}</div></div></div>${leading?`<p style="text-align:center;font-size:12px;color:${leading===an.team1?'#5dade2':'#58d68d'};font-weight:600;margin-bottom:8px">${leading.join(" + ")} van ganando</p>`:(games.length>0?'<p style="text-align:center;font-size:12px;color:#e67e22;font-weight:600;margin-bottom:8px">¡Empate! Nadie paga si acaba así</p>':'')}<button class="mbtn mbtn-night" data-action="new-night-game" style="margin-top:8px"><span class="lbl" style="font-size:16px">▶ Nueva partida</span></button>${closeHtml}</div>`;
  }

  // Night history
  const nh=S.nightHistory;
  const payStats=getNightPayStats();
  let psHtml="";
  if(Object.keys(payStats).length){psHtml=`<div class="card"><h2 class="section-title">📊 Bocatas pagados</h2>${Object.entries(payStats).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:${gc(n)};font-weight:600;font-size:13px">${n}</span><span style="font-weight:700;font-family:'Playfair Display',Georgia,serif;color:#f4d03f">${c} noche${c!==1?'s':''}</span></div>`).join("")}</div>`}

  let nhHtml="";
  if(nh.length){nhHtml=`<div class="card"><h2 class="section-title">📜 Historial noches</h2>${nh.map(n=>{const d=new Date(n.date).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});const loserTeam=n.winner==="team1"?n.team2:n.winner==="team2"?n.team1:null;const statusHtml=n.winner?(n.paid?`<span class="paid-btn" style="background:#1e844920;color:#58d68d">Pagado ✓</span>`:`<button class="paid-btn" style="background:#e74c3c20;color:#e74c3c" data-markpaid="${n._key}">Marcar pagado</button>`):`<span style="font-size:11px;color:#e67e22;font-weight:600">Empate</span>`;return`<div class="hist-item" style="border-left-color:${n.winner?'#e74c3c':'#e67e22'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-weight:700;font-family:'Playfair Display',Georgia,serif;color:#d4a017">${d}</span>${statusHtml}</div><div style="font-size:13px;margin-bottom:3px"><span style="color:#5dade2;font-weight:600">${n.team1.join("+")} ${n.team1Wins}</span> - <span style="color:#58d68d;font-weight:600">${n.team2Wins} ${n.team2.join("+")}</span></div>${loserTeam?`<div style="font-size:12px;color:#e74c3c">Paga: ${loserTeam.join(" y ")} 🥪🍺</div>`:''}</div>`}).join("")}</div>`}

  if(!an&&!nh.length)return`<div class="card"><p class="empty">Jugad una Noche San Rafael para ver el historial</p></div>`;
  return`${psHtml}${nhHtml}`;
}

let domHtml="";if(totalGames>0){const xp=Math.round(ms.Xose.w/totalGames*100),np=100-xp;domHtml=`<div class="card"><h2 class="section-title">⚔️ Dominio</h2><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:700;color:${xc}">Xose ${ms.Xose.w}</span><span style="font-weight:700;color:${nc}">Noelia ${ms.Noelia.w}</span></div><div class="dom-bar"><div style="width:${Math.max(xp,8)}%;background:${xc}">${xp>15?xp+'%':''}</div><div style="width:${Math.max(np,8)}%;background:${nc}">${np>15?np+'%':''}</div></div></div>`}
let cbHtml=`<div class="cb-card"><h2 class="section-title" style="color:#bb8fce">🃏 Carta Blanca</h2>`;if(cb.current.Xose+cb.current.Noelia===0)cbHtml+=`<p style="font-size:13px;color:#6b8299">Jugad Mini este mes</p>`;else{const leading=cb.current.Xose>cb.current.Noelia?"Xose":cb.current.Noelia>cb.current.Xose?"Noelia":"Empate";cbHtml+=`<div style="display:flex;justify-content:center;gap:20px;margin:8px 0"><div><span style="font-size:24px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:${xc}">${cb.current.Xose}</span><div style="font-size:11px;color:#6b8299">Xose</div></div><div style="font-size:20px;color:#4a6380;align-self:center">vs</div><div><span style="font-size:24px;font-weight:900;font-family:'Playfair Display',Georgia,serif;color:${nc}">${cb.current.Noelia}</span><div style="font-size:11px;color:#6b8299">Noelia</div></div></div>${leading!=="Empate"?`<p style="font-size:12px;color:${gc(leading)};font-weight:600">${leading} va ganando</p>`:'<p style="font-size:12px;color:#e67e22">Empate</p>'}`}
if(cb.totalCB.Xose+cb.totalCB.Noelia>0)cbHtml+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #1a3a5c;font-size:12px;color:#6b8299">CB ganadas: <span style="color:${xc};font-weight:700">Xose ${cb.totalCB.Xose}</span> · <span style="color:${nc};font-weight:700">Noelia ${cb.totalCB.Noelia}</span></div>`;
cbHtml+=`</div>`;
let recHtml="";if(records)recHtml=`<div class="card"><h2 class="section-title">🏅 Récords</h2><div class="record-item"><span class="record-label">Mejor puntuación</span><span class="record-val" style="color:${gc(records.bs.n)}">${records.bs.n} ${records.bs.s}</span></div><div class="record-item"><span class="record-label">Mayor paliza</span><span class="record-val" style="color:${gc(records.bb.n)}">${records.bb.sc} (+${records.bb.d})</span></div><div class="record-item"><span class="record-label">Más reñida</span><span class="record-val">${records.cg.sc} (dif.${records.cg.d})</span></div><div class="record-item"><span class="record-label">Racha Xose</span><span class="record-val" style="color:${xc}">${records.bstr.Xose}</span></div><div class="record-item"><span class="record-label">Racha Noelia</span><span class="record-val" style="color:${nc}">${records.bstr.Noelia}</span></div></div>`;
const recent=[...mg].reverse().slice(0,10);let histHtml="";if(recent.length)histHtml=`<div class="card"><h2 class="section-title">Últimas Mini</h2>${recent.map(g=>{const d=new Date(g.date).toLocaleDateString("es-ES",{day:"numeric",month:"short"}),sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]),w=sorted[0],l=sorted[1];const del=S.confirmDelete===g._key?`<button class="confirm-yes" data-delconfirm="${g._key}">Sí</button><button class="confirm-no" data-delcancel>No</button>`:`<button class="delete-btn" data-delask="${g._key}">✕</button>`;return`<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #1a3a5c20"><span style="font-size:11px;color:#6b8299;width:45px">${d}</span><span style="font-weight:700;color:${gc(w[0])}">${w[0]} ${w[1]}</span><span style="color:#4a6380;font-size:10px">vs</span><span style="color:${gc(l[0])}">${l[0]} ${l[1]}</span><span style="margin-left:auto">${del}</span></div>`}).join("")}</div>`;
return`${crownHtml}${domHtml}${cbHtml}${recHtml}${histHtml}`}

// ══ LIBRE ══
function rLibre(){const cg=S.games.filter(g=>g.mode==="casual").sort((a,b)=>b.date.localeCompare(a.date));if(!cg.length)return`<div class="card"><p class="empty">No hay partidas libres guardadas</p></div>`;return`<div class="card"><h2 class="section-title">🎲 Partidas libres</h2>${cg.slice(0,20).map(g=>{const d=new Date(g.date).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});const sorted=Object.entries(g.scores).sort((a,b)=>b[1]-a[1]);const del=S.confirmDelete===g._key?`<button class="confirm-yes" data-delconfirm="${g._key}">Sí</button><button class="confirm-no" data-delcancel>No</button>`:`<button class="delete-btn" data-delask="${g._key}">✕</button>`;return`<div style="display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #1a3a5c20"><span style="font-size:11px;color:#6b8299;width:55px">${d}</span><div style="flex:1">${sorted.map(([n,sc],i)=>`<span style="font-size:12px;${i===0?`color:${gc(n)};font-weight:700`:`color:#6b8299`}">${n} ${sc}</span>`).join(' · ')}</div><span>${del}</span></div>`}).join("")}</div>`}

// ══ PLAYERS ══
function rPlayers(){const list=S.players.map(p=>{const col=gc(p.name);if(S.confirmRemovePlayer===p.key)return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;border-radius:10px;background:rgba(231,76,60,.1);border:2px solid rgba(231,76,60,.3)"><span style="flex:1;font-weight:600;font-size:14px;color:#e0d6c8">${p.name}</span><span style="font-size:11px;color:#6b8299">¿Borrar?</span><button class="confirm-yes" data-rmyes="${p.key}">Sí</button><button class="confirm-no" data-rmno>No</button></div>`;return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 14px;border-radius:10px;background:${col}12;border-left:4px solid ${col}"><div style="width:32px;height:32px;border-radius:8px;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;font-family:'Playfair Display',Georgia,serif">${p.name[0]}</div><span style="flex:1;font-weight:600;font-size:15px;color:#e0d6c8">${p.name}</span><button class="delete-btn" data-rmask="${p.key}" style="font-size:16px;color:#4a6380">✕</button></div>`}).join("");return`<div class="card"><h2 class="section-title">Jugadores</h2><p style="font-size:13px;color:#6b8299;margin-bottom:16px">${S.players.length} jugador${S.players.length!==1?'es':''}</p>${list}<div class="add-player-row"><input type="text" placeholder="Nuevo jugador" id="npi" maxlength="20"><button data-action="add-player">+</button></div></div>`}

// ══ BIND ALL EVENTS ══
function bindAll(){const g=S.newGame;
document.querySelector("[data-action='sign-out']")?.addEventListener("click",()=>{signOut(auth)});
document.querySelectorAll("[data-nav]").forEach(b=>{b.onclick=()=>up({view:b.dataset.nav,newGame:null,confirmDelete:null,confirmRemovePlayer:null,confirmClose:false,confirmAbandon:false,confirmCloseNight:false})});

// Mode buttons
document.querySelectorAll("[data-mode]").forEach(b=>{if(b.disabled)return;b.onclick=()=>{
  const m=b.dataset.mode;
  if(m==="mini"){const cr={Xose:"",Noelia:""};const ng={step:"playing",mode:"mini",selected:["Xose","Noelia"],team1:[],team2:[],rounds:[],currentRound:cr,bonuses:{},lastTaunt:""};up({newGame:ng});S.newGame=ng;persistGame()}
  else if(m==="night"){if(S.activeNight){up({view:"noches"})}else{up({newGame:{step:"pick",mode:"night",selected:[],team1:[],team2:[],rounds:[],currentRound:{},bonuses:{}}})}}
  else{up({newGame:{step:"pick",mode:m,selected:[],team1:[],team2:[],rounds:[],currentRound:{},bonuses:{}}})}
}});

// Resume / discard
document.querySelector("[data-action='resume-game']")?.addEventListener("click",()=>{if(S.activeGame)resumeGame(S.activeGame)});
document.querySelector("[data-action='discard-game']")?.addEventListener("click",()=>{clearActiveGame()});
document.querySelector("[data-action='go-noches']")?.addEventListener("click",()=>up({view:"noches"}));

// New night game
document.querySelector("[data-action='new-night-game']")?.addEventListener("click",()=>{
  const an=S.activeNight;if(!an)return;
  const pl=[...an.team1,...an.team2],cr={};pl.forEach(p=>{cr[p]=""});
  const ng={step:"playing",mode:"night",selected:pl,team1:an.team1,team2:an.team2,rounds:[],currentRound:cr,bonuses:{},lastTaunt:""};
  up({newGame:ng});S.newGame=ng;persistGame();
});

// Close night
document.querySelector("[data-action='ask-close-night']")?.addEventListener("click",()=>up({confirmCloseNight:true}));
document.querySelector("[data-action='close-night-yes']")?.addEventListener("click",()=>{
  const an=S.activeNight;if(!an)return;
  const games=an.games||[];let t1w=0,t2w=0;
  games.forEach(g=>{const t1s=an.team1.reduce((s,n)=>s+(g.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(g.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});
  const winner=t1w>t2w?"team1":t2w>t1w?"team2":null;
  const wTeam=winner==="team1"?an.team1:winner==="team2"?an.team2:null;
  const lTeam=winner==="team1"?an.team2:winner==="team2"?an.team1:null;
  push(nightHistRef,{date:new Date().toISOString(),team1:an.team1,team2:an.team2,team1Wins:t1w,team2Wins:t2w,winner,games,paid:false});
  remove(nightRef);
  const msg=winner?randomNightFrase(wTeam,lTeam):"¡Empate! Nadie paga esta noche. La deuda se acumula... 😈";
  up({confirmCloseNight:false,toast:{icon:winner?"🥪🍺":"🤝",title:winner?"¡A pagar!":"Empate",msg,color:winner?"#e74c3c":"#e67e22"}});
});
document.querySelector("[data-action='close-night-no']")?.addEventListener("click",()=>up({confirmCloseNight:false}));

// Mark night as paid
document.querySelectorAll("[data-markpaid]").forEach(b=>{b.onclick=()=>{update(ref(db,"night_history/"+b.dataset.markpaid),{paid:true})}});

// Abandon
document.querySelector("[data-action='cancel-new']")?.addEventListener("click",()=>{up({newGame:null})});
document.querySelector("[data-action='ask-abandon']")?.addEventListener("click",()=>up({confirmAbandon:true}));
document.querySelector("[data-action='confirm-abandon']")?.addEventListener("click",()=>{clearActiveGame();up({newGame:null,confirmAbandon:false})});
document.querySelector("[data-action='cancel-abandon']")?.addEventListener("click",()=>up({confirmAbandon:false}));

document.querySelector("[data-action='back-pick']")?.addEventListener("click",()=>{if(g)up({newGame:{...g,step:"pick"}})});
document.querySelectorAll("[data-pick]").forEach(b=>{if(b.disabled||!g)return;b.onclick=()=>{const n=b.dataset.pick,sel=g.selected.includes(n)?g.selected.filter(x=>x!==n):[...g.selected,n];up({newGame:{...g,selected:sel}})}});
document.querySelector("[data-action='next-step']")?.addEventListener("click",()=>{if(!g)return;
  if(g.mode==="night"){up({newGame:{...g,step:"teams",team1:g.selected.slice(0,2),team2:g.selected.slice(2,4)}})}
  else{const cr={};g.selected.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr,rounds:[]};up({newGame:ng});S.newGame=ng;persistGame()}
});
document.querySelectorAll("[data-swap]").forEach(b=>{if(!g)return;b.onclick=()=>{const p=b.dataset.swap,fr=b.dataset.from,to=fr==="team1"?"team2":"team1",fa=g[fr].filter(x=>x!==p),ta=[...g[to],p];if(fa.length>=1&&ta.length<=3)up({newGame:{...g,[fr]:fa,[to]:ta}})}});
document.querySelector("[data-action='start-game']")?.addEventListener("click",()=>{if(!g||g.team1.length!==2||g.team2.length!==2)return;
  const pl=[...g.team1,...g.team2],cr={};pl.forEach(p=>{cr[p]=""});
  if(g.mode==="night"){
    // Create active night, then start first game
    set(nightRef,{team1:g.team1,team2:g.team2,games:[],startedAt:new Date().toISOString()});
    const ng={step:"playing",mode:"night",selected:pl,team1:g.team1,team2:g.team2,rounds:[],currentRound:cr,bonuses:{},lastTaunt:""};
    up({newGame:ng});S.newGame=ng;persistGame();
  }else{
    const ng={...g,step:"playing",selected:pl,currentRound:cr,rounds:[]};up({newGame:ng});S.newGame=ng;persistGame();
  }
});

// Round inputs
document.querySelectorAll("[data-rplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.currentRound[inp.dataset.rplayer]=inp.value;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.currentRound[p]!=null&&g.currentRound[p]!==""&&!isNaN(Number(g.currentRound[p])));const nb=document.querySelector("[data-action='next-round']");if(nb)nb.disabled=!ok;const fb=document.querySelector("[data-action='finish-rounds']");if(fb)fb.disabled=!((g.rounds||[]).length>=1||((g.rounds||[]).length===0&&ok))}});

document.querySelector("[data-action='next-round']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(g.currentRound[p])||0)});const newR=[...(g.rounds||[]),rs];const cr={};pl.forEach(p=>{cr[p]=""});
const tt=roundTotals(pl,newR),ss=Object.entries(tt).sort((a,b)=>b[1]-a[1]),w=ss[0],l=ss[ss.length-1],gap=w[1]-l[1];
let lt;
if(g.mode==="mini")lt=randomMiniMid(w[0],l[0],gap,newR.length);
else if(g.mode==="night"){const an=S.activeNight;if(an){let t1w=0,t2w=0;(an.games||[]).forEach(gg=>{const t1s=an.team1.reduce((s,n)=>s+(gg.scores[n]||0),0),t2s=an.team2.reduce((s,n)=>s+(gg.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});lt=randomNightMid(an.team1,an.team2,t1w,t2w,newR.length)}else lt=randomMidFrase(l[0],gap,newR.length)}
else lt=randomMidFrase(l[0],gap,newR.length);
const ng={...g,rounds:newR,currentRound:cr,lastTaunt:lt};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelector("[data-action='finish-rounds']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;let rounds=[...(g.rounds||[])];const cur=g.currentRound;const filled=pl.every(p=>cur[p]!=null&&cur[p]!==""&&!isNaN(Number(cur[p])));if(filled){const rs={};pl.forEach(p=>{rs[p]=Math.max(0,parseInt(cur[p])||0)});rounds.push(rs)}const bonuses=g.bonuses&&pl.some(p=>g.bonuses[p]!=null&&g.bonuses[p]!=="")?{...g.bonuses}:{};if(!Object.keys(bonuses).length)pl.forEach(p=>{bonuses[p]=""});const ng={...g,rounds,step:"bonus",bonuses};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelector("[data-action='back-playing']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const cr={};pl.forEach(p=>{cr[p]=""});const ng={...g,step:"playing",currentRound:cr};up({newGame:ng});S.newGame=ng;persistGame()});

document.querySelectorAll("[data-bplayer]").forEach(inp=>{if(!g)return;inp.oninput=()=>{g.bonuses[inp.dataset.bplayer]=inp.value;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const ok=pl.every(p=>g.bonuses[p]!=null&&g.bonuses[p]!==""&&!isNaN(Number(g.bonuses[p])));const sb=document.querySelector("[data-action='show-summary']");if(sb)sb.className="save-btn "+(ok?"ok":"disabled")}});
document.querySelector("[data-action='show-summary']")?.addEventListener("click",()=>{if(!g)return;const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;const bonuses={};pl.forEach(p=>{bonuses[p]=Math.max(0,parseInt(g.bonuses[p])||0)});up({newGame:{...g,step:"summary",bonuses}})});

// SAVE GAME
document.querySelector("[data-action='save-game']")?.addEventListener("click",()=>{if(!g)return;
  const pl=g.mode==="night"?[...g.team1,...g.team2]:g.selected;
  const totals=roundTotals(pl,g.rounds,g.bonuses);
  const sv={mode:g.mode,scores:totals,date:new Date().toISOString(),roundCount:(g.rounds||[]).length};
  if(g.team1?.length){sv.team1=g.team1;sv.team2=g.team2}
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]),w=sorted[0][0],l=sorted[sorted.length-1][0];

  if(g.mode==="night"){
    // Add to active night
    saveNightGame(sv);
    clearActiveGame();
    // Toast with night score update
    const an=S.activeNight;
    let t1w=0,t2w=0;
    [...(an?.games||[]),sv].forEach(gg=>{const t1s=(g.team1||[]).reduce((s,n)=>s+(gg.scores[n]||0),0),t2s=(g.team2||[]).reduce((s,n)=>s+(gg.scores[n]||0),0);if(t1s>t2s)t1w++;else if(t2s>t1s)t2w++});
    up({newGame:null,view:"noches",toast:{icon:"🍺",title:`${t1w} - ${t2w}`,msg:`Partida guardada. ${t1w===t2w?"¡Empate de momento!":t1w>t2w?g.team1.join(" y ")+" van ganando":g.team2.join(" y ")+" van ganando"}`,color:"#b7950b"}});
  }else{
    saveGame(sv);clearActiveGame();
    let toastMsg,toastIcon="💀",toastTitle="¡Derrota!",toastColor="#e74c3c";
    if(g.mode==="mini"){toastMsg=randomMiniFrase(w,l);toastIcon="👑";toastTitle="¡Victoria!";toastColor="#bb8fce"}
    else if(g.mode==="casual"){toastMsg=`${w} gana con ${sorted[0][1]} puntos`;toastIcon="🎲";toastTitle="Partida guardada";toastColor="#58d68d"}
    else{toastMsg=randomFrase(l)}
    up({newGame:null,view:g.mode==="mini"?"mini":g.mode==="casual"?"libre":"porra",toast:{icon:toastIcon,title:toastTitle,msg:toastMsg,color:toastColor}});
  }
});

// Delete game
document.querySelectorAll("[data-delask]").forEach(b=>{b.onclick=()=>up({confirmDelete:b.dataset.delask})});
document.querySelectorAll("[data-delconfirm]").forEach(b=>{b.onclick=()=>{deleteGame(b.dataset.delconfirm);up({confirmDelete:null})}});
document.querySelectorAll("[data-delcancel]").forEach(b=>{b.onclick=()=>up({confirmDelete:null})});
// Toast
document.querySelectorAll("[data-action='close-toast']").forEach(b=>{b.onclick=e=>{if(e.target===b||e.target.dataset.action==="close-toast")up({toast:null})}});
// Price
document.getElementById("palPriceInput")?.addEventListener("input",e=>{S.palPrice=e.target.value;updateEuros()});
document.querySelector("[data-action='close-ask']")?.addEventListener("click",()=>up({confirmClose:true}));
document.querySelector("[data-action='close-yes']")?.addEventListener("click",()=>{const p=parseFloat(S.palPrice)||0;if(p>0){closePaletilla(p);up({confirmClose:false,palPrice:""})}});
document.querySelector("[data-action='close-no']")?.addEventListener("click",()=>up({confirmClose:false}));
// Players
document.querySelector("[data-action='add-player']")?.addEventListener("click",()=>{const i=document.getElementById("npi");if(i&&i.value.trim()){addPlayer(i.value.trim());i.value=""}});
document.getElementById("npi")?.addEventListener("keydown",e=>{if(e.key==="Enter"){const i=e.target;if(i.value.trim()){addPlayer(i.value.trim());i.value=""}}});
document.querySelectorAll("[data-rmask]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:b.dataset.rmask})});
document.querySelectorAll("[data-rmyes]").forEach(b=>{b.onclick=()=>{removePlayer(b.dataset.rmyes);up({confirmRemovePlayer:null})}});
document.querySelectorAll("[data-rmno]").forEach(b=>{b.onclick=()=>up({confirmRemovePlayer:null})});
if(S.palPrice)updateEuros();}
render();
</script>
</body>
</html>
